<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書誌情報作成ツール v5</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script><style>body{font-family:system-ui,Meiryo,sans-serif;background:#f4f6f8;margin:0;color:#24303b}header{background:#263746;color:white;padding:18px}main{max-width:1100px;margin:auto;padding:18px}.card,.book{background:white;border:1px solid #d7dee5;border-radius:10px;padding:16px;margin-bottom:14px}.grid,.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input[type=text],select,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #bcc7d0;border-radius:7px}textarea{min-height:70px}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.b{background:#2f5f8f;color:#fff}.g{background:#2f6b45;color:#fff}.x{background:#f8e7e7;color:#922}.muted{font-size:12px;color:#6b7783}.results{max-height:330px;overflow:auto;border:1px solid #d7dee5;border-radius:8px}.res{display:flex;gap:8px;padding:9px;border-bottom:1px solid #eee}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.checks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.checks label{border:1px solid #d5dde4;border-radius:7px;padding:8px;background:#fff}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:#53616d}.book h3{margin:0 0 12px;font-size:15px}.notice{background:#edf6ee;border:1px solid #bdd8c3;padding:10px;border-radius:8px;margin-bottom:14px}.bad{background:#fff1f1;border-color:#e6bcbc;color:#8b2525}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e8edf0;text-align:left}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}.checks{grid-template-columns:1fr 1fr}}</style><header><b>書誌情報作成ツール v5</b><div class="muted" style="color:#d8e0e7">日本語版・縦型編集・読み／カテゴリ／出版社を自動入力</div></header><main><div id="notice" class="notice">検索元：Open Library。読みはブラウザ内で自動生成します。</div><section class="card"><b>① 出力形式</b>　<label><input type="radio" name="mode" value="book" checked> 書籍版</label>　<label><input type="radio" name="mode" value="comic"> コミック版</label></section><div class="grid"><section class="card"><b>② 著書名から追加</b><p><input id="title" type="text" placeholder="著書名"></p><p><input id="author2" type="text" placeholder="著者名（任意）"></p><button id="add" class="b">検索リストへ追加</button></section><section class="card"><b>③ 著者名から著書を選ぶ</b><p><input id="author" type="text" placeholder="例：夏目漱石"></p><button id="find" class="b">著書を検索</button><div id="results" class="results"><div class="muted" style="padding:20px">著者名を入力してください</div></div><p><button id="sel" disabled>選択した著書を追加</button></p></section></div><section class="card"><div class="toolbar"><b>④ 検索リスト <span id="cnt">0冊</span></b><div><button id="clear" class="x">すべて削除</button> <button id="lookup" class="b">ネットで一括書誌検索</button></div></div><table><thead><tr><th>著書名</th><th>著者</th><th>状態</th><th></th></tr></thead><tbody id="list"></tbody></table><div id="prog" class="muted"></div></section><section class="card"><div class="toolbar"><b>⑤ 書誌情報の確認・修正</b><button id="excel" class="g">選択中の形式でExcel作成</button></div><div class="muted">横スクロールなし。1冊ずつ縦方向に編集します。</div><div id="detail"></div></section></main><script>const $=x=>document.getElementById(x),jp=/[ぁ-んァ-ヶ一-龠々]/;const C=['','ビジネス・経済','科学・テクノロジー','歴史・地理','哲学・思想','社会・文化','政治・法律','芸術・デザイン','スポーツ','趣味・実用','健康・医療','料理・食','暮らし・生活','教育','語学・辞書','旅行・紀行','エッセイ・随筆','ノンフィクション','小説','ミステリー','SF・ファンタジー','ホラー','恋愛','時代・歴史小説','ライトノベル','漫画・コミック','絵本・児童書','詩・短歌・俳句','戯曲','ユーモア・娯楽','その他'];const P=['','岩波書店','筑摩書房','中央公論新社','新潮社','文藝春秋','講談社','集英社','小学館','角川書店','KADOKAWA','河出書房新社','平凡社','みすず書房','晶文社','作品社','白水社','早川書房','東京創元社','光文社','双葉社','徳間書店','宝島社','扶桑社','PHP研究所','東洋経済新報社','日経BP','日本経済新聞出版','ダイヤモンド社','サンマーク出版','幻冬舎','ポプラ社','福音館書店'];const PA={'iwanami':'岩波書店','chikuma':'筑摩書房','chuokoron':'中央公論新社','shinchosha':'新潮社','bungeishunju':'文藝春秋','kodansha':'講談社','shueisha':'集英社','shogakukan':'小学館','kadokawa shoten':'角川書店','kadokawa':'KADOKAWA','kawade':'河出書房新社','heibonsha':'平凡社','misuzu':'みすず書房','hakusuisha':'白水社','hayakawa':'早川書房','sogensha':'東京創元社','kobunsha':'光文社','futabasha':'双葉社','tokuma':'徳間書店','takarajimasha':'宝島社','fusosha':'扶桑社','php':'PHP研究所','toyokeizai':'東洋経済新報社','nikkei bp':'日経BP','diamond':'ダイヤモンド社','gentosha':'幻冬舎','poplar':'ポプラ社','fukuinkan':'福音館書店'};let B=JSON.parse(localStorage.getItem('bibv5')||'[]'),mode=localStorage.getItem('bibv5mode')||'book',tok,pTok;document.querySelector(`input[name=mode][value=${mode}]`).checked=true;const tr=s=>(s||'').trim(),nm=s=>tr(s).toLowerCase().replace(/[\s・･:：\-―—_()（）\[\]【】]/g,''),e=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('bibv5',JSON.stringify(B));localStorage.setItem('bibv5mode',mode)}function part(t){t=String(t||'');return{upper:/上巻|[（(]上[）)]/.test(t)?'○':'',middle:/中巻|[（(]中[）)]/.test(t)?'○':'',lower:/下巻|[（(]下[）)]/.test(t)?'○':''}}function vol(t){let m=String(t||'').match(/(?:第\s*)?(\d+)\s*巻|vol\.?\s*(\d+)/i);return m?Number(m[1]||m[2]):''}function cat(a){const s=(a||[]).join(' ').toLowerCase();if(/comic|manga|漫画|コミック/.test(s))return'漫画・コミック';if(/mystery|detective|crime|ミステ/.test(s))return'ミステリー';if(/science fiction|fantasy|sf|ファンタジ/.test(s))return'SF・ファンタジー';if(/horror|ホラー/.test(s))return'ホラー';if(/romance|恋愛/.test(s))return'恋愛';if(/historical fiction|時代小説/.test(s))return'時代・歴史小説';if(/history|歴史|geography/.test(s))return'歴史・地理';if(/philosophy|思想|哲学/.test(s))return'哲学・思想';if(/social|culture|社会|文化/.test(s))return'社会・文化';if(/politic|law|政治|法律/.test(s))return'政治・法律';if(/science|technology|科学|技術/.test(s))return'科学・テクノロジー';if(/business|econom|経済|ビジネス/.test(s))return'ビジネス・経済';if(/art|design|芸術|美術/.test(s))return'芸術・デザイン';if(/sport/.test(s))return'スポーツ';if(/health|medical|medicine|健康|医療/.test(s))return'健康・医療';if(/cook|food|料理|食/.test(s))return'料理・食';if(/education|教育/.test(s))return'教育';if(/language|dictionary|語学|辞書/.test(s))return'語学・辞書';if(/travel|旅行/.test(s))return'旅行・紀行';if(/essay|随筆|エッセイ/.test(s))return'エッセイ・随筆';if(/nonfiction|biography|ノンフィクション/.test(s))return'ノンフィクション';if(/poetry|詩|俳句|短歌/.test(s))return'詩・短歌・俳句';if(/drama|play|戯曲/.test(s))return'戯曲';if(/children|juvenile|児童|絵本/.test(s))return'絵本・児童書';if(/fiction|literature|novel|小説|文学/.test(s))return'小説';return'その他'}function pub(r){r=tr(r);if(!r)return['',''];let h=P.find(x=>x&&nm(x)===nm(r));if(h)return[h,''];let l=r.toLowerCase();for(const[a,j]of Object.entries(PA))if(l.includes(a))return[j,''];return['',r]}function getTok(){if(tok)return Promise.resolve(tok);if(pTok)return pTok;pTok=new Promise((res,rej)=>kuromoji.builder({dicPath:'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'}).build((er,t)=>er?rej(er):(tok=t,res(t))));return pTok}async function read(s){try{return (await getTok()).tokenize(s).map(x=>x.reading?x.reading.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)):x.surface_form).join('')}catch{return''}}async function fillR(b){if(!b.titleReading)b.titleReading=await read(b.title);if(!b.authorReading)b.authorReading=await read(b.author);save()}async function api(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('検索サービス応答 '+r.status);return r.json()}function best(d){let ed=d.editions?.docs||[],x=ed.find(z=>(z.language||[]).includes('jpn')&&jp.test(z.title||''))||ed.find(z=>(z.language||[]).includes('jpn'))||{};return{title:jp.test(x.title||'')?x.title:(jp.test(d.title||'')?d.title:x.title||d.title||''),author:(d.author_name||[]).join('、'),publisher:(x.publisher||d.publisher||[])[0]||'',isbn:(x.isbn||d.isbn||[])[0]||'',subject:d.subject||[]}}async function searchA(a){let q=`author:"${a}" AND language:jpn`,f='title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(f)+'&limit=50')}async function searchT(t,a){let q=`title:"${t}" AND language:jpn`+(a?` AND author:"${a}"`:''),f='title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(f)+'&limit=10')}function nb(t,a){let p=part(t);return{id:crypto.randomUUID(),title:tr(t),author:tr(a),titleReading:'',authorReading:'',category:'',publisher:'',publisherFree:'',isbn:'',upper:p.upper,middle:p.middle,lower:p.lower,masterpiece:'',read:'',owned:'○',memo:'',remarks:'',volume:vol(t),status:'検索待ち'}}async function add(t,a){if(!tr(t))return;if(B.some(b=>nm(b.title)===nm(t)&&nm(b.author)===nm(a)))return alert('同じ本があります');let b=nb(t,a);B.push(b);save();render();await fillR(b);render()}function opt(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${e(x)}</option>`).join('')}function inp(l,b,k,full=''){return`<div class="field ${full}"><label>${l}</label><input type="text" data-f="${k}" value="${e(b[k])}"></div>`}function ta(l,b,k){return`<div class="field full"><label>${l}</label><textarea data-f="${k}">${e(b[k])}</textarea></div>`}function ck(l,b,k){return`<label><input type="checkbox" data-c="${k}" ${b[k]==='○'?'checked':''}> ${l}</label>`}function render(){let l=$('list');l.innerHTML=B.length?'':'<tr><td colspan=4 class=muted>まだありません</td></tr>';B.forEach(b=>l.insertAdjacentHTML('beforeend',`<tr><td>${e(b.title)}</td><td>${e(b.author)}</td><td>${b.status}</td><td><button class=x data-d="${b.id}">削除</button></td></tr>`));l.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{B=B.filter(b=>b.id!==x.dataset.d);save();render()});$('cnt').textContent=B.length+'冊';let d=$('detail');d.innerHTML='';B.forEach((b,i)=>{let body=mode==='book'?`<div class=fields>${inp('タイトル',b,'title','full')}${inp('作家',b,'author','full')}${inp('タイトルよみ（自動）',b,'titleReading')}${inp('作家よみ（自動）',b,'authorReading')}<div class=field><label>カテゴリ</label><select data-f=category>${opt(C,b.category)}</select></div><div class=field><label>出版社</label><select data-f=publisher>${opt(P,b.publisher)}</select></div>${inp('出版社自由記載',b,'publisherFree','full')}<div class="field full"><label>巻区分／管理項目</label><div class=checks>${ck('上巻',b,'upper')}${ck('中巻',b,'middle')}${ck('下巻',b,'lower')}${ck('名作',b,'masterpiece')}${ck('読破',b,'read')}${ck('所有',b,'owned')}</div></div>${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}<div class="field full"><label>詳細（ISBN自動）</label><input type=text value="${e(b.isbn?'ISBN '+b.isbn:'')}" readonly></div></div>`:`<div class=fields>${inp('タイトル',b,'title','full')}${inp('作者',b,'author','full')}${inp('出版社',b,'publisher')}${inp('巻数',b,'volume')}${inp('ISBN',b,'isbn')}${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}</div>`;d.insertAdjacentHTML('beforeend',`<div class=book data-id="${b.id}"><h3>${i+1}. ${e(b.title)}</h3>${body}</div>`)});d.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{let b=B.find(z=>z.id===x.closest('.book').dataset.id);b[x.dataset.f]=x.value;save()});d.querySelectorAll('[data-c]').forEach(x=>x.onchange=()=>{let b=B.find(z=>z.id===x.closest('.book').dataset.id);b[x.dataset.c]=x.checked?'○':'';save()})}document.querySelectorAll('[name=mode]').forEach(r=>r.onchange=()=>{mode=r.value;save();render()});$('add').onclick=()=>{add($('title').value,$('author2').value);$('title').value='';$('author2').value=''};$('find').onclick=async()=>{let a=tr($('author').value);if(!a)return;$('results').innerHTML='<div class=muted style="padding:20px">検索中...</div>';try{let data=await searchA(a),m=new Map;for(let d of data.docs||[]){let x=best(d);if(!x.title||!jp.test(x.title)||m.has(nm(x.title)))continue;m.set(nm(x.title),x)}let w=[...m.values()];$('results')._w=w;$('results').innerHTML=w.map((x,i)=>`<label class=res><input type=checkbox class=ck data-i=${i}><span><b>${e(x.title)}</b><div class=muted>${e(x.author)}${x.publisher?' ／ '+e(x.publisher):''}</div></span></label>`).join('')||'<div class=muted style="padding:20px">候補なし</div>';$('results').querySelectorAll('.ck').forEach(c=>c.onchange=()=>$('sel').disabled=![...$('results').querySelectorAll('.ck')].some(x=>x.checked));$('notice').className='notice';$('notice').textContent='検索成功：'+w.length+'件'}catch(er){$('notice').className='notice bad';$('notice').textContent='検索エラー：'+er.message}};$('sel').onclick=async()=>{for(let c of $('results').querySelectorAll('.ck:checked')){let x=$('results')._w[+c.dataset.i];await add(x.title,x.author)}$('sel').disabled=true};$('clear').onclick=()=>{if(confirm('すべて削除しますか？')){B=[];save();render()}};$('lookup').onclick=async()=>{for(let i=0;i<B.length;i++){let b=B[i];$('prog').textContent=`${i+1}/${B.length} ${b.title} を検索中`;try{let d=(await searchT(b.title,b.author)).docs?.[0];if(d){let x=best(d),p=pub(x.publisher),pt=part(x.title);b.title=x.title||b.title;b.author=x.author||b.author;b.publisher=p[0];b.publisherFree=p[1];b.isbn=x.isbn||'';b.category=cat(x.subject);b.volume=vol(b.title);b.upper=pt.upper;b.middle=pt.middle;b.lower=pt.lower;b.status='取得済み';await fillR(b)}else b.status='要確認'}catch{b.status='要確認'}save();render()}$('prog').textContent='完了しました'};$('excel').onclick=()=>{if(typeof XLSX==='undefined')return alert('Excel出力ライブラリを読み込めません');let rows=mode==='book'?[['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...B.map(b=>[b.title,b.author,b.titleReading,b.authorReading,b.category,b.publisher,b.publisherFree,b.upper,b.middle,b.lower,b.masterpiece,b.read,b.owned,b.memo,b.isbn?'ISBN '+b.isbn:''])]:[['タイトル','作者','出版社','巻数','ISBN'],...B.map(b=>[b.title,b.author,b.publisher||b.publisherFree,b.volume,b.isbn?'ISBN '+b.isbn:''])];let wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,mode==='book'?'書籍読込用':'コミック読込用');XLSX.writeFile(wb,(mode==='book'?'書籍読込用':'コミック読込用')+'_'+new Date().toISOString().slice(0,10)+'.xlsx')};render();</script>
