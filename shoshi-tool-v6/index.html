<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書誌情報作成ツール v6</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script><style>body{font-family:system-ui,Meiryo,sans-serif;background:#f4f6f8;margin:0;color:#24303b}header{background:#263746;color:#fff;padding:18px}main{max-width:1050px;margin:auto;padding:18px}.card,.book{background:#fff;border:1px solid #d7dee5;border-radius:10px;padding:16px;margin-bottom:14px}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.grid,.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input[type=text],select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bcc7d0;border-radius:7px}textarea{min-height:70px}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.b{background:#2f5f8f;color:#fff}.g{background:#2f6b45;color:#fff}.x{background:#f8e7e7;color:#922}.s{background:#e7edf2}.muted{font-size:12px;color:#6b7783}.notice{background:#edf6ee;border:1px solid #bdd8c3;padding:10px;border-radius:8px;margin-bottom:14px}.bad{background:#fff1f1;border-color:#e6bcbc;color:#8b2525}.results{max-height:440px;overflow:auto;border:1px solid #d7dee5;border-radius:8px;margin-top:10px}.res{display:flex;gap:10px;padding:10px;border-bottom:1px solid #edf0f2;align-items:flex-start}.res input{margin-top:4px}.res b{font-size:14px}.candidate-meta{font-size:11px;color:#74808b;margin-top:3px}.book h3{margin:0 0 12px;font-size:15px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:#53616d}.checks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.checks label{border:1px solid #d5dde4;border-radius:7px;padding:8px;background:#fff}.bookhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.pill{background:#eef4fa;color:#234a70;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.mode label{margin-right:14px}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column;align-items:stretch}.checks{grid-template-columns:1fr 1fr}}</style><header><b>書誌情報作成ツール v6</b><div class="muted" style="color:#d8e0e7">著者検索 → 日本語タイトル一覧 → チェックして登録</div></header><main><div id="notice" class="notice">一括書誌検索は廃止しました。著者検索で取得した情報を、そのまま選択した本へ登録します。</div><section class="card mode"><b>① 出力形式</b>　<label><input type="radio" name="mode" value="book" checked> 書籍版</label><label><input type="radio" name="mode" value="comic"> コミック版</label></section><section class="card"><b>② 著者名から著書を検索</b><div class="row" style="margin-top:10px"><input id="author" type="text" placeholder="例：夏目漱石"><button id="find" class="b">著書一覧を表示</button></div><div id="results" class="results"><div class="muted" style="padding:24px;text-align:center">著者名を入力してください</div></div><div class="toolbar" style="margin-top:10px"><span id="resultInfo" class="muted"></span><button id="sel" class="s" disabled>チェックした著書を登録</button></div></section><section class="card"><div class="toolbar"><b>③ 選択した書籍 <span id="cnt" class="pill">0冊</span></b><button id="clear" class="x">すべて削除</button></div><div id="detail"></div></section><section class="card"><div class="toolbar"><b>④ Excel出力</b><button id="excel" class="g">選択中の形式でExcel作成</button></div><div class="muted">不足情報がある場合は、各書籍カードの「この本だけ補完」で個別に検索できます。</div></section></main><script>const $=x=>document.getElementById(x),jp=/[ぁ-んァ-ヶ一-龠々]/;const C=['','ビジネス・経済','科学・テクノロジー','歴史・地理','哲学・思想','社会・文化','政治・法律','芸術・デザイン','スポーツ','趣味・実用','健康・医療','料理・食','暮らし・生活','教育','語学・辞書','旅行・紀行','エッセイ・随筆','ノンフィクション','小説','ミステリー','SF・ファンタジー','ホラー','恋愛','時代・歴史小説','ライトノベル','漫画・コミック','絵本・児童書','詩・短歌・俳句','戯曲','ユーモア・娯楽','その他'];const P=['','岩波書店','筑摩書房','中央公論新社','新潮社','文藝春秋','講談社','集英社','小学館','角川書店','KADOKAWA','河出書房新社','平凡社','みすず書房','晶文社','作品社','白水社','早川書房','東京創元社','光文社','双葉社','徳間書店','宝島社','扶桑社','PHP研究所','東洋経済新報社','日経BP','日本経済新聞出版','ダイヤモンド社','サンマーク出版','幻冬舎','ポプラ社','福音館書店'];const PA={'iwanami':'岩波書店','chikuma':'筑摩書房','chuokoron':'中央公論新社','shinchosha':'新潮社','bungeishunju':'文藝春秋','kodansha':'講談社','shueisha':'集英社','shogakukan':'小学館','kadokawa shoten':'角川書店','kadokawa':'KADOKAWA','kawade':'河出書房新社','heibonsha':'平凡社','misuzu':'みすず書房','hakusuisha':'白水社','hayakawa':'早川書房','sogensha':'東京創元社','kobunsha':'光文社','futabasha':'双葉社','tokuma':'徳間書店','takarajimasha':'宝島社','fusosha':'扶桑社','php':'PHP研究所','toyokeizai':'東洋経済新報社','nikkei bp':'日経BP','diamond':'ダイヤモンド社','gentosha':'幻冬舎','poplar':'ポプラ社','fukuinkan':'福音館書店'};let B=JSON.parse(localStorage.getItem('bibv6')||'[]'),mode=localStorage.getItem('bibv6mode')||'book',tok,pTok,candidates=[];document.querySelector(`input[name=mode][value=${mode}]`).checked=true;const tr=s=>(s||'').trim(),nm=s=>tr(s).toLowerCase().replace(/[\s・･:：\-―—_()（）\[\]【】『』「」]/g,''),e=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('bibv6',JSON.stringify(B));localStorage.setItem('bibv6mode',mode)}function part(t){t=String(t||'');return{upper:/上巻|[（(]上[）)]/.test(t)?'○':'',middle:/中巻|[（(]中[）)]/.test(t)?'○':'',lower:/下巻|[（(]下[）)]/.test(t)?'○':''}}function vol(t){let m=String(t||'').match(/(?:第\s*)?(\d+)\s*巻|vol\.?\s*(\d+)/i);return m?Number(m[1]||m[2]):''}function cat(a){const s=(a||[]).join(' ').toLowerCase();if(/comic|manga|漫画|コミック/.test(s))return'漫画・コミック';if(/mystery|detective|crime|ミステ/.test(s))return'ミステリー';if(/science fiction|fantasy|sf|ファンタジ/.test(s))return'SF・ファンタジー';if(/horror|ホラー/.test(s))return'ホラー';if(/romance|恋愛/.test(s))return'恋愛';if(/historical fiction|時代小説/.test(s))return'時代・歴史小説';if(/history|歴史|geography/.test(s))return'歴史・地理';if(/philosophy|思想|哲学/.test(s))return'哲学・思想';if(/social|culture|社会|文化/.test(s))return'社会・文化';if(/politic|law|政治|法律/.test(s))return'政治・法律';if(/science|technology|科学|技術/.test(s))return'科学・テクノロジー';if(/business|econom|経済|ビジネス/.test(s))return'ビジネス・経済';if(/art|design|芸術|美術/.test(s))return'芸術・デザイン';if(/sport/.test(s))return'スポーツ';if(/health|medical|medicine|健康|医療/.test(s))return'健康・医療';if(/cook|food|料理|食/.test(s))return'料理・食';if(/education|教育/.test(s))return'教育';if(/language|dictionary|語学|辞書/.test(s))return'語学・辞書';if(/travel|旅行/.test(s))return'旅行・紀行';if(/essay|随筆|エッセイ/.test(s))return'エッセイ・随筆';if(/nonfiction|biography|ノンフィクション/.test(s))return'ノンフィクション';if(/poetry|詩|俳句|短歌/.test(s))return'詩・短歌・俳句';if(/drama|play|戯曲/.test(s))return'戯曲';if(/children|juvenile|児童|絵本/.test(s))return'絵本・児童書';if(/fiction|literature|novel|小説|文学/.test(s))return'小説';return'その他'}function pub(r){r=tr(r);if(!r)return['',''];let h=P.find(x=>x&&nm(x)===nm(r));if(h)return[h,''];let l=r.toLowerCase();for(const[a,j]of Object.entries(PA))if(l.includes(a))return[j,''];return['',r]}function getTok(){if(tok)return Promise.resolve(tok);if(pTok)return pTok;pTok=new Promise((res,rej)=>{if(typeof kuromoji==='undefined')return rej(Error('読みライブラリなし'));kuromoji.builder({dicPath:'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'}).build((er,t)=>er?rej(er):(tok=t,res(t)))});return pTok}async function read(s){try{return (await getTok()).tokenize(s).map(x=>x.reading?x.reading.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)):x.surface_form).join('')}catch{return''}}async function fillR(b){if(!b.titleReading)b.titleReading=await read(b.title);if(!b.authorReading)b.authorReading=await read(b.author);save();render()}async function api(u){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),15000);try{let r=await fetch(u,{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('検索サービス応答 '+r.status);return await r.json()}finally{clearTimeout(timer)}}function editionBest(d){let ed=d.editions?.docs||[];let x=ed.find(z=>(z.language||[]).includes('jpn')&&jp.test(z.title||''))||ed.find(z=>(z.language||[]).includes('jpn'))||{};let title=jp.test(x.title||'')?x.title:(jp.test(d.title||'')?d.title:x.title||d.title||'');let variants=[...new Set(ed.filter(z=>(z.language||[]).includes('jpn')).map(z=>tr(z.title)).filter(Boolean))].filter(v=>nm(v)!==nm(title)).slice(0,3);return{workKey:d.key||'',title,variants,author:(d.author_name||[]).join('、'),publisher:(x.publisher||d.publisher||[])[0]||'',isbn:(x.isbn||d.isbn||[])[0]||'',subject:d.subject||[]}}async function searchA(a){let q=`author:"${a.replaceAll('"','')}" AND language:jpn`,f='key,title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(f)+'&limit=100')}async function searchT(t,a){let q=`title:"${t.replaceAll('"','')}" AND language:jpn`+(a?` AND author:"${a.replaceAll('"','')}"`:''),f='key,title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(f)+'&limit=10')}function makeBook(x){let pp=pub(x.publisher),pt=part(x.title);return{id:crypto.randomUUID(),workKey:x.workKey||'',title:x.title,author:x.author,titleReading:'',authorReading:'',category:cat(x.subject),publisher:pp[0],publisherFree:pp[1],isbn:x.isbn||'',upper:pt.upper,middle:pt.middle,lower:pt.lower,masterpiece:'',read:'',owned:'○',memo:'',remarks:'',volume:vol(x.title),status:'取得済み'}}function opt(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${e(x)}</option>`).join('')}function inp(l,b,k,full=''){return`<div class="field ${full}"><label>${l}</label><input type="text" data-f="${k}" value="${e(b[k]||'')}"></div>`}function ta(l,b,k){return`<div class="field full"><label>${l}</label><textarea data-f="${k}">${e(b[k]||'')}</textarea></div>`}function ck(l,b,k){return`<label><input type="checkbox" data-c="${k}" ${b[k]==='○'?'checked':''}> ${l}</label>`}function render(){ $('cnt').textContent=B.length+'冊';$('detail').innerHTML=B.length?'':'<div class="muted" style="padding:18px 0">著者検索から本を選んでください。</div>';B.forEach((b,i)=>{let html;if(mode==='book'){html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作家',b,'author','full')}${inp('タイトルよみ',b,'titleReading')}${inp('作家よみ',b,'authorReading')}<div class="field"><label>カテゴリ</label><select data-f="category">${opt(C,b.category)}</select></div><div class="field"><label>出版社</label><select data-f="publisher">${opt(P,b.publisher)}</select></div>${inp('出版社自由記載',b,'publisherFree','full')}<div class="field full"><label>上・中・下</label><div class="checks">${ck('上巻',b,'upper')}${ck('中巻',b,'middle')}${ck('下巻',b,'lower')}${ck('名作',b,'masterpiece')}${ck('読破',b,'read')}${ck('所有',b,'owned')}</div></div>${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}<div class="field full"><label>詳細（ISBN）</label><input type="text" value="${e(b.isbn?'ISBN：'+b.isbn:'')}" readonly></div></div>`}else{html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作者',b,'author','full')}${inp('出版社',b,'publisher')}${inp('巻数',b,'volume')}${inp('ISBN',b,'isbn')}${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}</div>`}$('detail').insertAdjacentHTML('beforeend',`<div class="book" data-id="${b.id}"><div class="bookhead"><h3>${i+1}. ${e(b.title)}</h3><div><button class="s" data-fill="${b.id}">この本だけ補完</button> <button class="x" data-del="${b.id}">削除</button></div></div>${html}</div>`)});$('detail').querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{let b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.f]=el.value;save()});$('detail').querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{let b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.c]=el.checked?'○':'';save()});$('detail').querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{B=B.filter(x=>x.id!==el.dataset.del);save();render()});$('detail').querySelectorAll('[data-fill]').forEach(el=>el.onclick=async()=>{let b=B.find(x=>x.id===el.dataset.fill);el.disabled=true;el.textContent='補完中…';try{let d=await searchT(b.title,b.author),x=d.docs?.[0]?editionBest(d.docs[0]):null;if(x){let pp=pub(x.publisher);if(!b.publisher&&!b.publisherFree){b.publisher=pp[0];b.publisherFree=pp[1]}if(!b.isbn)b.isbn=x.isbn||'';if(!b.category||b.category==='その他')b.category=cat(x.subject);b.status='補完済み';await fillR(b);save();render()}}catch(err){alert('補完できませんでした：'+err.message)}finally{if(document.body.contains(el)){el.disabled=false;el.textContent='この本だけ補完'}}})}document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{mode=r.value;save();render()});$('find').onclick=async()=>{let a=tr($('author').value);if(!a)return;$('results').innerHTML='<div class="muted" style="padding:24px">検索中…</div>';$('sel').disabled=true;$('notice').className='notice';$('notice').textContent='日本語版の作品一覧を検索中…';try{let d=await searchA(a),map=new Map;for(const raw of d.docs||[]){let x=editionBest(raw);if(!x.title||!jp.test(x.title))continue;let key=x.workKey||nm(x.title);if(!map.has(key))map.set(key,x)}candidates=[...map.values()].sort((a,b)=>a.title.localeCompare(b.title,'ja'));$('results').innerHTML=candidates.length?candidates.map((x,i)=>`<label class="res"><input type="checkbox" class="cand" data-i="${i}"><span><b>${e(x.title)}</b>${x.variants.length?`<div class="candidate-meta">別表記：${e(x.variants.join(' ／ '))}</div>`:''}<div class="candidate-meta">${e(x.publisher||'出版社不明')}${x.isbn?' ／ ISBN '+e(x.isbn):''}</div></span></label>`).join(''):'<div class="muted" style="padding:24px">日本語タイトルが見つかりませんでした。</div>';$('results').querySelectorAll('.cand').forEach(c=>c.onchange=()=>$('sel').disabled=![...$('results').querySelectorAll('.cand')].some(x=>x.checked));$('resultInfo').textContent=candidates.length+'作品';$('notice').textContent='作品一覧を取得しました。チェックした本だけ登録してください。'}catch(err){$('notice').className='notice bad';$('notice').textContent='検索エラー：'+err.message;$('results').innerHTML='<div class="muted" style="padding:24px">'+e(err.message)+'</div>'}};$('sel').onclick=async()=>{let selected=[...$('results').querySelectorAll('.cand:checked')].map(c=>candidates[+c.dataset.i]);let added=[];for(const x of selected){if(B.some(b=>(b.workKey&&x.workKey&&b.workKey===x.workKey)||nm(b.title)===nm(x.title)))continue;let b=makeBook(x);B.push(b);added.push(b)}save();render();$('sel').disabled=true;for(const b of added)fillR(b).then(render);$('notice').textContent=added.length+'冊を登録しました。追加の一括通信は行っていません。'};$('clear').onclick=()=>{if(B.length&&confirm('選択した書籍をすべて削除しますか？')){B=[];save();render()}};function out(rows,sheet,name){if(typeof XLSX==='undefined')return alert('Excelライブラリを読み込めません');let wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}$('excel').onclick=()=>{if(mode==='book')out([['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...B.map(b=>[b.title,b.author,b.titleReading,b.authorReading,b.category,b.publisher,b.publisherFree,b.upper,b.middle,b.lower,b.masterpiece,b.read,b.owned,b.memo,b.isbn?'ISBN：'+b.isbn:''])],'書籍読込用','書籍読込用');else out([['タイトル','作者','出版社','巻数','ISBN'],...B.map(b=>[b.title,b.author,b.publisher||b.publisherFree,b.volume,b.isbn?'ISBN '+b.isbn:''])],'コミック読込用','コミック読込用')};render();</script>
