<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書誌情報作成ツール</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>body{font-family:system-ui,Meiryo,sans-serif;background:#f4f6f8;margin:0;color:#1f2933}header{background:#263746;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:18px}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c{background:#fff;border:1px solid #d7dee5;border-radius:10px;padding:16px;margin-bottom:14px}h2{font-size:17px;margin:0 0 10px}input,button{font:inherit}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bcc7d0;border-radius:7px;margin:4px 0 8px}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.b{background:#2f5f8f;color:#fff}.s{background:#e8edf2}.x{background:#f8e7e7;color:#922}.green{background:#2f6b45;color:#fff}.results{border:1px solid #d7dee5;border-radius:8px;max-height:320px;overflow:auto}.r{display:flex;gap:8px;padding:9px;border-bottom:1px solid #eee}.muted{color:#66727f;font-size:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e5eaee;text-align:left;vertical-align:top}th{background:#f2f5f7}.tw{overflow:auto}.edit input{min-width:120px;margin:0;padding:5px}.edit .t{min-width:220px}.notice{background:#edf6ee;border:1px solid #bdd8c3;padding:10px;border-radius:8px;margin-bottom:14px;font-size:13px}.bad{background:#fff1f1;border-color:#e6bcbc;color:#8b2525}@media(max-width:760px){.g{grid-template-columns:1fr}}</style></head><body><header><b>書誌情報作成ツール Web版</b><div style="font-size:12px;color:#d9e2ea">著書名／著者名から検索し、書籍版・コミック版Excelを作成</div></header><main><div class="notice" id="notice">検索元：Open Library。APIキー不要の公開検索を使用します。</div><div class="g"><section class="c"><h2>① 著書名から追加</h2><input id="title" placeholder="著書名"><input id="author2" placeholder="著者名（任意）"><button class="b" id="add">検索リストへ追加</button></section><section class="c"><h2>② 著者名から著書を選ぶ</h2><input id="author" placeholder="著者名（例：夏目漱石）"><button class="b" id="find">著書を検索</button><div id="results" class="results"><div class="muted" style="padding:20px;text-align:center">著者名を入力してください</div></div><button class="s" id="sel" disabled>選択した著書を追加</button></section></div><section class="c"><h2>③ 検索リスト <span id="cnt" class="muted">0冊</span></h2><div class="tw"><table><thead><tr><th>著書名</th><th>著者</th><th>状態</th><th></th></tr></thead><tbody id="list"></tbody></table></div><div class="bar"><button class="x" id="clear">すべて削除</button><button class="b" id="lookup">ネットで一括書誌検索</button></div><div id="prog" class="muted"></div></section><section class="c"><h2>④ 書誌情報の確認・修正</h2><div class="tw"><table class="edit"><thead><tr><th>タイトル</th><th>作者</th><th>出版社</th><th>ISBN</th><th>巻数</th><th>カテゴリ</th></tr></thead><tbody id="detail"></tbody></table></div><div class="bar"><button class="green" id="book">書籍版Excel</button><button class="green" id="comic">コミック版Excel</button></div></section></main><script>let books=JSON.parse(localStorage.getItem('bibweb_ol')||'[]');const q=s=>(s||'').trim(),k=s=>q(s).toLowerCase().replace(/[\s・･:：\-―—_()（）\[\]【】]/g,''),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('bibweb_ol',JSON.stringify(books))}function vol(t){let m=String(t||'').match(/(?:第\s*)?(\d+)\s*巻|(?:vol\.?\s*)(\d+)/i);return m?Number(m[1]||m[2]):''}function cat(s){s=(s||[]).join(' ');if(/comic|manga|漫画|コミック/i.test(s))return'コミック';if(/mystery|detective|ミステ/i.test(s))return'ミステリー';if(/history|歴史/i.test(s))return'歴史';if(/literature|fiction|文学|小説/i.test(s))return'文学';return''}function jsonp(url){return new Promise((resolve,reject)=>{const cb='olcb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script');let done=false;const stop=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch{};sc.remove()};window[cb]=data=>{stop();resolve(data)};sc.onerror=()=>{stop();reject(Error('検索サービスへ接続できません'))};sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(sc);const timer=setTimeout(()=>{stop();reject(Error('検索がタイムアウトしました'))},15000)})}async function olAuthor(name){const u='https://openlibrary.org/search.json?author='+encodeURIComponent(name)+'&fields=title,author_name,publisher,isbn,subject,first_publish_year&limit=50';return jsonp(u)}async function olTitle(title,author){let u='https://openlibrary.org/search.json?title='+encodeURIComponent(title);if(author)u+='&author='+encodeURIComponent(author);u+='&fields=title,author_name,publisher,isbn,subject,first_publish_year&limit=10';return jsonp(u)}function addBook(t,a){t=q(t);a=q(a);if(!t)return false;if(books.some(b=>k(b.title)===k(t)&&k(b.author)===k(a))){alert('同じ本があります');return false}books.push({id:crypto.randomUUID(),title:t,author:a,status:'検索待ち',publisher:'',isbn:'',volume:vol(t),category:''});save();render();return true}function render(){let l=document.getElementById('list');l.innerHTML=books.length?'':'<tr><td colspan="4" class="muted">まだありません</td></tr>';books.forEach(b=>l.insertAdjacentHTML('beforeend',`<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${b.status}</td><td><button class="x" data-d="${b.id}">削除</button></td></tr>`));l.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{books=books.filter(b=>b.id!==x.dataset.d);save();render()});document.getElementById('cnt').textContent=books.length+'冊';let d=document.getElementById('detail');d.innerHTML='';books.filter(b=>b.status!=='検索待ち').forEach(b=>d.insertAdjacentHTML('beforeend',`<tr data-id="${b.id}"><td><input class="t" data-f="title" value="${esc(b.title)}"></td><td><input data-f="author" value="${esc(b.author)}"></td><td><input data-f="publisher" value="${esc(b.publisher)}"></td><td><input data-f="isbn" value="${esc(b.isbn)}"></td><td><input data-f="volume" value="${esc(b.volume)}"></td><td><input data-f="category" value="${esc(b.category)}"></td></tr>`));d.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{let b=books.find(x=>x.id===i.closest('tr').dataset.id);b[i.dataset.f]=i.value;save()})}document.getElementById('add').onclick=()=>{if(addBook(title.value,author2.value)){title.value='';author2.value=''}};document.getElementById('find').onclick=async()=>{let a=q(author.value);if(!a)return;results.innerHTML='<div class="muted" style="padding:20px">検索中...</div>';sel.disabled=true;notice.className='notice';notice.textContent='検索元：Open Library。検索しています。';try{let data=await olAuthor(a),m=new Map;for(let d of data.docs||[]){let t=q(d.title);if(!t||m.has(k(t)))continue;m.set(k(t),{title:t,author:(d.author_name||[a]).join('、'),publisher:(d.publisher||[])[0]||'',isbn:(d.isbn||[])[0]||''})}let w=[...m.values()];results._w=w;results.innerHTML=w.length?w.map((x,n)=>`<label class="r"><input type="checkbox" class="ck" data-i="${n}"><span><b>${esc(x.title)}</b><div class="muted">${esc(x.author)}${x.publisher?' ／ '+esc(x.publisher):''}${x.isbn?' ／ ISBN '+esc(x.isbn):''}</div></span></label>`).join(''):'<div class="muted" style="padding:20px">候補が見つかりませんでした</div>';results.querySelectorAll('.ck').forEach(c=>c.onchange=()=>sel.disabled=![...results.querySelectorAll('.ck')].some(x=>x.checked));notice.textContent='検索成功：Open Libraryから候補を取得しました。'}catch(e){notice.className='notice bad';notice.textContent='検索エラー：'+e.message;results.innerHTML='<div class="muted" style="padding:20px">'+esc(e.message)+'</div>'}};document.getElementById('sel').onclick=()=>{for(let c of results.querySelectorAll('.ck:checked')){let x=results._w[+c.dataset.i];addBook(x.title,x.author)}sel.disabled=true};document.getElementById('clear').onclick=()=>{if(confirm('すべて削除しますか？')){books=[];save();render()}};document.getElementById('lookup').onclick=async()=>{for(let n=0;n<books.length;n++){let b=books[n];prog.textContent=`${n+1}/${books.length} ${b.title} を検索中`;try{let data=await olTitle(b.title,b.author),d=(data.docs||[])[0];if(d){b.title=d.title||b.title;b.author=(d.author_name||[]).join('、')||b.author;b.publisher=(d.publisher||[])[0]||'';b.isbn=(d.isbn||[])[0]||'';b.volume=vol(b.title);b.category=cat(d.subject);b.status='取得済み'}else b.status='要確認'}catch(e){b.status='要確認'}save();render()}prog.textContent='完了しました'};function out(rows,sheet,name){if(typeof XLSX==='undefined')return alert('Excel出力ライブラリを読み込めません');let wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}document.getElementById('comic').onclick=()=>out([['タイトル','作者','出版社','巻数','ISBN'],...books.filter(b=>b.status!=='検索待ち').map(b=>[b.title,b.author,b.publisher,b.volume,b.isbn?'ISBN '+b.isbn:''])],'コミック読込用','コミック読込用');document.getElementById('book').onclick=()=>out([['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...books.filter(b=>b.status!=='検索待ち').map(b=>[b.title,b.author,'','',b.category,b.publisher,'','','','','','','○','',b.isbn?'ISBN '+b.isbn:''])],'書籍読込用','書籍読込用');render();</script></body></html>
