<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173a63">
<title>まーちゃんの書斎</title>
<meta name="application-name" content="まーちゃんの書斎">
<meta name="gonbee-icon-marker" content="1">
<script src="xlsx.full.min.js"></script>
<style>
:root{
  --ink:#17324d;--muted:#61788f;--paper:#e9f2fa;--card:#f8fbff;
  --accent:#2477b8;--accent-dark:#155486;--line:#b7cde0;
  --navy:#102f50;--gold:#b8862b;--green:#347768
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
body{
  background-color:#0d2b49;
  background-image:
    radial-gradient(circle at 18% 10%,#2d689a66 0 18%,transparent 42%),
    radial-gradient(circle at 84% 78%,#163f6766 0 20%,transparent 46%),
    repeating-linear-gradient(90deg,#0e2b48 0 78px,#123657 78px 82px);
  background-attachment:fixed
}
button,input,textarea{font:inherit}
button{cursor:pointer}
main{width:100%;max-width:900px;min-height:100dvh;margin:auto;padding-bottom:32px}
header{
  position:sticky;z-index:3;top:0;padding:calc(16px + env(safe-area-inset-top)) 12px 11px;
  color:#f4f8fc;background:#12395ee9;backdrop-filter:blur(16px);
  border-bottom:1px solid #5f86a8
}
.eyebrow{color:#8fc9f0;font:700 10px Georgia;letter-spacing:.2em}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:3px 0 13px}
.title>div{min-width:0}
h1{margin:0;font:700 clamp(31px,7.5vw,45px)/1.08 Georgia,"Yu Mincho",serif;white-space:nowrap}
.title p{margin:3px 0;color:#c7dced;font-size:14px}
.add{
  flex:none;width:52px;height:52px;border:0;border-radius:50%;color:#fff;background:var(--accent);
  font-size:30px;box-shadow:0 8px 20px #071b2c77
}
.search{
  display:flex;align-items:center;gap:8px;height:50px;padding:0 14px;border:1px solid #769bb9;
  border-radius:15px;color:#244866;background:#f5faff
}
.search input{min-width:0;flex:1;border:0;outline:0;color:var(--ink);background:transparent;font-size:17px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.sort{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.sort::-webkit-scrollbar{display:none}
.sort button,.data{
  flex:none;padding:8px 12px;border:0;border-radius:99px;color:#cbe0f0;background:transparent;
  font-size:13px;font-weight:800
}
.sort .active{color:#14304a;background:#dcebf6}
#list{padding:6px 4px}
.group{
  margin:15px 8px 3px;color:#d8e9f6;font:700 14px "Yu Mincho",serif;
  letter-spacing:.06em;text-shadow:0 2px 4px #071a2c
}
.card{
  display:flex;align-items:center;gap:10px;min-height:84px;margin:6px 0;padding:9px 10px;
  border:1px solid var(--line);border-radius:18px;background:#f7fbfff4;
  box-shadow:0 9px 28px #061b2d66
}
.info{min-width:0;flex:1;display:flex;gap:10px;padding:5px 0;border:0;text-align:left;background:transparent}
.mark{width:5px;flex:none;border-radius:4px;background:var(--accent)}
.text{min-width:0;display:flex;flex-direction:column;justify-content:center}
.name-row{min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.text strong,.text small{overflow:hidden;text-overflow:ellipsis}
.text strong{min-width:0;font-family:"Yu Mincho",Georgia,serif;font-size:19px;white-space:nowrap}
.text small{margin-top:5px;color:var(--muted);font-size:13px;white-space:nowrap}
.badge{flex:none;padding:3px 7px;border-radius:99px;color:#fff;font-style:normal;font-size:10px;font-weight:900}
.finished{background:var(--green)}
.masterpiece{color:#fff8dc;background:var(--gold)}
.part-checks{
  flex:none;display:flex;gap:3px;padding:5px;border:1px solid #a8c2d8;border-radius:12px;
  background:#e4f0f8
}
.part-checks label{
  display:grid;place-items:center;width:34px;height:39px;border-radius:8px;color:#4c6b83;
  background:#f7fbff;font-size:12px;font-weight:900
}
.part-checks label:has(input:checked){color:#fff;background:var(--accent-dark)}
.part-checks input{position:absolute;opacity:0;pointer-events:none}
.selection-bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:7px;
  margin:7px 4px;padding:9px 10px;border:1px solid #9bbbd3;border-radius:15px;
  color:#173a63;background:#e9f4fbf5;box-shadow:0 8px 24px #061b2d55
}
.selection-bar[hidden]{display:none}
.selection-bar strong{margin-right:auto;font-size:14px}
.selection-bar button{padding:8px 10px;border:0;border-radius:10px;color:#244b68;background:#d1e5f3;font-weight:800}
.selection-bar .delete-selected{color:#fff;background:#8b4b4b}
.card.selected{border-color:#2d79ad;background:#dceefa;box-shadow:0 0 0 3px #76add155,0 9px 28px #061b2d66}
.select-dot{display:none;place-items:center;width:27px;height:27px;flex:none;border:2px solid #6f98b5;border-radius:50%;color:#fff;background:#fff;font-size:17px;font-weight:900}
.selecting .select-dot{display:grid}
.card.selected .select-dot{border-color:#236f9f;background:#236f9f}
.selecting .part-checks{opacity:.42;pointer-events:none}
.empty{padding:72px 10px;text-align:center;color:#e4f1fa;text-shadow:0 2px 5px #07192a}
dialog{
  width:min(calc(100% - 24px),520px);max-height:calc(100dvh - 22px);margin:auto auto 11px;padding:22px;
  overflow:auto;border:1px solid #8fb1cc;border-radius:25px;color:var(--ink);background:#edf6fc;
  box-shadow:0 24px 80px #04152588
}
dialog::backdrop{background:#07192ab8;backdrop-filter:blur(3px)}
.dh{display:flex;justify-content:space-between;align-items:start;margin-bottom:17px}
.dh h2{margin:0;font:700 27px Georgia,"Yu Mincho",serif}
.dh button{width:40px;height:40px;border:0;border-radius:50%;color:#244b6b;background:#d7e8f5;font-size:23px}
.field{display:block;margin:13px 0;color:#4f7089;font-size:13px;font-weight:800}
.field input,.field textarea{
  width:100%;margin-top:6px;padding:13px;border:1px solid #a9c4d9;border-radius:13px;
  color:var(--ink);background:#fbfdff;font-size:16px
}
.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-label{margin:18px 0 8px;color:#355d7b;font-size:13px;font-weight:900}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.check-grid.categories{grid-template-columns:repeat(2,1fr)}
.check-tile{
  display:flex;align-items:center;gap:7px;min-height:44px;padding:9px;border:1px solid #a9c4d9;
  border-radius:12px;background:#e3eff8;font-size:13px;font-weight:800
}
.check-tile input{width:19px;height:19px;accent-color:var(--accent)}
.status-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.status-fields .check-tile{min-height:50px;font-size:15px}
.primary,.danger,.import,.help{
  display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;
  text-align:center;font-weight:900
}
.primary{color:#fff;background:var(--accent)}
.danger{color:#a3323b;background:#ffe8ec}
.import,.help{color:#244c6b;background:#d9e9f5}
.import input{display:none}
.note{color:#55748c;font-size:13px;line-height:1.7}
.toast{
  position:fixed;z-index:10;left:50%;bottom:24px;transform:translateX(-50%);
  padding:11px 17px;border-radius:99px;color:#fff;background:#102f50ee;font-size:14px;white-space:nowrap
}
@media(max-width:480px){
  header{padding:calc(9px + env(safe-area-inset-top)) 8px 7px}
  .eyebrow{display:none}.title{margin:0 0 7px}h1{font-size:31px}.title p{font-size:13px}
  .add{width:48px;height:48px}.search{height:46px}.toolbar{margin-top:4px}
  .sort button,.data{padding:7px 10px;font-size:12px}#list{padding:3px 4px}
  .card{gap:7px;min-height:67px;margin:4px 0;padding:6px 7px}
  .text strong{font-size:17px}.text small{font-size:12px}
  .part-checks{gap:2px;padding:3px}.part-checks label{width:29px;height:36px;font-size:11px}
  dialog{width:calc(100% - 16px);padding:19px}.dh h2{font-size:28px}
  .field{font-size:14px}.field input,.field textarea{padding:13px;font-size:17px}
  .two-fields{grid-template-columns:1fr}.check-grid.categories{grid-template-columns:1fr 1fr}
}
@media(max-width:360px){
  .part-checks label{width:26px}.text strong{font-size:16px}.badge{padding:2px 5px}
}
</style>
</head>
<body><main>
<header>
  <div class="eyebrow">MY STUDY LIBRARY</div>
  <div class="title"><div><h1>まーちゃんの書斎</h1><p id="summary"></p></div><button class="add" onclick="openEdit()" aria-label="作品を追加">＋</button></div>
  <label class="search">⌕ <input id="search" placeholder="タイトル・作家・カテゴリ・メモを検索" oninput="render()"></label>
  <div class="toolbar">
    <div class="sort">
      <button data-sort="kana" class="active">50音</button>
      <button data-sort="author">作家別</button>
      <button data-sort="category">カテゴリ</button>
    </div>
    <button class="data" onclick="dataDialog.showModal()" aria-label="データ管理">•••</button>
  </div>
</header>
<div id="selectionBar" class="selection-bar" hidden>
  <strong id="selectionCount">0作品を選択</strong>
  <button onclick="selectAllShown()">表示中を全選択</button>
  <button class="delete-selected" onclick="deleteSelected()">削除</button>
  <button onclick="exitSelection()">完了</button>
</div>
<div id="list"></div>
</main>

<dialog id="editDialog">
  <div class="dh"><h2 id="dialogTitle">作品を追加</h2><button onclick="editDialog.close()" aria-label="閉じる">×</button></div>
  <label class="field">タイトル<input id="title" autocomplete="off"></label>
  <label class="field">タイトルのよみ（50音順に使用）<input id="titleKana" placeholder="例：こころ" autocomplete="off"></label>
  <div class="two-fields">
    <label class="field">作家<input id="author" autocomplete="off"></label>
    <label class="field">作家のよみ<input id="authorKana" placeholder="例：なつめ そうせき" autocomplete="off"></label>
  </div>
  <div class="section-label">分冊</div>
  <div class="check-grid">
    <label class="check-tile"><input id="partUpper" type="checkbox"><span>上巻</span></label>
    <label class="check-tile"><input id="partMiddle" type="checkbox"><span>中巻</span></label>
    <label class="check-tile"><input id="partLower" type="checkbox"><span>下巻</span></label>
  </div>
  <div class="section-label">カテゴリ（複数選択可）</div>
  <div id="categoryChoices" class="check-grid categories"></div>
  <div class="status-fields">
    <label class="check-tile"><input id="masterpiece" type="checkbox"><span>名作</span></label>
    <label class="check-tile"><input id="finished" type="checkbox"><span>読破</span></label>
  </div>
  <label class="field">メモ<textarea id="memo" rows="2"></textarea></label>
  <div class="section-label">出版社（複数選択可）</div>
  <div id="publisherChoices" class="check-grid categories"></div>
  <label class="field">その他の出版社・自由記載<input id="publisherOther" placeholder="一覧にない出版社など"></label>
  <label class="field">詳細<textarea id="details" rows="3" placeholder="感想・貸出先などを自由に入力"></textarea></label>
  <button class="primary" onclick="save()">保存</button>
  <button id="deleteBtn" class="danger" onclick="removeItem()">この作品を削除</button>
</dialog>

<dialog id="dataDialog">
  <div class="dh"><h2>データ管理</h2><button onclick="dataDialog.close()" aria-label="閉じる">×</button></div>
  <p class="note">作品データはこの端末内へ自動保存されます。漫画版とは別の領域です。機種変更や再インストールの前にはバックアップを保存してください。</p>
  <button class="primary" onclick="backup()">端末へバックアップを保存</button>
  <label class="import">バックアップを読み込む<input type="file" accept=".json,application/json" onchange="restore(event)"></label>
  <label class="import">Excelから作品を追加<input type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" onchange="importExcel(event)"></label>
  <p class="note">Excelは1列目だけでも読み込めます。見出しを付ける場合は「タイトル、作家、タイトルよみ、作家よみ、カテゴリ、出版社、上巻、中巻、下巻、名作、読破、メモ、詳細」に対応します。</p>
  <button class="help" onclick="alert('通常データは端末内へ自動保存されます。バックアップは日付入りのJSONファイルとして保存できます。Excelの作品は現在の一覧へ追加され、同じタイトルと作家の重複は除外されます。')">データ管理の使い方</button>
</dialog>
<div id="toast" class="toast" hidden></div>

<script>
const KEY="novel-study-mobile-v1";
const CATEGORY_OPTIONS=[
  "文学","恋愛","ミステリー","SF","ファンタジー","歴史・時代","ホラー",
  "青春","冒険","エッセイ","ノンフィクション","児童・YA","その他"
];
const PUBLISHER_OPTIONS=[
  "新潮社","文藝春秋","講談社","集英社","小学館","KADOKAWA","幻冬舎",
  "中央公論新社","早川書房","東京創元社","筑摩書房","岩波書店",
  "河出書房新社","徳間書店","光文社","双葉社","宝島社","PHP研究所","ポプラ社"
];
let items=[];
let sort="kana",editing=null,cloudSaveTimer,timer;
let selectionMode=false;
const selectedIds=new Set();

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>globalThis.crypto?.randomUUID?.()||("novel-"+Date.now()+"-"+Math.random().toString(36).slice(2));
const now=()=>new Date().toISOString();
const text=v=>String(v??"").trim();
const bool=v=>{
  if(typeof v==="boolean")return v;
  return /^(1|true|yes|y|on|○|〇|済|あり|有|読破|読了)$/i.test(text(v));
};
function normalizeItem(x={}){
  return{
    id:text(x.id)||newId(),title:text(x.title),titleKana:text(x.titleKana),
    author:text(x.author),authorKana:text(x.authorKana),memo:text(x.memo),details:text(x.details),
    categories:Array.isArray(x.categories)?[...new Set(x.categories.map(text).filter(Boolean))]:[],
    publishers:Array.isArray(x.publishers)?[...new Set(x.publishers.map(text).filter(Boolean))]:[],
    publisherOther:text(x.publisherOther||x.publisher),
    partUpper:!!x.partUpper,partMiddle:!!x.partMiddle,partLower:!!x.partLower,
    masterpiece:!!x.masterpiece,finished:!!(x.finished??x.completed),
    updatedAt:text(x.updatedAt)||now()
  };
}
function parseStoredItems(raw){
  if(!raw)return null;
  try{
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed)?parsed:null;
  }catch{return null}
}
function saveToAndroid(){
  if(!globalThis.AndroidData?.saveItems)return null;
  try{return AndroidData.saveItems(JSON.stringify(items))!==false}
  catch{return false}
}
function loadStoredItems(){
  let nativeItems=null,localItems=null;
  if(globalThis.AndroidData?.loadItems){
    try{nativeItems=parseStoredItems(AndroidData.loadItems())}catch{}
  }
  try{localItems=parseStoredItems(localStorage.getItem(KEY))}catch{}
  const saved=Array.isArray(nativeItems)?nativeItems:localItems;
  if(Array.isArray(saved))items=saved.map(normalizeItem);

  // 旧版のWebView保存データがあれば、初回だけAndroid専用領域へ移行する。
  if(!Array.isArray(nativeItems)&&Array.isArray(localItems))saveToAndroid();
}
loadStoredItems();
function allCategories(){
  return[...new Set([...CATEGORY_OPTIONS,...items.flatMap(x=>x.categories||[])])];
}
function persist(){
  const nativeResult=saveToAndroid();
  try{localStorage.setItem(KEY,JSON.stringify(items))}catch{}
  if(nativeResult===false)toast("端末への保存に失敗しました");
  if(globalThis.google?.script?.run){
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer=setTimeout(()=>google.script.run
      .withSuccessHandler(()=>toast("保存しました"))
      .withFailureHandler(()=>toast("保存に失敗しました"))
      .saveItems(items),120);
  }
}
function loadFromCloud(){
  if(!globalThis.google?.script?.run)return;
  google.script.run.withSuccessHandler(saved=>{
    if(Array.isArray(saved)&&saved.length){
      items=saved.map(normalizeItem);
      try{localStorage.setItem(KEY,JSON.stringify(items))}catch{}
      render();toast("保存データを読み込みました");
    }else if(items.length){
      persist();
    }
  }).withFailureHandler(()=>toast("保存データを読み込めませんでした")).loadItems();
}
function sortKey(x,mode){
  if(mode==="author")return x.authorKana||x.author||"（作家未登録）";
  if(mode==="category")return x.categories?.[0]||"未分類";
  return x.titleKana||x.title;
}
function groupKey(x){
  if(sort==="author")return x.author||"作家未登録";
  if(sort==="category")return x.categories?.[0]||"未分類";
  return"";
}
function render(){
  const q=$("search").value.trim().toLowerCase();
  let shown=items.filter(x=>[
    x.title,x.titleKana,x.author,x.authorKana,(x.categories||[]).join(" "),
    (x.publishers||[]).join(" "),x.publisherOther,x.memo,x.details
  ].join(" ").toLowerCase().includes(q));
  shown.sort((a,b)=>{
    const first=sortKey(a,sort).localeCompare(sortKey(b,sort),"ja");
    return first||sortKey(a,"kana").localeCompare(sortKey(b,"kana"),"ja");
  });
  const finished=items.filter(x=>x.finished).length;
  const masterpieces=items.filter(x=>x.masterpiece).length;
  $("summary").textContent=`${items.length}作品（読破 ${finished}・名作 ${masterpieces}）`;
  document.body.classList.toggle("selecting",selectionMode);
  $("selectionBar").hidden=!selectionMode;
  $("selectionCount").textContent=`${selectedIds.size}作品を選択`;
  let previous="";
  $("list").innerHTML=shown.length?shown.map(x=>{
    const group=groupKey(x);
    const heading=group&&group!==previous?`<div class="group">${esc(group)}</div>`:"";
    previous=group;
    const sub=[
      x.author||"作家未登録",
      x.categories?.length?x.categories.join("・"):"未分類",
      [...(x.publishers||[]),x.publisherOther].filter(Boolean).join("・")||"出版社未登録",
      x.memo||x.details||"メモなし"
    ].join(" ・ ");
    const selected=selectedIds.has(x.id);
    return`${heading}<article class="card ${selected?"selected":""}" data-id="${esc(x.id)}">
      <button class="info edit-item" aria-label="${esc(x.title)}を${selectionMode?"選択":"編集"}">
        <span class="select-dot" aria-hidden="true">${selected?"✓":""}</span>
        <span class="mark"></span><span class="text">
          <span class="name-row"><strong>${esc(x.title)}</strong>
            ${x.masterpiece?'<em class="badge masterpiece">名作</em>':""}
            ${x.finished?'<em class="badge finished">読破</em>':""}
          </span>
          <small>${esc(sub)}</small>
        </span>
      </button>
      <div class="part-checks" aria-label="分冊">
        ${partCheckbox("partUpper","上",x.partUpper)}
        ${partCheckbox("partMiddle","中",x.partMiddle)}
        ${partCheckbox("partLower","下",x.partLower)}
      </div>
    </article>`;
  }).join(""):'<div class="empty">見つかりませんでした</div>';
  document.querySelectorAll(".edit-item").forEach(button=>bindLongPress(button));
  document.querySelectorAll(".part-checks input").forEach(input=>{
    input.onchange=()=>{
      if(selectionMode)return;
      const card=input.closest("[data-id]");
      togglePart(card.dataset.id,input.dataset.part,input.checked);
    };
  });
}
function bindLongPress(button){
  const id=button.closest("[data-id]").dataset.id;
  let pressTimer=0,longPressed=false;
  const cancel=()=>{if(pressTimer)clearTimeout(pressTimer);pressTimer=0};
  button.onpointerdown=()=>{
    if(selectionMode)return;
    longPressed=false;
    pressTimer=setTimeout(()=>{
      longPressed=true;
      enterSelection(id);
      navigator.vibrate?.(35);
    },550);
  };
  button.onpointerup=cancel;
  button.onpointercancel=cancel;
  button.onpointerleave=cancel;
  button.oncontextmenu=event=>{
    event.preventDefault();
    if(!selectionMode)enterSelection(id);
  };
  button.onclick=event=>{
    if(longPressed){event.preventDefault();longPressed=false;return}
    if(selectionMode){toggleSelected(id);return}
    openEdit(id);
  };
}
function enterSelection(id){
  selectionMode=true;
  selectedIds.add(id);
  render();
}
function toggleSelected(id){
  if(selectedIds.has(id))selectedIds.delete(id);else selectedIds.add(id);
  if(!selectedIds.size)return exitSelection();
  render();
}
function selectAllShown(){
  document.querySelectorAll("#list [data-id]").forEach(card=>selectedIds.add(card.dataset.id));
  render();
}
function exitSelection(){
  selectionMode=false;
  selectedIds.clear();
  render();
}
function deleteSelected(){
  const count=selectedIds.size;
  if(!count)return;
  if(!confirm(`選択した${count}作品を削除しますか？`))return;
  items=items.filter(x=>!selectedIds.has(x.id));
  selectionMode=false;
  selectedIds.clear();
  persist();
  render();
  toast(`${count}作品を削除しました`);
}
function partCheckbox(part,label,checked){
  return`<label><input type="checkbox" data-part="${part}" ${checked?"checked":""}><span>${label}</span></label>`;
}
document.querySelectorAll("[data-sort]").forEach(button=>{
  button.onclick=()=>{
    sort=button.dataset.sort;
    document.querySelectorAll("[data-sort]").forEach(x=>x.classList.toggle("active",x===button));
    render();
  };
});
function togglePart(id,part,checked){
  items=items.map(x=>x.id===id?{...x,[part]:checked,updatedAt:now()}:x);
  persist();render();
}
function renderCategoryChoices(selected=[]){
  const chosen=new Set(selected);
  $("categoryChoices").innerHTML=allCategories().map((category,i)=>
    `<label class="check-tile"><input type="checkbox" value="${esc(category)}" ${chosen.has(category)?"checked":""}><span>${esc(category)}</span></label>`
  ).join("");
}
function renderPublisherChoices(selected=[]){
  const chosen=new Set(selected);
  $("publisherChoices").innerHTML=PUBLISHER_OPTIONS.map(publisher=>
    `<label class="check-tile"><input type="checkbox" value="${esc(publisher)}" ${chosen.has(publisher)?"checked":""}><span>${esc(publisher)}</span></label>`
  ).join("");
}
function toHiragana(value){
  return String(value||"").replace(/[\u30a1-\u30f6]/g,ch=>
    String.fromCharCode(ch.charCodeAt(0)-0x60)
  );
}
function connectImeReading(sourceId,readingId){
  const source=$(sourceId),reading=$(readingId);
  let lastKana="";
  source.addEventListener("compositionupdate",event=>{
    const candidate=String(event.data||"");
    if(candidate&&/^[\p{Script=Hiragana}\p{Script=Katakana}ー・\s]+$/u.test(candidate)){
      lastKana=toHiragana(candidate);
    }
  });
  source.addEventListener("compositionend",()=>{
    if(!reading.value.trim()&&lastKana)reading.value=lastKana;
    lastKana="";
  });
}
function openEdit(id){
  editing=items.find(x=>x.id===id)||null;
  $("dialogTitle").textContent=editing?"作品を編集":"作品を追加";
  $("title").value=editing?.title||"";
  $("titleKana").value=editing?.titleKana||"";
  $("author").value=editing?.author||"";
  $("authorKana").value=editing?.authorKana||"";
  $("partUpper").checked=!!editing?.partUpper;
  $("partMiddle").checked=!!editing?.partMiddle;
  $("partLower").checked=!!editing?.partLower;
  $("masterpiece").checked=!!editing?.masterpiece;
  $("finished").checked=!!editing?.finished;
  $("memo").value=editing?.memo||"";
  $("details").value=editing?.details||"";
  $("publisherOther").value=editing?.publisherOther||"";
  renderCategoryChoices(editing?.categories||[]);
  renderPublisherChoices(editing?.publishers||[]);
  $("deleteBtn").hidden=!editing;
  editDialog.showModal();
  setTimeout(()=>$("title").focus(),0);
}
function save(){
  const title=text($("title").value);
  if(!title)return toast("タイトルを入力してください");
  const value=normalizeItem({
    ...(editing||{}),id:editing?.id||newId(),title,
    titleKana:text($("titleKana").value),author:text($("author").value),
    authorKana:text($("authorKana").value),
    categories:[...document.querySelectorAll("#categoryChoices input:checked")].map(x=>x.value),
    publishers:[...document.querySelectorAll("#publisherChoices input:checked")].map(x=>x.value),
    publisherOther:text($("publisherOther").value),
    partUpper:$("partUpper").checked,partMiddle:$("partMiddle").checked,partLower:$("partLower").checked,
    masterpiece:$("masterpiece").checked,finished:$("finished").checked,
    memo:text($("memo").value),details:text($("details").value),updatedAt:now()
  });
  if(editing)items=items.map(x=>x.id===editing.id?value:x);
  else items.unshift(value);
  persist();editDialog.close();render();toast("保存しました");
}
function removeItem(){
  if(editing&&confirm(`「${editing.title}」を削除しますか？`)){
    items=items.filter(x=>x.id!==editing.id);
    persist();editDialog.close();render();toast("削除しました");
  }
}
function backupData(){
  return{
    app:"まーちゃんの書斎",version:1,exportedAt:now(),
    items:items.map(normalizeItem)
  };
}
function backupCloud(){
  if(!globalThis.google?.script?.run)return toast("クラウドに接続できません");
  toast("バックアップを保存中です");
  google.script.run.withSuccessHandler(r=>toast(`${r.name} を保存しました`))
    .withFailureHandler(()=>toast("バックアップに失敗しました"))
    .backupToStore(backupData());
}
function restoreLatestCloud(){
  if(!globalThis.google?.script?.run)return toast("クラウドに接続できません");
  google.script.run.withSuccessHandler(r=>{
    if(!r||!Array.isArray(r.items))return toast("バックアップがありません");
    if(confirm(`${r.name}（${r.items.length}作品）から復元しますか？`)){
      items=r.items.map(normalizeItem);persist();render();dataDialog.close();toast("バックアップを復元しました");
    }
  }).withFailureHandler(()=>toast("バックアップを読み込めません")).loadLatestBackup();
}
async function backup(){
  const data=backupData(),date=new Date().toLocaleDateString("sv-SE");
  const name=`書斎_${date}_バックアップ.json`;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  if(globalThis.AndroidBackup?.saveBackup){
    AndroidBackup.saveBackup(JSON.stringify(data,null,2),name);
    toast("バックアップの保存先を選んでください");
    return;
  }
  const file=new File([blob],name,{type:"application/json"});
  const shareData={files:[file],title:"まーちゃんの書斎 バックアップ"};
  const android=/Android/i.test(navigator.userAgent);
  if(navigator.canShare&&navigator.canShare(shareData)){
    try{await navigator.share(shareData);toast("共有・保存しました");return}
    catch(e){if(e.name==="AbortError")return;if(android){toast("バックアップを保存できませんでした");return}}
  }
  if(android){toast("バックアップを保存できませんでした");return}
  try{
    const a=document.createElement("a"),url=URL.createObjectURL(blob);
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);toast("ダウンロードしました");
  }catch{toast("クラウドバックアップをご利用ください")}
}
async function restore(event){
  try{
    const file=event.target.files?.[0];
    if(!file)throw 0;
    const parsed=JSON.parse(await file.text());
    if(parsed.app&&parsed.app!=="まーちゃんの書斎"){
      event.target.value="";
      return toast("これは小説版のバックアップではありません");
    }
    if(!Array.isArray(parsed.items))throw 0;
    const restored=parsed.items.filter(x=>x&&x.title).map(normalizeItem);
    if(confirm(`${restored.length}作品のバックアップで現在のデータを置き換えますか？`)){
      items=restored;persist();render();dataDialog.close();toast("バックアップを復元しました");
    }
  }catch{toast("このファイルは読み込めません")}
  event.target.value="";
}
const HEADERS={
  title:["タイトル","作品名","書名","title"],
  author:["作家","著者","作者","author"],
  titleKana:["タイトルよみ","タイトル読み","よみ","ふりがな","titlekana"],
  authorKana:["作家よみ","作家読み","著者よみ","著者読み","authorkana"],
  categories:["カテゴリ","カテゴリー","ジャンル","category"],
  partUpper:["上巻","上"],partMiddle:["中巻","中"],partLower:["下巻","下"],
  masterpiece:["名作"],finished:["読破","読了"],
  memo:["メモ","memo"],details:["詳細","備考","details"],
  publishers:["出版社","発行元","publisher","publishers"],
  publisherOther:["出版社自由記載","その他出版社","publisherother"]
};
function headerMap(row){
  const result={};
  row.forEach((value,index)=>{
    const key=text(value).replace(/[\s　_-]/g,"").toLowerCase();
    for(const [field,aliases] of Object.entries(HEADERS)){
      if(aliases.some(alias=>alias.replace(/[\s　_-]/g,"").toLowerCase()===key))result[field]=index;
    }
  });
  return result;
}
function cell(row,map,field,fallback=""){
  const index=map[field];
  return index===undefined?fallback:row[index];
}
function parseCategories(value){
  return[...new Set(text(value).split(/[、,，／/|]+/).map(text).filter(Boolean))];
}
async function importExcel(event){
  try{
    const file=event.target.files?.[0];
    if(!file)throw 0;
    let rows=[];
    if(/\.csv$/i.test(file.name)){
      if(globalThis.XLSX){
        const book=XLSX.read(await file.arrayBuffer(),{type:"array"});
        rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:""});
      }else{
        rows=(await file.text()).split(/\r?\n/).map(line=>line.split(","));
      }
    }else{
      if(!globalThis.XLSX)throw new Error("Excel読込ライブラリを読み込めません");
      const book=XLSX.read(await file.arrayBuffer(),{type:"array"});
      rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:""});
    }
    rows=rows.filter(row=>Array.isArray(row)&&row.some(value=>text(value)));
    if(!rows.length)throw 0;
    let map=headerMap(rows[0]);
    const hasHeader=map.title!==undefined;
    if(!hasHeader)map={title:0,author:1};
    const imported=(hasHeader?rows.slice(1):rows).map(row=>normalizeItem({
      id:newId(),title:text(cell(row,map,"title")),author:text(cell(row,map,"author")),
      titleKana:text(cell(row,map,"titleKana")),authorKana:text(cell(row,map,"authorKana")),
      categories:parseCategories(cell(row,map,"categories")),
      publishers:parseCategories(cell(row,map,"publishers")),
      publisherOther:text(cell(row,map,"publisherOther")),
      partUpper:bool(cell(row,map,"partUpper")),partMiddle:bool(cell(row,map,"partMiddle")),
      partLower:bool(cell(row,map,"partLower")),masterpiece:bool(cell(row,map,"masterpiece")),
      finished:bool(cell(row,map,"finished")),memo:text(cell(row,map,"memo")),
      details:text(cell(row,map,"details")),updatedAt:now()
    })).filter(x=>x.title);
    const existing=new Set(items.map(x=>(x.title+"\u0000"+x.author).toLocaleLowerCase("ja")));
    const unique=imported.filter(x=>{
      const key=(x.title+"\u0000"+x.author).toLocaleLowerCase("ja");
      if(existing.has(key))return false;
      existing.add(key);return true;
    });
    if(!unique.length)return toast("追加できる新しい作品がありません");
    const skipped=imported.length-unique.length;
    const message=`${unique.length}作品を追加しますか？${skipped?`（重複 ${skipped}件を除外）`:""}`;
    if(confirm(message)){
      items=[...unique,...items];persist();render();dataDialog.close();
      toast(`${unique.length}作品を追加しました`);
    }
  }catch(error){
    toast(error?.message||"Excelファイルを読み込めません");
  }
  event.target.value="";
}
function toast(message){
  clearTimeout(timer);$("toast").textContent=message;$("toast").hidden=false;
  timer=setTimeout(()=>$("toast").hidden=true,2000);
}
connectImeReading("title","titleKana");
connectImeReading("author","authorKana");
render();
loadFromCloud();
</script>
