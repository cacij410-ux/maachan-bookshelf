<div id="toast" class="toast" hidden></div>

<script>
const KEY="novel-study-mobile-v1";
const CATEGORY_OPTIONS=[
  "文学","恋愛","ミステリー","SF","ファンタジー","歴史・時代","ホラー",
  "青春","冒険","エッセイ","ノンフィクション","児童・YA","その他"
];
const PUBLISHER_OPTIONS=[
  "新潮社","文藝春秋","講談社","集英社","小学館","KADOKAWA","幻冬舎",
  "中央公論新社","早川書房","東京創元社","筑摩書房","岩波書店",
  "河出書房新社","徳間書店","光文社","双葉社","宝島社","PHP研究所","ポプラ社"
];
let items=[];
let sort="kana",editing=null,cloudSaveTimer,timer;
let selectionMode=false;
const selectedIds=new Set();

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>globalThis.crypto?.randomUUID?.()||("novel-"+Date.now()+"-"+Math.random().toString(36).slice(2));
const now=()=>new Date().toISOString();
const text=v=>String(v??"").trim();
const bool=v=>{
  if(typeof v==="boolean")return v;
  return /^(1|true|yes|y|on|○|〇|済|あり|有|読破|読了)$/i.test(text(v));
};
function normalizeItem(x={}){
  return{
    id:text(x.id)||newId(),title:text(x.title),titleKana:text(x.titleKana),
    author:text(x.author),authorKana:text(x.authorKana),memo:text(x.memo),details:text(x.details),
    categories:Array.isArray(x.categories)?[...new Set(x.categories.map(text).filter(Boolean))]:[],
    publishers:Array.isArray(x.publishers)?[...new Set(x.publishers.map(text).filter(Boolean))]:[],
    publisherOther:text(x.publisherOther||x.publisher),
    partUpper:!!x.partUpper,partMiddle:!!x.partMiddle,partLower:!!x.partLower,
    masterpiece:!!x.masterpiece,finished:!!(x.finished??x.completed),
    updatedAt:text(x.updatedAt)||now()
  };
}
function parseStoredItems(raw){
  if(!raw)return null;
  try{
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed)?parsed:null;
  }catch{return null}
}
function saveToAndroid(){
  if(!globalThis.AndroidData?.saveItems)return null;
  try{return AndroidData.saveItems(JSON.stringify(items))!==false}
  catch{return false}
}
function loadStoredItems(){
  let nativeItems=null,localItems=null;
  if(globalThis.AndroidData?.loadItems){
    try{nativeItems=parseStoredItems(AndroidData.loadItems())}catch{}
  }
  try{localItems=parseStoredItems(localStorage.getItem(KEY))}catch{}
  const saved=Array.isArray(nativeItems)?nativeItems:localItems;
  if(Array.isArray(saved))items=saved.map(normalizeItem);

  // 旧版のWebView保存データがあれば、初回だけAndroid専用領域へ移行する。
  if(!Array.isArray(nativeItems)&&Array.isArray(localItems))saveToAndroid();
}
loadStoredItems();
function allCategories(){
  return[...new Set([...CATEGORY_OPTIONS,...items.flatMap(x=>x.categories||[])])];
}
function persist(){
  const nativeResult=saveToAndroid();
  try{localStorage.setItem(KEY,JSON.stringify(items))}catch{}
  if(nativeResult===false)toast("端末への保存に失敗しました");
  if(globalThis.google?.script?.run){
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer=setTimeout(()=>google.script.run
      .withSuccessHandler(()=>toast("保存しました"))
      .withFailureHandler(()=>toast("保存に失敗しました"))
      .saveItems(items),120);
  }
}
function loadFromCloud(){
  if(!globalThis.google?.script?.run)return;
  google.script.run.withSuccessHandler(saved=>{
    if(Array.isArray(saved)&&saved.length){
      items=saved.map(normalizeItem);
      try{localStorage.setItem(KEY,JSON.stringify(items))}catch{}
      render();toast("保存データを読み込みました");
    }else if(items.length){
      persist();
    }
  }).withFailureHandler(()=>toast("保存データを読み込めませんでした")).loadItems();
}
function sortKey(x,mode){
  if(mode==="author")return x.authorKana||x.author||"（作家未登録）";
  if(mode==="category")return x.categories?.[0]||"未分類";
  return x.titleKana||x.title;
}
function groupKey(x){
  if(sort==="author")return x.author||"作家未登録";
  if(sort==="category")return x.categories?.[0]||"未分類";
  return"";
}
function render(){
  const q=$("search").value.trim().toLowerCase();
  let shown=items.filter(x=>[
    x.title,x.titleKana,x.author,x.authorKana,(x.categories||[]).join(" "),
    (x.publishers||[]).join(" "),x.publisherOther,x.memo,x.details
  ].join(" ").toLowerCase().includes(q));
  shown.sort((a,b)=>{
    const first=sortKey(a,sort).localeCompare(sortKey(b,sort),"ja");
    return first||sortKey(a,"kana").localeCompare(sortKey(b,"kana"),"ja");
  });
  const finished=items.filter(x=>x.finished).length;
  const masterpieces=items.filter(x=>x.masterpiece).length;
  $("summary").textContent=`${items.length}作品（読破 ${finished}・名作 ${masterpieces}）`;
  document.body.classList.toggle("selecting",selectionMode);
  $("selectionBar").hidden=!selectionMode;
  $("selectionCount").textContent=`${selectedIds.size}作品を選択`;
  let previous="";
  $("list").innerHTML=shown.length?shown.map(x=>{
    const group=groupKey(x);
    const heading=group&&group!==previous?`<div class="group">${esc(group)}</div>`:"";
    previous=group;
    const sub=[
      x.author||"作家未登録",
      x.categories?.length?x.categories.join("・"):"未分類",
      [...(x.publishers||[]),x.publisherOther].filter(Boolean).join("・")||"出版社未登録",
      x.memo||x.details||"メモなし"
    ].join(" ・ ");
    const selected=selectedIds.has(x.id);
    return`${heading}<article class="card ${selected?"selected":""}" data-id="${esc(x.id)}">
      <button class="info edit-item" aria-label="${esc(x.title)}を${selectionMode?"選択":"編集"}">
        <span class="select-dot" aria-hidden="true">${selected?"✓":""}</span>
        <span class="mark"></span><span class="text">
          <span class="name-row"><strong>${esc(x.title)}</strong>
            ${x.masterpiece?'<em class="badge masterpiece">名作</em>':""}
            ${x.finished?'<em class="badge finished">読破</em>':""}
          </span>
          <small>${esc(sub)}</small>
        </span>
      </button>
      <div class="part-checks" aria-label="分冊">
        ${partCheckbox("partUpper","上",x.partUpper)}
        ${partCheckbox("partMiddle","中",x.partMiddle)}
        ${partCheckbox("partLower","下",x.partLower)}
      </div>
    </article>`;
  }).join(""):'<div class="empty">見つかりませんでした</div>';
  document.querySelectorAll(".edit-item").forEach(button=>bindLongPress(button));
  document.querySelectorAll(".part-checks input").forEach(input=>{
    input.onchange=()=>{
      if(selectionMode)return;
      const card=input.closest("[data-id]");
      togglePart(card.dataset.id,input.dataset.part,input.checked);
    };
  });
}
function bindLongPress(button){
  const id=button.closest("[data-id]").dataset.id;
  let pressTimer=0,longPressed=false;
  const cancel=()=>{if(pressTimer)clearTimeout(pressTimer);pressTimer=0};
  button.onpointerdown=()=>{
    if(selectionMode)return;
    longPressed=false;
    pressTimer=setTimeout(()=>{
      longPressed=true;
      enterSelection(id);
      navigator.vibrate?.(35);
    },550);
  };
  button.onpointerup=cancel;
  button.onpointercancel=cancel;
  button.onpointerleave=cancel;
  button.oncontextmenu=event=>{
    event.preventDefault();
    if(!selectionMode)enterSelection(id);
  };
  button.onclick=event=>{
    if(longPressed){event.preventDefault();longPressed=false;return}
    if(selectionMode){toggleSelected(id);return}
    openEdit(id);
  };
}
function enterSelection(id){
  selectionMode=true;
  selectedIds.add(id);
  render();
}
function toggleSelected(id){
  if(selectedIds.has(id))selectedIds.delete(id);else selectedIds.add(id);
  if(!selectedIds.size)return exitSelection();
  render();
}
function selectAllShown(){
  document.querySelectorAll("#list [data-id]").forEach(card=>selectedIds.add(card.dataset.id));
  render();
}
function exitSelection(){
  selectionMode=false;
  selectedIds.clear();
  render();
}
function deleteSelected(){
  const count=selectedIds.size;
  if(!count)return;
  if(!confirm(`選択した${count}作品を削除しますか？`))return;
  items=items.filter(x=>!selectedIds.has(x.id));
  selectionMode=false;
  selectedIds.clear();
  persist();
  render();
  toast(`${count}作品を削除しました`);
}
function partCheckbox(part,label,checked){
  return`<label><input type="checkbox" data-part="${part}" ${checked?"checked":""}><span>${label}</span></label>`;
}
document.querySelectorAll("[data-sort]").forEach(button=>{
  button.onclick=()=>{
    sort=button.dataset.sort;
    document.querySelectorAll("[data-sort]").forEach(x=>x.classList.toggle("active",x===button));
    render();
  };
});
function togglePart(id,part,checked){
  items=items.map(x=>x.id===id?{...x,[part]:checked,updatedAt:now()}:x);
  persist();render();
}
function renderCategoryChoices(selected=[]){
  const chosen=new Set(selected);
  $("categoryChoices").innerHTML=allCategories().map((category,i)=>
    `<label class="check-tile"><input type="checkbox" value="${esc(category)}" ${chosen.has(category)?"checked":""}><span>${esc(category)}</span></label>`
  ).join("");
}
function renderPublisherChoices(selected=[]){
  const chosen=new Set(selected);
  $("publisherChoices").innerHTML=PUBLISHER_OPTIONS.map(publisher=>
    `<label class="check-tile"><input type="checkbox" value="${esc(publisher)}" ${chosen.has(publisher)?"checked":""}><span>${esc(publisher)}</span></label>`
  ).join("");
}
function toHiragana(value){
  return String(value||"").replace(/[\u30a1-\u30f6]/g,ch=>
    String.fromCharCode(ch.charCodeAt(0)-0x60)
  );
}
function connectImeReading(sourceId,readingId){
  const source=$(sourceId),reading=$(readingId);
  let lastKana="";
  source.addEventListener("compositionupdate",event=>{
    const candidate=String(event.data||"");
    if(candidate&&/^[\p{Script=Hiragana}\p{Script=Katakana}ー・\s]+$/u.test(candidate)){
      lastKana=toHiragana(candidate);
    }
  });
  source.addEventListener("compositionend",()=>{
    if(!reading.value.trim()&&lastKana)reading.value=lastKana;
    lastKana="";
  });
}
function openEdit(id){
  editing=items.find(x=>x.id===id)||null;
  $("dialogTitle").textContent=editing?"作品を編集":"作品を追加";
  $("title").value=editing?.title||"";
  $("titleKana").value=editing?.titleKana||"";
  $("author").value=editing?.author||"";
  $("authorKana").value=editing?.authorKana||"";
  $("partUpper").checked=!!editing?.partUpper;
  $("partMiddle").checked=!!editing?.partMiddle;
  $("partLower").checked=!!editing?.partLower;
  $("masterpiece").checked=!!editing?.masterpiece;
  $("finished").checked=!!editing?.finished;
  $("memo").value=editing?.memo||"";
  $("details").value=editing?.details||"";
  $("publisherOther").value=editing?.publisherOther||"";
  renderCategoryChoices(editing?.categories||[]);
  renderPublisherChoices(editing?.publishers||[]);
  $("deleteBtn").hidden=!editing;
  editDialog.showModal();
  setTimeout(()=>$("title").focus(),0);
}
function save(){
  const title=text($("title").value);
  if(!title)return toast("タイトルを入力してください");
  const value=normalizeItem({
    ...(editing||{}),id:editing?.id||newId(),title,
    titleKana:text($("titleKana").value),author:text($("author").value),
    authorKana:text($("authorKana").value),
    categories:[...document.querySelectorAll("#categoryChoices input:checked")].map(x=>x.value),
    publishers:[...document.querySelectorAll("#publisherChoices input:checked")].map(x=>x.value),
    publisherOther:text($("publisherOther").value),
    partUpper:$("partUpper").checked,partMiddle:$("partMiddle").checked,partLower:$("partLower").checked,
    masterpiece:$("masterpiece").checked,finished:$("finished").checked,
    memo:text($("memo").value),details:text($("details").value),updatedAt:now()
  });
  if(editing)items=items.map(x=>x.id===editing.id?value:x);
  else items.unshift(value);
  persist();editDialog.close();render();toast("保存しました");
}
function removeItem(){
  if(editing&&confirm(`「${editing.title}」を削除しますか？`)){
    items=items.filter(x=>x.id!==editing.id);
    persist();editDialog.close();render();toast("削除しました");
  }
}
function backupData(){
  return{
    app:"まーちゃんの書斎",version:1,exportedAt:now(),
    items:items.map(normalizeItem)
  };
}
function backupCloud(){
  if(!globalThis.google?.script?.run)return toast("クラウドに接続できません");
  toast("バックアップを保存中です");
  google.script.run.withSuccessHandler(r=>toast(`${r.name} を保存しました`))
    .withFailureHandler(()=>toast("バックアップに失敗しました"))
    .backupToStore(backupData());
}
function restoreLatestCloud(){
  if(!globalThis.google?.script?.run)return toast("クラウドに接続できません");
  google.script.run.withSuccessHandler(r=>{
    if(!r||!Array.isArray(r.items))return toast("バックアップがありません");
    if(confirm(`${r.name}（${r.items.length}作品）から復元しますか？`)){
      items=r.items.map(normalizeItem);persist();render();dataDialog.close();toast("バックアップを復元しました");
    }
  }).withFailureHandler(()=>toast("バックアップを読み込めません")).loadLatestBackup();
}
async function backup(){
  const data=backupData(),date=new Date().toLocaleDateString("sv-SE");
  const name=`書斎_${date}_バックアップ.json`;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  if(globalThis.AndroidBackup?.saveBackup){
    AndroidBackup.saveBackup(JSON.stringify(data,null,2),name);
    toast("バックアップの保存先を選んでください");
    return;
  }
  const file=new File([blob],name,{type:"application/json"});
  const shareData={files:[file],title:"まーちゃんの書斎 バックアップ"};
  const android=/Android/i.test(navigator.userAgent);
  if(navigator.canShare&&navigator.canShare(shareData)){
    try{await navigator.share(shareData);toast("共有・保存しました");return}
    catch(e){if(e.name==="AbortError")return;if(android){toast("バックアップを保存できませんでした");return}}
  }
  if(android){toast("バックアップを保存できませんでした");return}
  try{
    const a=document.createElement("a"),url=URL.createObjectURL(blob);
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);toast("ダウンロードしました");
  }catch{toast("クラウドバックアップをご利用ください")}
}
async function restore(event){
  try{
    const file=event.target.files?.[0];
    if(!file)throw 0;
    const parsed=JSON.parse(await file.text());
    if(parsed.app&&parsed.app!=="まーちゃんの書斎"){
      event.target.value="";
      return toast("これは小説版のバックアップではありません");
    }
    if(!Array.isArray(parsed.items))throw 0;
    const restored=parsed.items.filter(x=>x&&x.title).map(normalizeItem);
    if(confirm(`${restored.length}作品のバックアップで現在のデータを置き換えますか？`)){
      items=restored;persist();render();dataDialog.close();toast("バックアップを復元しました");
    }
  }catch{toast("このファイルは読み込めません")}
  event.target.value="";
}
const HEADERS={
  title:["タイトル","作品名","書名","title"],
  author:["作家","著者","作者","author"],
  titleKana:["タイトルよみ","タイトル読み","よみ","ふりがな","titlekana"],
  authorKana:["作家よみ","作家読み","著者よみ","著者読み","authorkana"],
  categories:["カテゴリ","カテゴリー","ジャンル","category"],
  partUpper:["上巻","上"],partMiddle:["中巻","中"],partLower:["下巻","下"],
  masterpiece:["名作"],finished:["読破","読了"],
  memo:["メモ","memo"],details:["詳細","備考","details"],
  publishers:["出版社","発行元","publisher","publishers"],
  publisherOther:["出版社自由記載","その他出版社","publisherother"]
};
function headerMap(row){
  const result={};
  row.forEach((value,index)=>{
    const key=text(value).replace(/[\s　_-]/g,"").toLowerCase();
    for(const [field,aliases] of Object.entries(HEADERS)){
      if(aliases.some(alias=>alias.replace(/[\s　_-]/g,"").toLowerCase()===key))result[field]=index;
    }
  });
  return result;
}
function cell(row,map,field,fallback=""){
  const index=map[field];
  return index===undefined?fallback:row[index];
}
function parseCategories(value){
  return[...new Set(text(value).split(/[、,，／/|]+/).map(text).filter(Boolean))];
}
async function importExcel(event){
  try{
    const file=event.target.files?.[0];
    if(!file)throw 0;
    let rows=[];
    if(/\.csv$/i.test(file.name)){
      if(globalThis.XLSX){
        const book=XLSX.read(await file.arrayBuffer(),{type:"array"});
        rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:""});
      }else{
        rows=(await file.text()).split(/\r?\n/).map(line=>line.split(","));
      }
    }else{
      if(!globalThis.XLSX)throw new Error("Excel読込ライブラリを読み込めません");
      const book=XLSX.read(await file.arrayBuffer(),{type:"array"});
      rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:""});
    }
    rows=rows.filter(row=>Array.isArray(row)&&row.some(value=>text(value)));
    if(!rows.length)throw 0;
    let map=headerMap(rows[0]);
    const hasHeader=map.title!==undefined;
    if(!hasHeader)map={title:0,author:1};
    const imported=(hasHeader?rows.slice(1):rows).map(row=>normalizeItem({
      id:newId(),title:text(cell(row,map,"title")),author:text(cell(row,map,"author")),
      titleKana:text(cell(row,map,"titleKana")),authorKana:text(cell(row,map,"authorKana")),
      categories:parseCategories(cell(row,map,"categories")),
      publishers:parseCategories(cell(row,map,"publishers")),
      publisherOther:text(cell(row,map,"publisherOther")),
      partUpper:bool(cell(row,map,"partUpper")),partMiddle:bool(cell(row,map,"partMiddle")),
      partLower:bool(cell(row,map,"partLower")),masterpiece:bool(cell(row,map,"masterpiece")),
      finished:bool(cell(row,map,"finished")),memo:text(cell(row,map,"memo")),
      details:text(cell(row,map,"details")),updatedAt:now()
    })).filter(x=>x.title);
    const existing=new Set(items.map(x=>(x.title+"\u0000"+x.author).toLocaleLowerCase("ja")));
    const unique=imported.filter(x=>{
      const key=(x.title+"\u0000"+x.author).toLocaleLowerCase("ja");
      if(existing.has(key))return false;
      existing.add(key);return true;
    });
    if(!unique.length)return toast("追加できる新しい作品がありません");
    const skipped=imported.length-unique.length;
    const message=`${unique.length}作品を追加しますか？${skipped?`（重複 ${skipped}件を除外）`:""}`;
    if(confirm(message)){
      items=[...unique,...items];persist();render();dataDialog.close();
      toast(`${unique.length}作品を追加しました`);
    }
  }catch(error){
    toast(error?.message||"Excelファイルを読み込めません");
  }
  event.target.value="";
}
function toast(message){
  clearTimeout(timer);$("toast").textContent=message;$("toast").hidden=false;
  timer=setTimeout(()=>$("toast").hidden=true,2000);
}
connectImeReading("title","titleKana");
connectImeReading("author","authorKana");
render();
loadFromCloud();
</script>
