<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書誌情報作成ツール v12</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>:root{--bg:#f4f6f8;--nav:#263746;--line:#d7dee5;--blue:#2f5f8f;--green:#2f6b45;--muted:#6b7783;--red:#922}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#24303b;font-family:system-ui,"Yu Gothic UI",Meiryo,sans-serif}header{background:var(--nav);color:#fff;padding:18px}main{max-width:1080px;margin:auto;padding:18px}.card,.book{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.toolbar,.bookhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.search-grid,.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input[type=text],select,textarea{width:100%;padding:9px;border:1px solid #bcc7d0;border-radius:7px;background:#fff}textarea{min-height:70px;resize:vertical}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.b{background:var(--blue);color:#fff}.g{background:var(--green);color:#fff}.x{background:#f8e7e7;color:var(--red)}.s{background:#e7edf2;color:#263746}.muted{font-size:12px;color:var(--muted)}.notice{background:#edf6ee;border:1px solid #bdd8c3;padding:10px 12px;border-radius:8px;margin-bottom:14px}.notice.bad{background:#fff1f1;border-color:#e6bcbc;color:#8b2525}.results{max-height:480px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}.res{display:flex;gap:10px;padding:10px;border-bottom:1px solid #edf0f2;align-items:flex-start}.res input{margin-top:4px}.meta{font-size:11px;color:#74808b;margin-top:3px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:#53616d}.checks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.checks label{border:1px solid #d5dde4;border-radius:7px;padding:8px;background:#fff}.pill,.source{display:inline-block;border-radius:999px;font-size:11px;padding:3px 7px}.pill{background:#eef4fa;color:#234a70;font-weight:700}.source{border:1px solid #ced7de;background:#fff}.progress{margin-top:8px;padding:9px 11px;background:#f7f9fb;border-radius:7px;font-size:12px;color:#53616d}.mode label{margin-right:14px}.search-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}@media(max-width:800px){.search-grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}.checks{grid-template-columns:1fr 1fr}}</style></head><body><header><b>書誌情報作成ツール v12</b><div class="muted" style="color:#d8e0e7">候補検索：Open Library＋NDLサーチ ／ 正式書誌：openBD</div></header><main><div id="notice" class="notice">表記ゆれに強くするため、完全一致・一般キーワード・NDL日本語検索をまとめて実行します。登録後はopenBDから正式書誌を取得します。</div><section class="card mode"><b>① 出力形式</b>　<label><input type="radio" name="mode" value="book" checked> 書籍版</label><label><input type="radio" name="mode" value="comic"> コミック版</label></section><section class="card"><b>② 著者名／著作名から検索</b><div class="search-grid" style="margin-top:10px"><div class="field"><label>著者名</label><input id="author" type="text" placeholder="例：荒川弘"></div><div class="field"><label>著作名・通称</label><input id="workTitle" type="text" placeholder="例：鋼の錬金術師 / ハガレン"></div></div><div class="search-actions"><button id="searchClear" class="s">検索クリア</button><button id="find" class="b">候補を検索</button></div><div id="results" class="results"><div class="muted" style="padding:24px;text-align:center">著者名または著作名を入力してください</div></div><div class="toolbar" style="margin-top:10px"><span id="resultInfo" class="muted"></span><button id="sel" class="s" disabled>チェックした著書を登録</button></div></section><section class="card"><div class="toolbar"><b>③ 選択した書籍 <span id="cnt" class="pill">0冊</span></b><div><button id="batch" class="b">openBDから一括取得</button> <button id="clear" class="x">すべて削除</button></div></div><div id="batchProgress" class="progress" style="display:none"></div><div id="detail"></div></section><section class="card"><div class="toolbar"><b>④ Excel出力</b><button id="excel" class="g">選択中の形式でExcel作成</button></div></section><div class="muted">※ 所有・名作・読破は初期状態では空欄です。NDLサーチ候補は日本語タイトルやISBNを拾うために使用します。</div></main><script>
const $=id=>document.getElementById(id),JP=/[ぁ-んァ-ヶ一-龠々〆ヵヶ]/;
const C=['','ビジネス・経済','科学・テクノロジー','歴史・地理','哲学・思想','社会・文化','政治・法律','芸術・デザイン','スポーツ','趣味・実用','健康・医療','料理・食','暮らし・生活','教育','語学・辞書','旅行・紀行','エッセイ・随筆','ノンフィクション','小説','ミステリー','SF・ファンタジー','ホラー','恋愛','時代・歴史小説','ライトノベル','漫画・コミック','絵本・児童書','詩・短歌・俳句','戯曲','ユーモア・娯楽','その他'];
const P=['','岩波書店','筑摩書房','中央公論新社','新潮社','文藝春秋','講談社','集英社','小学館','角川書店','KADOKAWA','河出書房新社','平凡社','みすず書房','晶文社','作品社','白水社','早川書房','東京創元社','光文社','双葉社','徳間書店','宝島社','扶桑社','PHP研究所','東洋経済新報社','日経BP','日本経済新聞出版','ダイヤモンド社','サンマーク出版','幻冬舎','ポプラ社','福音館書店'];
let B=JSON.parse(localStorage.getItem('bibv12')||localStorage.getItem('bibv11')||'[]'),mode=localStorage.getItem('bibv12mode')||localStorage.getItem('bibv11mode')||'book',candidates=[],searchedAuthor='',searchedTitle='';document.querySelector(`input[name=mode][value=${mode}]`).checked=true;
const tr=s=>(s||'').trim(),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('bibv12',JSON.stringify(B));localStorage.setItem('bibv12mode',mode)}
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/(?:第\s*)?\d+\s*巻/g,'').replace(/vol\.?\s*\d+/ig,'').replace(/[\s　・･:：\-―—_()（）\[\]【】『』「」<>《》!！?？。、,，.]/g,'')}
function looseWords(s){return String(s||'').normalize('NFKC').replace(/[・･:：\-―—_()（）\[\]【】『』「」<>《》!！?？。、,，.]/g,' ').replace(/(?:第\s*)?\d+\s*巻/g,' ').replace(/vol\.?\s*\d+/ig,' ').replace(/\s+/g,' ').trim()}
function kataToHira(s){return String(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s　]+/g,'')}
function cleanISBN(s){return String(s||'').replace(/[^0-9Xx]/g,'')}
function part(t){t=String(t||'');return{upper:/上巻|[（(]上[）)]/.test(t)?'○':'',middle:/中巻|[（(]中[）)]/.test(t)?'○':'',lower:/下巻|[（(]下[）)]/.test(t)?'○':''}}
function vol(t){const m=String(t||'').match(/(?:第\s*)?(\d+)\s*巻|vol\.?\s*(\d+)/i);return m?Number(m[1]||m[2]):''}
function categoryFromNdc(ndc){const n=String(ndc||'').trim()[0];return({'1':'哲学・思想','2':'歴史・地理','3':'社会・文化','4':'科学・テクノロジー','5':'科学・テクノロジー','6':'ビジネス・経済','7':'芸術・デザイン','8':'語学・辞書','9':'小説'}[n]||'')}
function categoryFromSubject(a){const s=(a||[]).join(' ').toLowerCase();if(mode==='comic'||/comic|manga|漫画|コミック/.test(s))return'漫画・コミック';if(/mystery|detective|crime|ミステ/.test(s))return'ミステリー';if(/science fiction|fantasy|sf|ファンタジ/.test(s))return'SF・ファンタジー';if(/horror|ホラー/.test(s))return'ホラー';if(/romance|恋愛/.test(s))return'恋愛';if(/history|歴史/.test(s))return'歴史・地理';if(/philosophy|思想|哲学/.test(s))return'哲学・思想';if(/business|econom|経済|ビジネス/.test(s))return'ビジネス・経済';if(/children|juvenile|児童|絵本/.test(s))return'絵本・児童書';if(/fiction|literature|novel|小説|文学/.test(s))return'小説';return'その他'}
function publisherInfo(name){name=tr(name);if(!name)return['',''];const hit=P.find(x=>x&&norm(x)===norm(name));return hit?[hit,'']:['',name]}
async function fetchJSON(url,ms=15000){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('通信エラー '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function fetchXML(url,ms=15000){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('通信エラー '+r.status);const t=await r.text(),d=new DOMParser().parseFromString(t,'application/xml');if(d.querySelector('parsererror'))throw Error('XML解析エラー');return d}finally{clearTimeout(timer)}}
const OL_FIELDS='key,title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';
async function olExact(a,t){let q=[];if(a)q.push(`author:\"${a.replaceAll('"','')}\"`);if(t)q.push(`title:\"${t.replaceAll('"','')}\"`);q.push('language:jpn');return fetchJSON('https://openlibrary.org/search.json?q='+encodeURIComponent(q.join(' AND '))+'&lang=ja&fields='+encodeURIComponent(OL_FIELDS)+'&limit=70')}
async function olLoose(a,t){const q=[looseWords(t),looseWords(a)].filter(Boolean).join(' ');return fetchJSON('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(OL_FIELDS)+'&limit=70')}
function bestOl(d){const ed=d.editions?.docs||[],jeds=ed.filter(x=>(x.language||[]).includes('jpn')),e=jeds.find(x=>JP.test(x.title||''))||jeds[0]||{},title=JP.test(e.title||'')?e.title:(JP.test(d.title||'')?d.title:e.title||d.title||''),isbn=(e.isbn||d.isbn||[]).find(x=>cleanISBN(x).length===13)||(e.isbn||d.isbn||[])[0]||'',author=(d.author_name||[]).find(x=>JP.test(x))||(JP.test(searchedAuthor)?searchedAuthor:'')||d.author_name?.[0]||'';return{key:d.key||'',title,author,publisher:(e.publisher||d.publisher||[])[0]||'',isbn,subject:d.subject||[],source:'Open Library'}}
function localEls(root,name){return [...root.getElementsByTagName('*')].filter(x=>x.localName===name)}
function parseNdl(doc){const out=[];for(const item of [...doc.getElementsByTagName('item')]){const raw=tr(item.getElementsByTagName('title')[0]?.textContent||''),desc=tr(item.getElementsByTagName('description')[0]?.textContent||'');let title=raw,author='';const slash=raw.lastIndexOf(' / ');if(slash>0){title=tr(raw.slice(0,slash));author=tr(raw.slice(slash+3).replace(/ほか$/,''))}const creators=localEls(item,'creator').map(x=>tr(x.textContent)).filter(Boolean);if(creators.find(x=>JP.test(x)))author=creators.find(x=>JP.test(x));const pubs=localEls(item,'publisher').map(x=>tr(x.textContent)).filter(Boolean);const ids=localEls(item,'identifier').map(x=>tr(x.textContent)).concat([desc]);let isbn='';for(const s of ids){const m=String(s).replace(/[^0-9Xx]/g,'').match(/(?:97[89]\d{10}|\d{9}[0-9Xx])/);if(m){isbn=m[0];break}}const categories=[...item.getElementsByTagName('category')].map(x=>tr(x.textContent));if(!title||!JP.test(title))continue;out.push({key:'ndl:'+norm(title)+'|'+norm(author)+'|'+isbn,title,author,publisher:pubs[0]||'',isbn,subject:categories,source:'NDLサーチ'})}return out}
async function ndlSearch(a,t){const terms=[looseWords(t),looseWords(a)].filter(Boolean).join(' ');if(!terms)return[];const u='https://ndlsearch.ndl.go.jp/api/opensearch?cnt=60&any='+encodeURIComponent(terms);return parseNdl(await fetchXML(u))}
function score(x){let s=0,qt=norm(searchedTitle),qa=norm(searchedAuthor),xt=norm(x.title),xa=norm(x.author);if(qt){if(xt===qt)s+=100;else if(xt.includes(qt)||qt.includes(xt))s+=65;else{const chunks=looseWords(searchedTitle).split(' ').map(norm).filter(Boolean);s+=chunks.filter(c=>xt.includes(c)).length*18}}if(qa){if(xa===qa)s+=60;else if(xa.includes(qa)||qa.includes(xa))s+=35}if(x.source==='NDLサーチ')s+=8;if(x.isbn)s+=6;return s}
function mergeCandidates(list){const map=new Map;for(const x of list){if(!x||!x.title||!JP.test(x.title))continue;const isbn=cleanISBN(x.isbn),k=isbn?'isbn:'+isbn:'t:'+norm(x.title)+'|a:'+norm(x.author);if(!map.has(k))map.set(k,x);else{const y=map.get(k);if(y.source!=='NDLサーチ'&&x.source==='NDLサーチ')map.set(k,{...y,...x,subject:y.subject?.length?y.subject:x.subject})}}return [...map.values()].sort((a,b)=>score(b)-score(a)).slice(0,120)}
function makeBook(x){const pp=publisherInfo(x.publisher),pt=part(x.title);return{id:crypto.randomUUID(),workKey:x.key||'',title:x.title,author:JP.test(x.author)?x.author:(JP.test(searchedAuthor)?searchedAuthor:x.author),titleReading:'',authorReading:'',category:categoryFromSubject(x.subject),publisher:pp[0],publisherFree:pp[1],isbn:cleanISBN(x.isbn),upper:pt.upper,middle:pt.middle,lower:pt.lower,masterpiece:'',read:'',owned:'',memo:'',remarks:'',volume:vol(x.title),status:'登録済み',source:x.source||'候補'}}
function arr(x){return Array.isArray(x)?x:(x?[x]:[])}function textVal(x){if(x==null)return'';if(typeof x==='string')return x;if(typeof x==='object')return x.content||x.Content||'';return String(x)}
function openbdTitle(rec){const te=rec?.onix?.DescriptiveDetail?.TitleDetail?.TitleElement,first=Array.isArray(te)?te[0]:te,tt=first?.TitleText;return{title:tr(textVal(tt)||rec?.summary?.title||''),reading:kataToHira(tt?.collationkey||'')}}
function openbdAuthors(rec){const cs=arr(rec?.onix?.DescriptiveDetail?.Contributor),authors=[];for(const c of cs){const pn=c?.PersonName,name=tr(textVal(pn));if(!name||!JP.test(name))continue;const roles=arr(c?.ContributorRole),isAuthor=roles.includes('A01');authors.push({name:name.replace(/[\s　]+/g,''),reading:kataToHira(pn?.collationkey||''),isAuthor})}const chosen=authors.filter(x=>x.isAuthor).length?authors.filter(x=>x.isAuthor):authors.slice(0,1);return{name:chosen.map(x=>x.name).join('、'),reading:chosen.map(x=>x.reading).filter(Boolean).join('、')}}
function openbdPublisher(rec){return tr(rec?.onix?.PublishingDetail?.Imprint?.ImprintName||rec?.onix?.PublishingDetail?.Publisher?.PublisherName||rec?.summary?.publisher||rec?.hanmoto?.hanmotoinfo?.name||'')}
function applyOpenBD(b,rec){const t=openbdTitle(rec),a=openbdAuthors(rec),pub=openbdPublisher(rec),pp=publisherInfo(pub),ndc=rec?.hanmoto?.ndccode||'';if(t.title)b.title=t.title;if(t.reading)b.titleReading=t.reading;if(a.name)b.author=a.name;if(a.reading)b.authorReading=a.reading;if(pub){b.publisher=pp[0];b.publisherFree=pp[1]}b.isbn=cleanISBN(rec?.summary?.isbn||rec?.onix?.RecordReference||b.isbn);const c=categoryFromNdc(ndc);if(c)b.category=c;if(mode==='comic')b.category='漫画・コミック';if(rec?.summary?.volume)b.volume=rec.summary.volume;Object.assign(b,part(b.title));b.status='openBD取得済み';b.source='openBD'}
let worker=null;try{worker=new Worker('./reading-worker.js');worker.onmessage=e=>{const d=e.data||{},b=B.find(x=>x.id===d.id);if(!b||d.error)return;if(!b.titleReading)b.titleReading=d.titleReading||'';if(!b.authorReading)b.authorReading=d.authorReading||'';save();const card=document.querySelector(`.book[data-id="${CSS.escape(b.id)}"]`);if(card){const t=card.querySelector('[data-f="titleReading"]'),a=card.querySelector('[data-f="authorReading"]');if(t)t.value=b.titleReading;if(a)a.value=b.authorReading}}}catch(e){}function requestReading(b){if(worker&&(!b.titleReading||!b.authorReading))worker.postMessage({id:b.id,title:b.title,author:b.author})}
function opt(a,v){return a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function inp(l,b,k,full=''){return`<div class="field ${full}"><label>${l}</label><input type="text" data-f="${k}" value="${esc(b[k]||'')}"></div>`}function ta(l,b,k){return`<div class="field full"><label>${l}</label><textarea data-f="${k}">${esc(b[k]||'')}</textarea></div>`}function ck(l,b,k){return`<label><input type="checkbox" data-c="${k}" ${b[k]==='○'?'checked':''}> ${l}</label>`}
function render(){ $('cnt').textContent=B.length+'冊';$('detail').innerHTML=B.length?'':'<div class="muted" style="padding:18px 0">検索結果から本を選んでください。</div>';B.forEach((b,i)=>{let html;if(mode==='book'){html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作家',b,'author','full')}${inp('タイトルよみ（自動）',b,'titleReading')}${inp('作家よみ（自動）',b,'authorReading')}<div class="field"><label>カテゴリ</label><select data-f="category">${opt(C,b.category)}</select></div><div class="field"><label>出版社</label><select data-f="publisher">${opt(P,b.publisher)}</select></div>${inp('出版社自由記載',b,'publisherFree','full')}<div class="field full"><label>上・中・下／管理項目</label><div class="checks">${ck('上巻',b,'upper')}${ck('中巻',b,'middle')}${ck('下巻',b,'lower')}${ck('名作',b,'masterpiece')}${ck('読破',b,'read')}${ck('所有',b,'owned')}</div></div>${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}<div class="field full"><label>詳細（ISBN）</label><input type="text" value="${esc(b.isbn?'ISBN：'+b.isbn:'')}" readonly></div></div>`}else{html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作者',b,'author','full')}${inp('出版社',b,'publisher')}${inp('巻数',b,'volume')}${inp('ISBN',b,'isbn')}${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}</div>`}$('detail').insertAdjacentHTML('beforeend',`<div class="book" data-id="${b.id}"><div class="bookhead"><div><b>${i+1}. ${esc(b.title)}</b> <span class="source">${esc(b.source||'')}</span></div><button class="x" data-del="${b.id}">削除</button></div>${html}</div>`)});$('detail').querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{const b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.f]=el.value;save()});$('detail').querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{const b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.c]=el.checked?'○':'';save()});$('detail').querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{B=B.filter(x=>x.id!==el.dataset.del);save();render()})}
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{mode=r.value;save();render()});
$('find').onclick=async()=>{searchedAuthor=tr($('author').value);searchedTitle=tr($('workTitle').value);if(!searchedAuthor&&!searchedTitle){$('notice').className='notice bad';$('notice').textContent='著者名または著作名を入力してください。';return}$('results').innerHTML='<div class="muted" style="padding:24px">複数の検索方法で検索中…</div>';$('sel').disabled=true;$('find').disabled=true;try{const jobs=[olExact(searchedAuthor,searchedTitle),olLoose(searchedAuthor,searchedTitle),ndlSearch(searchedAuthor,searchedTitle)];const rs=await Promise.allSettled(jobs),all=[];for(let i=0;i<rs.length;i++){if(rs[i].status!=='fulfilled')continue;if(i<2)for(const d of rs[i].value.docs||[])all.push(bestOl(d));else all.push(...rs[i].value)}candidates=mergeCandidates(all);$('results').innerHTML=candidates.length?candidates.map((x,i)=>`<label class="res"><input type="checkbox" class="cand" data-i="${i}"><span><b>${esc(x.title)}</b><div class="meta">${esc(x.author||'著者不明')}${x.publisher?' ／ '+esc(x.publisher):''}${x.isbn?' ／ ISBN '+esc(x.isbn):''} ／ ${esc(x.source)}</div></span></label>`).join(''):'<div class="muted" style="padding:24px">候補が見つかりませんでした。通称だけで見つからない場合は、著者名も併記すると精度が上がります。</div>';$('results').querySelectorAll('.cand').forEach(c=>c.onchange=()=>$('sel').disabled=![...$('results').querySelectorAll('.cand')].some(x=>x.checked));$('resultInfo').textContent=candidates.length+'件';$('notice').className='notice';$('notice').textContent='表記ゆれを含めて候補をまとめました。必要な本だけチェックしてください。'}catch(e){$('notice').className='notice bad';$('notice').textContent='検索エラー：'+e.message}finally{$('find').disabled=false}};
$('searchClear').onclick=()=>{$('author').value='';$('workTitle').value='';searchedAuthor='';searchedTitle='';candidates=[];$('results').innerHTML='<div class="muted" style="padding:24px;text-align:center">著者名または著作名を入力してください</div>';$('resultInfo').textContent='';$('sel').disabled=true;$('notice').className='notice';$('notice').textContent='検索条件をクリアしました。'};
$('sel').onclick=()=>{const selected=[...$('results').querySelectorAll('.cand:checked')].map(c=>candidates[+c.dataset.i]);let n=0;for(const x of selected){if(B.some(b=>(cleanISBN(b.isbn)&&cleanISBN(b.isbn)===cleanISBN(x.isbn))||norm(b.title)===norm(x.title)&&norm(b.author)===norm(x.author)))continue;const b=makeBook(x);B.push(b);requestReading(b);n++}save();render();$('sel').disabled=true;$('notice').className='notice';$('notice').textContent=n+'冊を登録しました。'};
$('batch').onclick=async()=>{if(!B.length)return;const btn=$('batch'),p=$('batchProgress');btn.disabled=true;p.style.display='block';const targets=B.filter(b=>[10,13].includes(cleanISBN(b.isbn).length));if(!targets.length){p.textContent='ISBNがある本がありません。NDL候補を選ぶとISBNが見つかる場合があります。';btn.disabled=false;return}try{p.textContent='openBDへ問い合わせ中…';const isbns=[...new Set(targets.map(b=>cleanISBN(b.isbn)))],data=await fetchJSON('https://api.openbd.jp/v1/get?isbn='+encodeURIComponent(isbns.join(','))),map=new Map;for(const rec of data||[]){if(!rec)continue;const id=cleanISBN(rec?.summary?.isbn||rec?.onix?.RecordReference||'');if(id)map.set(id,rec)}let ok=0;for(let i=0;i<targets.length;i++){const b=targets[i];p.textContent=`${i+1}/${targets.length}冊目を反映中：${b.title}`;const rec=map.get(cleanISBN(b.isbn));if(rec){applyOpenBD(b,rec);ok++}requestReading(b);save();render();await new Promise(r=>setTimeout(r,20))}p.textContent=`完了：${ok}/${targets.length}冊をopenBDから取得しました。`}catch(e){p.textContent='openBD取得エラー：'+e.message}finally{btn.disabled=false}};
$('clear').onclick=()=>{if(B.length&&confirm('選択した書籍をすべて削除しますか？')){B=[];save();render()}};
function out(rows,sheet,name){if(typeof XLSX==='undefined')return alert('Excelライブラリを読み込めません');const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}
$('excel').onclick=()=>{if(mode==='book')out([['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...B.map(b=>[b.title,b.author,b.titleReading,b.authorReading,b.category,b.publisher,b.publisherFree,b.upper,b.middle,b.lower,b.masterpiece,b.read,b.owned,b.memo,b.isbn?'ISBN：'+b.isbn:''])],'書籍読込用','書籍読込用');else out([['タイトル','作者','出版社','巻数','ISBN'],...B.map(b=>[b.title,b.author,b.publisher||b.publisherFree,b.volume,b.isbn?'ISBN '+b.isbn:''])],'コミック読込用','コミック読込用')};
render();for(const b of B)requestReading(b);
</script></body></html>
