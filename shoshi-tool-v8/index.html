<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書誌情報作成ツール v8</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>:root{--bg:#f4f6f8;--nav:#263746;--line:#d7dee5;--blue:#2f5f8f;--green:#2f6b45;--muted:#6b7783}*{box-sizing:border-box}body{font-family:system-ui,"Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);margin:0;color:#24303b}header{background:var(--nav);color:#fff;padding:18px}main{max-width:1050px;margin:auto;padding:18px}.card,.book{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.toolbar,.row,.bookhead{display:flex;gap:8px;align-items:center}.toolbar,.bookhead{justify-content:space-between;flex-wrap:wrap}.row input{flex:1}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input[type=text],select,textarea{width:100%;padding:9px;border:1px solid #bcc7d0;border-radius:7px;background:#fff}textarea{min-height:72px;resize:vertical}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.b{background:var(--blue);color:#fff}.g{background:var(--green);color:#fff}.x{background:#f8e7e7;color:#922}.s{background:#e7edf2;color:#263746}.muted{font-size:12px;color:var(--muted)}.notice{background:#edf6ee;border:1px solid #bdd8c3;padding:10px 12px;border-radius:8px;margin-bottom:14px}.notice.bad{background:#fff1f1;border-color:#e6bcbc;color:#8b2525}.results{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}.res{display:flex;gap:10px;padding:10px;border-bottom:1px solid #edf0f2;align-items:flex-start}.res input{margin-top:4px}.candidate-meta{font-size:11px;color:#74808b;margin-top:3px}.book h3{margin:0;font-size:15px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:#53616d}.checks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.checks label{border:1px solid #d5dde4;border-radius:7px;padding:8px;background:#fff}.pill{background:#eef4fa;color:#234a70;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.mode label{margin-right:14px}.progress{margin-top:8px;padding:8px 10px;background:#f7f9fb;border-radius:7px;font-size:12px;color:#53616d}.reading-note{font-size:11px;color:#6b7783;margin-top:4px}@media(max-width:800px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column;align-items:stretch}.checks{grid-template-columns:1fr 1fr}}</style></head><body><header><b>書誌情報作成ツール v8</b><div class="muted" style="color:#d8e0e7">著者検索 → 選択登録 → 一括データ取得／読みは別スレッドで自動生成</div></header><main><div id="notice" class="notice">登録は即時完了します。書誌の一括取得は1冊ずつ処理するため、画面操作を止めにくい構造です。</div><section class="card mode"><b>① 出力形式</b>　<label><input type="radio" name="mode" value="book" checked> 書籍版</label><label><input type="radio" name="mode" value="comic"> コミック版</label></section><section class="card"><b>② 著者名から著書を検索</b><div class="row" style="margin-top:10px"><input id="author" type="text" placeholder="例：東野圭吾"><button id="find" class="b">著書一覧を表示</button></div><div id="results" class="results"><div class="muted" style="padding:24px;text-align:center">著者名を入力してください</div></div><div class="toolbar" style="margin-top:10px"><span id="resultInfo" class="muted"></span><button id="sel" class="s" disabled>チェックした著書を登録</button></div></section><section class="card"><div class="toolbar"><b>③ 選択した書籍 <span id="cnt" class="pill">0冊</span></b><div><button id="batch" class="b">選択書籍のデータを一括取得</button> <button id="clear" class="x">すべて削除</button></div></div><div id="batchProgress" class="progress" style="display:none"></div><div id="detail"></div></section><section class="card"><div class="toolbar"><b>④ Excel出力</b><button id="excel" class="g">選択中の形式でExcel作成</button></div><div class="muted">書籍版の「詳細」列にはISBNを出力します。備考は画面内保存のみです。</div></section></main><script>const $=id=>document.getElementById(id),jp=/[ぁ-んァ-ヶ一-龠々〆ヵヶ]/;const C=['','ビジネス・経済','科学・テクノロジー','歴史・地理','哲学・思想','社会・文化','政治・法律','芸術・デザイン','スポーツ','趣味・実用','健康・医療','料理・食','暮らし・生活','教育','語学・辞書','旅行・紀行','エッセイ・随筆','ノンフィクション','小説','ミステリー','SF・ファンタジー','ホラー','恋愛','時代・歴史小説','ライトノベル','漫画・コミック','絵本・児童書','詩・短歌・俳句','戯曲','ユーモア・娯楽','その他'];const P=['','岩波書店','筑摩書房','中央公論新社','新潮社','文藝春秋','講談社','集英社','小学館','角川書店','KADOKAWA','河出書房新社','平凡社','みすず書房','晶文社','作品社','白水社','早川書房','東京創元社','光文社','双葉社','徳間書店','宝島社','扶桑社','PHP研究所','東洋経済新報社','日経BP','日本経済新聞出版','ダイヤモンド社','サンマーク出版','幻冬舎','ポプラ社','福音館書店'];const PA={'iwanami':'岩波書店','chikuma':'筑摩書房','chuokoron':'中央公論新社','shinchosha':'新潮社','bungeishunju':'文藝春秋','kodansha':'講談社','shueisha':'集英社','shogakukan':'小学館','kadokawa shoten':'角川書店','kadokawa':'KADOKAWA','kawade':'河出書房新社','heibonsha':'平凡社','misuzu':'みすず書房','shobunsha':'晶文社','sakuhinsha':'作品社','hakusuisha':'白水社','hayakawa':'早川書房','tokyo sogensha':'東京創元社','sogensha':'東京創元社','kobunsha':'光文社','futabasha':'双葉社','tokuma':'徳間書店','takarajimasha':'宝島社','fusosha':'扶桑社','php':'PHP研究所','toyokeizai':'東洋経済新報社','nikkei bp':'日経BP','nihon keizai':'日本経済新聞出版','diamond':'ダイヤモンド社','sunmark':'サンマーク出版','gentosha':'幻冬舎','poplar':'ポプラ社','fukuinkan':'福音館書店'};let B=JSON.parse(localStorage.getItem('bibv8')||'[]'),mode=localStorage.getItem('bibv8mode')||'book',candidates=[],searchedAuthor='';document.querySelector(`input[name=mode][value=${mode}]`).checked=true;const tr=s=>(s||'').trim(),nm=s=>tr(s).toLowerCase().replace(/[\s・･:：\-―—_()（）\[\]【】『』「」]/g,''),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('bibv8',JSON.stringify(B));localStorage.setItem('bibv8mode',mode)}function part(t){t=String(t||'');return{upper:/上巻|[（(]上[）)]/.test(t)?'○':'',middle:/中巻|[（(]中[）)]/.test(t)?'○':'',lower:/下巻|[（(]下[）)]/.test(t)?'○':''}}function vol(t){let m=String(t||'').match(/(?:第\s*)?(\d+)\s*巻|vol\.?\s*(\d+)/i);return m?Number(m[1]||m[2]):''}function cat(a){const s=(a||[]).join(' ').toLowerCase();if(/comic|manga|漫画|コミック/.test(s))return'漫画・コミック';if(/mystery|detective|crime|ミステ/.test(s))return'ミステリー';if(/science fiction|fantasy|sf|ファンタジ/.test(s))return'SF・ファンタジー';if(/horror|ホラー/.test(s))return'ホラー';if(/romance|恋愛/.test(s))return'恋愛';if(/historical fiction|時代小説/.test(s))return'時代・歴史小説';if(/history|歴史|geography/.test(s))return'歴史・地理';if(/philosophy|思想|哲学/.test(s))return'哲学・思想';if(/social|culture|社会|文化/.test(s))return'社会・文化';if(/politic|law|政治|法律/.test(s))return'政治・法律';if(/science|technology|科学|技術/.test(s))return'科学・テクノロジー';if(/business|econom|経済|ビジネス/.test(s))return'ビジネス・経済';if(/art|design|芸術|美術/.test(s))return'芸術・デザイン';if(/sport/.test(s))return'スポーツ';if(/health|medical|medicine|健康|医療/.test(s))return'健康・医療';if(/cook|food|料理|食/.test(s))return'料理・食';if(/education|教育/.test(s))return'教育';if(/language|dictionary|語学|辞書/.test(s))return'語学・辞書';if(/travel|旅行/.test(s))return'旅行・紀行';if(/essay|随筆|エッセイ/.test(s))return'エッセイ・随筆';if(/nonfiction|biography|ノンフィクション/.test(s))return'ノンフィクション';if(/poetry|詩|俳句|短歌/.test(s))return'詩・短歌・俳句';if(/drama|play|戯曲/.test(s))return'戯曲';if(/children|juvenile|児童|絵本/.test(s))return'絵本・児童書';if(/fiction|literature|novel|小説|文学/.test(s))return'小説';return'その他'}function jpAuthor(names,fallback){if(jp.test(fallback||''))return tr(fallback);let parts=(names||[]).flatMap(x=>String(x).split(/[、,;／/]/)).map(tr).filter(Boolean),j=parts.filter(x=>jp.test(x));return j[0]||parts[0]||tr(fallback)}function publisherInfo(values){let arr=(Array.isArray(values)?values:[values]).flat().map(tr).filter(Boolean);for(const r of arr){let exact=P.find(x=>x&&nm(x)===nm(r));if(exact)return[exact,'']}for(const r of arr){if(jp.test(r)){let exact=P.find(x=>x&&nm(x)===nm(r));return exact?[exact,'']:['',r]}}for(const r of arr){let l=r.toLowerCase();for(const[a,j]of Object.entries(PA))if(l.includes(a))return[j,'']}return['',arr[0]||'']}async function api(u){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),15000);try{const r=await fetch(u,{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('検索サービス応答 '+r.status);return await r.json()}catch(e){if(e.name==='AbortError')throw Error('検索がタイムアウトしました');throw e}finally{clearTimeout(timer)}}function editionBest(d,fallbackAuthor=''){const ed=d.editions?.docs||[],jeds=ed.filter(z=>(z.language||[]).includes('jpn')),x=jeds.find(z=>jp.test(z.title||''))||jeds[0]||{};const title=jp.test(x.title||'')?x.title:(jp.test(d.title||'')?d.title:x.title||d.title||'');const variants=[...new Set(jeds.map(z=>tr(z.title)).filter(Boolean))].filter(v=>nm(v)!==nm(title)).slice(0,3);const pubs=[...(x.publisher||[]),...(d.publisher||[])];return{workKey:d.key||'',title,variants,author:jpAuthor(d.author_name||[],fallbackAuthor),publishers:pubs,isbn:(x.isbn||d.isbn||[])[0]||'',subject:d.subject||[]}}async function searchA(a){const q=`author:"${a.replaceAll('"','')}" AND language:jpn`,f='key,title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(f)+'&limit=60')}async function searchT(t,a){const q=`title:"${t.replaceAll('"','')}" AND language:jpn`+(a?` AND author:"${a.replaceAll('"','')}"`:''),f='key,title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(f)+'&limit=10')}function makeBook(x){const pp=publisherInfo(x.publishers),pt=part(x.title);return{id:crypto.randomUUID(),workKey:x.workKey||'',title:x.title,author:x.author,titleReading:'',authorReading:'',readingState:'待機',category:cat(x.subject),publisher:pp[0],publisherFree:pp[1],isbn:x.isbn||'',upper:pt.upper,middle:pt.middle,lower:pt.lower,masterpiece:'',read:'',owned:'○',memo:'',remarks:'',volume:vol(x.title),status:'候補取得済み'}}function opt(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function inp(label,b,key,full=''){return`<div class="field ${full}"><label>${label}</label><input type="text" data-f="${key}" value="${esc(b[key]||'')}"></div>`}function ta(label,b,key){return`<div class="field full"><label>${label}</label><textarea data-f="${key}">${esc(b[key]||'')}</textarea></div>`}function ck(label,b,key){return`<label><input type="checkbox" data-c="${key}" ${b[key]==='○'?'checked':''}> ${label}</label>`}let worker=null;try{worker=new Worker('reader-worker.js');worker.onmessage=e=>{const m=e.data||{},b=B.find(x=>x.id===m.id);if(!b)return;if(m.ok){if(!b.titleReading)b.titleReading=m.titleReading||'';if(!b.authorReading)b.authorReading=m.authorReading||'';b.readingState='完了'}else b.readingState='失敗';save();const card=document.querySelector(`.book[data-id="${b.id}"]`);if(card){let t=card.querySelector('[data-f="titleReading"]'),a=card.querySelector('[data-f="authorReading"]'),n=card.querySelector('.reading-note');if(t&&!t.value)t.value=b.titleReading;if(a&&!a.value)a.value=b.authorReading;if(n)n.textContent='読み自動生成：'+b.readingState}}}catch(e){}function requestReading(b){if(!worker)return;b.readingState='生成中';worker.postMessage({id:b.id,title:b.title,author:b.author})}function render(){$('cnt').textContent=B.length+'冊';$('batch').disabled=!B.length;$('detail').innerHTML=B.length?'':'<div class="muted" style="padding:18px 0">著者検索から本を選んでください。</div>';B.forEach((b,i)=>{let html;if(mode==='book'){html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作家',b,'author','full')}${inp('タイトルよみ（自動）',b,'titleReading')}${inp('作家よみ（自動）',b,'authorReading')}<div class="field"><label>カテゴリ</label><select data-f="category">${opt(C,b.category)}</select></div><div class="field"><label>出版社</label><select data-f="publisher">${opt(P,b.publisher)}</select></div>${inp('出版社自由記載',b,'publisherFree','full')}<div class="field full"><label>上・中・下／管理項目</label><div class="checks">${ck('上巻',b,'upper')}${ck('中巻',b,'middle')}${ck('下巻',b,'lower')}${ck('名作',b,'masterpiece')}${ck('読破',b,'read')}${ck('所有',b,'owned')}</div></div>${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}<div class="field full"><label>詳細（ISBN）</label><input type="text" value="${esc(b.isbn?'ISBN：'+b.isbn:'')}" readonly><div class="reading-note">読み自動生成：${esc(b.readingState||'待機')}</div></div></div>`}else{html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作者',b,'author','full')}${inp('出版社',b,'publisher')}${inp('巻数',b,'volume')}${inp('ISBN',b,'isbn')}${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}</div>`}$('detail').insertAdjacentHTML('beforeend',`<div class="book" data-id="${b.id}"><div class="bookhead"><h3>${i+1}. ${esc(b.title)}</h3><button class="x" data-del="${b.id}">削除</button></div>${html}</div>`)});$('detail').querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{let b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.f]=el.value;save();if(el.dataset.f==='title'||el.dataset.f==='author')requestReading(b)});$('detail').querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{let b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.c]=el.checked?'○':'';save()});$('detail').querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{B=B.filter(x=>x.id!==el.dataset.del);save();render()})}document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{mode=r.value;save();render()});$('find').onclick=async()=>{let a=tr($('author').value);if(!a)return;searchedAuthor=a;$('results').innerHTML='<div class="muted" style="padding:24px">検索中…</div>';$('sel').disabled=true;$('notice').className='notice';$('notice').textContent='日本語版の作品一覧を検索中…';try{let d=await searchA(a),map=new Map;for(const raw of d.docs||[]){let x=editionBest(raw,a);if(!x.title||!jp.test(x.title))continue;let key=x.workKey||nm(x.title);if(!map.has(key))map.set(key,x)}candidates=[...map.values()].sort((a,b)=>a.title.localeCompare(b.title,'ja'));$('results').innerHTML=candidates.length?candidates.map((x,i)=>{let pp=publisherInfo(x.publishers),pub=pp[0]||pp[1]||'出版社不明';return`<label class="res"><input type="checkbox" class="cand" data-i="${i}"><span><b>${esc(x.title)}</b>${x.variants.length?`<div class="candidate-meta">別表記：${esc(x.variants.join(' ／ '))}</div>`:''}<div class="candidate-meta">${esc(x.author)} ／ ${esc(pub)}${x.isbn?' ／ ISBN '+esc(x.isbn):''}</div></span></label>`}).join(''):'<div class="muted" style="padding:24px">日本語タイトルが見つかりませんでした。</div>';$('results').querySelectorAll('.cand').forEach(c=>c.onchange=()=>$('sel').disabled=![...$('results').querySelectorAll('.cand')].some(x=>x.checked));$('resultInfo').textContent=candidates.length+'作品';$('notice').textContent='作品一覧を取得しました。作家名は日本語表記を優先しています。'}catch(err){$('notice').className='notice bad';$('notice').textContent='検索エラー：'+err.message;$('results').innerHTML='<div class="muted" style="padding:24px">'+esc(err.message)+'</div>'}};$('sel').onclick=()=>{let selected=[...$('results').querySelectorAll('.cand:checked')].map(c=>candidates[+c.dataset.i]),added=[];for(const x of selected){if(B.some(b=>(b.workKey&&x.workKey&&b.workKey===x.workKey)||nm(b.title)===nm(x.title)))continue;let b=makeBook(x);B.push(b);added.push(b)}save();render();$('sel').disabled=true;for(const b of added)requestReading(b);$('notice').textContent=added.length+'冊を登録しました。読みは裏側で自動生成します。'};async function enrichBook(b){let d=await searchT(b.title,b.author),raw=d.docs&&d.docs[0];if(!raw){b.status='要確認';return}let x=editionBest(raw,b.author);if(x.title&&jp.test(x.title))b.title=x.title;if(x.author&&jp.test(x.author))b.author=x.author;let pp=publisherInfo(x.publishers);if(pp[0]||pp[1]){b.publisher=pp[0];b.publisherFree=pp[1]}if(x.isbn)b.isbn=x.isbn;if(x.subject&&x.subject.length)b.category=cat(x.subject);let pt=part(b.title);b.upper=pt.upper;b.middle=pt.middle;b.lower=pt.lower;b.volume=vol(b.title);b.status='一括取得済み';requestReading(b)}$('batch').onclick=async()=>{if(!B.length)return;const btn=$('batch'),p=$('batchProgress');btn.disabled=true;$('find').disabled=true;$('sel').disabled=true;p.style.display='block';let ok=0,ng=0;for(let i=0;i<B.length;i++){p.textContent=`${i+1}/${B.length}冊目を取得中：${B[i].title}`;try{await enrichBook(B[i]);ok++}catch(e){B[i].status='取得失敗';ng++}save();await new Promise(r=>setTimeout(r,80))}render();p.textContent=`一括取得完了：${ok}冊取得／${ng}冊失敗。読みは別スレッドで自動生成中です。`;btn.disabled=false;$('find').disabled=false;$('notice').textContent='一括データ取得が完了しました。出版社・作家名は日本語表記を優先しています。'};$('clear').onclick=()=>{if(B.length&&confirm('選択した書籍をすべて削除しますか？')){B=[];save();render()}};function out(rows,sheet,name){if(typeof XLSX==='undefined')return alert('Excelライブラリを読み込めません');let wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}$('excel').onclick=()=>{if(mode==='book')out([['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...B.map(b=>[b.title,b.author,b.titleReading,b.authorReading,b.category,b.publisher,b.publisherFree,b.upper,b.middle,b.lower,b.masterpiece,b.read,b.owned,b.memo,b.isbn?'ISBN：'+b.isbn:''])],'書籍読込用','書籍読込用');else out([['タイトル','作者','出版社','巻数','ISBN'],...B.map(b=>[b.title,b.author,b.publisher||b.publisherFree,b.volume,b.isbn?'ISBN '+b.isbn:''])],'コミック読込用','コミック読込用')};render();for(const b of B)if(!b.titleReading||!b.authorReading)requestReading(b);</script></body></html>
