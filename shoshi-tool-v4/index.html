<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書誌情報作成ツール v4</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script><style>:root{--bg:#f4f6f8;--nav:#263746;--line:#d7dee5;--blue:#2f5f8f;--green:#2f6b45;--text:#1f2933;--muted:#687582}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,"Yu Gothic UI",Meiryo,sans-serif;color:var(--text)}header{background:var(--nav);color:#fff;padding:18px}main{max-width:1120px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}h2{font-size:17px;margin:0 0 10px}.muted{font-size:12px;color:var(--muted)}input,select,textarea,button{font:inherit}input[type=text],select,textarea{width:100%;padding:9px;border:1px solid #bbc6d0;border-radius:7px;background:#fff}textarea{min-height:70px;resize:vertical}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e7edf2}.danger{background:#f8e7e7;color:#922}.green{background:var(--green);color:#fff}.mode{display:flex;gap:8px}.mode label{flex:1;border:1px solid #b9c5cf;border-radius:8px;padding:12px;text-align:center;cursor:pointer;font-weight:700}.mode input{margin-right:6px}.notice{padding:10px 12px;border-radius:8px;background:#edf6ee;border:1px solid #bdd8c3;font-size:13px;margin-bottom:14px}.notice.bad{background:#fff1f1;border-color:#e6bcbc;color:#8b2525}.row{display:flex;gap:8px;align-items:end}.row>div{flex:1}.results{margin-top:10px;border:1px solid var(--line);border-radius:8px;max-height:360px;overflow:auto}.result{display:flex;gap:9px;padding:9px;border-bottom:1px solid #edf0f2}.result b{font-size:14px}.list{width:100%;border-collapse:collapse;font-size:13px}.list th,.list td{padding:8px;border-bottom:1px solid #e8edf0;text-align:left;vertical-align:top}.list th{background:#f1f4f6}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.pill{background:#eef4fa;color:#234a70;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.bookcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;background:#fbfcfd}.bookhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.bookhead b{font-size:15px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 14px}.field label{display:block;font-size:12px;font-weight:700;color:#53616d;margin-bottom:4px}.field.full{grid-column:1/-1}.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.checkbox{display:flex;align-items:center;gap:6px;border:1px solid #d5dde4;border-radius:7px;padding:8px;background:#fff}.reading-status{font-size:11px;color:#687582;margin-top:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.mode{flex-direction:column}.fields{grid-template-columns:1fr}.triple,.checks{grid-template-columns:1fr}}</style></head><body><header><b>書誌情報作成ツール v4</b><div style="font-size:12px;color:#d8e0e7">日本語版のみ・縦型編集・読み自動入力</div></header><main><div id="notice" class="notice">検索元：Open Library。タイトル・作家の読みはブラウザ内で自動生成します。</div><section class="card"><h2>① 出力形式</h2><div class="mode"><label><input type="radio" name="mode" value="book" checked>書籍版</label><label><input type="radio" name="mode" value="comic">コミック版</label></div></section><div class="grid"><section class="card"><h2>② 著書名から追加</h2><input id="title" type="text" placeholder="著書名"><div style="height:7px"></div><input id="author2" type="text" placeholder="著者名（任意）"><div style="height:9px"></div><button id="add" class="primary">検索リストへ追加</button></section><section class="card"><h2>③ 著者名から著書を選ぶ</h2><div class="row"><div><input id="author" type="text" placeholder="例：夏目漱石"></div><button id="find" class="primary">著書を検索</button></div><div id="results" class="results"><div class="muted" style="padding:20px;text-align:center">著者名を入力してください</div></div><div style="margin-top:9px"><button id="sel" class="secondary" disabled>選択した著書を追加</button></div></section></div><section class="card"><div class="toolbar"><h2>④ 検索リスト <span id="cnt" class="pill">0冊</span></h2><div><button id="clear" class="danger">すべて削除</button> <button id="lookup" class="primary">ネットで一括書誌検索</button></div></div><table class="list"><thead><tr><th>著書名</th><th>著者</th><th>状態</th><th></th></tr></thead><tbody id="list"></tbody></table><div id="prog" class="muted" style="margin-top:8px"></div></section><section class="card"><div class="toolbar"><h2>⑤ 書誌情報の確認・修正</h2><span id="modeName" class="pill">書籍版</span></div><div class="muted">横スクロールはありません。1冊ずつ上から下へ入力できます。</div><div id="detail"></div><div class="actions"><button id="excel" class="green">選択中の形式でExcel作成</button></div></section></main><script>const $=id=>document.getElementById(id),jp=/[ぁ-んァ-ヶ一-龠々〆ヵヶ]/;let books=JSON.parse(localStorage.getItem('bibtool_v4')||'[]'),mode=localStorage.getItem('bibtool_v4_mode')||'book',tokenizer=null,tokenizerPromise=null;document.querySelector(`input[name=mode][value=${mode}]`).checked=true;const trim=s=>(s||'').trim(),norm=s=>trim(s).toLowerCase().replace(/[\s・･:：\-―—_()（）\[\]【】]/g,''),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('bibtool_v4',JSON.stringify(books));localStorage.setItem('bibtool_v4_mode',mode)}function volume(t){let m=String(t||'').match(/(?:第\s*)?(\d+)\s*巻|(?:vol\.?\s*)(\d+)/i);return m?Number(m[1]||m[2]):''}function category(s){s=(s||[]).join(' ');if(/comic|manga|漫画|コミック/i.test(s))return'コミック';if(/mystery|detective|ミステ/i.test(s))return'ミステリー';if(/history|歴史/i.test(s))return'歴史';if(/literature|fiction|文学|小説/i.test(s))return'文学';return''}function kataToHira(s){return String(s||'').replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60))}function getTokenizer(){if(tokenizer)return Promise.resolve(tokenizer);if(tokenizerPromise)return tokenizerPromise;tokenizerPromise=new Promise((resolve,reject)=>{if(typeof kuromoji==='undefined')return reject(Error('読み変換ライブラリを読み込めません'));kuromoji.builder({dicPath:'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'}).build((err,t)=>{if(err)reject(err);else{tokenizer=t;resolve(t)}})});return tokenizerPromise}async function reading(text){if(!trim(text))return'';try{const t=await getTokenizer(),tokens=t.tokenize(text);return tokens.map(x=>x.reading?kataToHira(x.reading):x.surface_form).join('')}catch(e){return''}}async function fillReadings(b){const [tr,ar]=await Promise.all([reading(b.title),reading(b.author)]);if(!b.titleReading&&tr)b.titleReading=tr;if(!b.authorReading&&ar)b.authorReading=ar;save()}async function api(url){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),15000);try{const r=await fetch(url,{mode:'cors',cache:'no-store',headers:{Accept:'application/json'},signal:ac.signal});if(!r.ok)throw Error('検索サービス応答 '+r.status);return await r.json()}catch(e){if(e.name==='AbortError')throw Error('検索がタイムアウトしました');throw e}finally{clearTimeout(timer)}}function best(d){const eds=d.editions?.docs||[],e=eds.find(x=>(x.language||[]).includes('jpn')&&jp.test(x.title||''))||eds.find(x=>(x.language||[]).includes('jpn'))||{};return{title:jp.test(e.title||'')?e.title:(jp.test(d.title||'')?d.title:(e.title||d.title||'')),author:(d.author_name||[]).join('、'),publisher:(e.publisher||d.publisher||[])[0]||'',isbn:(e.isbn||d.isbn||[])[0]||'',subject:d.subject||[]}}async function byAuthor(a){const query=`author:"${a.replaceAll('"','')}" AND language:jpn`,fields='title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&lang=ja&fields='+encodeURIComponent(fields)+'&limit=50')}async function byTitle(t,a){let query=`title:"${t.replaceAll('"','')}" AND language:jpn`;if(a)query+=` AND author:"${a.replaceAll('"','')}"`;const fields='title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&lang=ja&fields='+encodeURIComponent(fields)+'&limit=10')}function newBook(t,a){return{id:crypto.randomUUID(),title:trim(t),author:trim(a),publisher:'',publisherFree:'',isbn:'',volume:volume(t),titleReading:'',authorReading:'',category:'',upper:'',middle:'',lower:'',masterpiece:'',read:'',owned:'○',memo:'',remarks:'',status:'検索待ち'}}async function addBook(t,a){if(!trim(t))return false;if(books.some(b=>norm(b.title)===norm(t)&&norm(b.author)===norm(a))){alert('同じ本があります');return false}const b=newBook(t,a);books.push(b);save();render();await fillReadings(b);render();return true}function render(){const l=$('list');l.innerHTML=books.length?'':'<tr><td colspan="4" class="muted">まだありません</td></tr>';books.forEach(b=>l.insertAdjacentHTML('beforeend',`<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${b.status}</td><td><button class="danger" data-del="${b.id}">削除</button></td></tr>`));l.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{books=books.filter(b=>b.id!==x.dataset.del);save();render()});$('cnt').textContent=books.length+'冊';$('modeName').textContent=mode==='book'?'書籍版':'コミック版';renderDetail()}function f(label,b,key,type='text',full=false){if(type==='textarea')return`<div class="field ${full?'full':''}"><label>${label}</label><textarea data-f="${key}">${esc(b[key]||'')}</textarea></div>`;return`<div class="field ${full?'full':''}"><label>${label}</label><input type="text" data-f="${key}" value="${esc(b[key]||'')}"></div>`}function yes(label,b,key){return`<label class="checkbox"><input type="checkbox" data-check="${key}" ${b[key]==='○'?'checked':''}>${label}</label>`}function renderDetail(){$('detail').innerHTML=books.length?'':'<div class="muted" style="padding:18px 0">検索リストに本を追加してください。</div>';books.forEach((b,i)=>{let inner;if(mode==='book'){inner=`<div class="fields">${f('タイトル',b,'title','text',true)}${f('作家',b,'author','text',true)}${f('タイトルよみ（自動）',b,'titleReading')}${f('作家よみ（自動）',b,'authorReading')}${f('カテゴリ',b,'category')}${f('出版社',b,'publisher')}${f('出版社自由記載',b,'publisherFree','text',true)}<div class="field full"><label>上・中・下</label><div class="triple">${yes('上巻',b,'upper')}${yes('中巻',b,'middle')}${yes('下巻',b,'lower')}</div></div><div class="field full"><label>管理項目</label><div class="checks">${yes('名作',b,'masterpiece')}${yes('読破',b,'read')}${yes('所有',b,'owned')}</div></div>${f('メモ（自由記入）',b,'memo','textarea',true)}${f('備考（自由記入）',b,'remarks','textarea',true)}</div>`}else{inner=`<div class="fields">${f('タイトル',b,'title','text',true)}${f('作者',b,'author','text',true)}${f('出版社',b,'publisher')}${f('巻数',b,'volume')}${f('ISBN',b,'isbn')}${f('メモ（自由記入）',b,'memo','textarea',true)}${f('備考（自由記入）',b,'remarks','textarea',true)}</div>`}$('detail').insertAdjacentHTML('beforeend',`<div class="bookcard" data-id="${b.id}"><div class="bookhead"><b>${i+1}. ${esc(b.title||'未設定')}</b><span class="pill">${esc(b.status)}</span></div>${inner}</div>`)});$('detail').querySelectorAll('[data-f]').forEach(el=>el.onchange=async()=>{const b=books.find(x=>x.id===el.closest('.bookcard').dataset.id);b[el.dataset.f]=el.value;if(el.dataset.f==='title'&&!b.titleReading)b.titleReading=await reading(el.value);if(el.dataset.f==='author'&&!b.authorReading)b.authorReading=await reading(el.value);save();render()});$('detail').querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{const b=books.find(x=>x.id===el.closest('.bookcard').dataset.id);b[el.dataset.check]=el.checked?'○':'';save()})}document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{mode=r.value;save();render()});$('add').onclick=async()=>{if(await addBook($('title').value,$('author2').value)){$('title').value='';$('author2').value=''}};$('find').onclick=async()=>{const a=trim($('author').value);if(!a)return;$('results').innerHTML='<div class="muted" style="padding:20px">検索中...</div>';$('sel').disabled=true;$('notice').className='notice';$('notice').textContent='日本語版を検索中…';try{const data=await byAuthor(a),map=new Map;for(const d of data.docs||[]){const x=best(d);if(!x.title||!jp.test(x.title)||map.has(norm(x.title)))continue;map.set(norm(x.title),x)}const w=[...map.values()];$('results')._works=w;$('results').innerHTML=w.length?w.map((x,i)=>`<label class="result"><input type="checkbox" class="ck" data-i="${i}"><span><b>${esc(x.title)}</b><div class="muted">${esc(x.author)}${x.publisher?' ／ '+esc(x.publisher):''}${x.isbn?' ／ ISBN '+esc(x.isbn):''}</div></span></label>`).join(''):'<div class="muted" style="padding:20px">日本語版の候補が見つかりませんでした。</div>';$('results').querySelectorAll('.ck').forEach(c=>c.onchange=()=>$('sel').disabled=![...$('results').querySelectorAll('.ck')].some(x=>x.checked));$('notice').textContent='検索成功：日本語版 '+w.length+'件を取得しました。'}catch(e){$('notice').className='notice bad';$('notice').textContent='検索エラー：'+(e.message||e);$('results').innerHTML='<div class="muted" style="padding:20px">'+esc(e.message||e)+'</div>'}};$('sel').onclick=async()=>{for(const c of $('results').querySelectorAll('.ck:checked')){const x=$('results')._works[+c.dataset.i];const before=books.length;if(await addBook(x.title,x.author)){const b=books[books.length-1];b.publisher=x.publisher;b.isbn=x.isbn;b.status='取得済み';await fillReadings(b);save()}if(books.length===before)continue}render();$('sel').disabled=true};$('clear').onclick=()=>{if(confirm('すべて削除しますか？')){books=[];save();render()}};$('lookup').onclick=async()=>{for(let i=0;i<books.length;i++){const b=books[i];$('prog').textContent=`${i+1}/${books.length} ${b.title} を検索中`;try{const data=await byTitle(b.title,b.author),d=(data.docs||[])[0];if(d){const x=best(d);b.title=x.title||b.title;b.author=x.author||b.author;b.publisher=x.publisher||b.publisher;b.isbn=x.isbn||b.isbn;b.volume=volume(b.title);b.category=category(x.subject);b.status='取得済み';await fillReadings(b)}else b.status='要確認'}catch(e){b.status='要確認'}save();render()}$('prog').textContent='完了しました'};function out(rows,sheet,name){if(typeof XLSX==='undefined')return alert('Excel出力ライブラリを読み込めません');const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}$('excel').onclick=()=>{if(mode==='book')out([['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...books.map(b=>[b.title,b.author,b.titleReading,b.authorReading,b.category,b.publisher,b.publisherFree,b.upper,b.middle,b.lower,b.masterpiece,b.read,b.owned,b.memo,b.remarks])],'書籍読込用','書籍読込用');else out([['タイトル','作者','出版社','巻数','ISBN'],...books.map(b=>[b.title,b.author,b.publisher,b.volume,b.isbn?'ISBN '+String(b.isbn).replace(/[^0-9Xx]/g,''):''])],'コミック読込用','コミック読込用')};render();getTokenizer().then(()=>{$('notice').textContent='準備完了：日本語版検索・読み自動入力が利用できます。'}).catch(()=>{$('notice').className='notice bad';$('notice').textContent='検索は使えますが、読み自動入力ライブラリの読み込みに失敗しました。'});</script></body></html>
