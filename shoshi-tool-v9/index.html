<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>書誌情報作成ツール v9</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--nav:#263746;--line:#d7dee5;--blue:#2f5f8f;--green:#2f6b45;--muted:#6b7783;--red:#922}
*{box-sizing:border-box}body{font-family:system-ui,"Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);margin:0;color:#24303b}header{background:var(--nav);color:#fff;padding:18px}main{max-width:1050px;margin:auto;padding:18px}.card,.book{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.toolbar,.row,.bookhead{display:flex;gap:8px;align-items:center}.toolbar,.bookhead{justify-content:space-between;flex-wrap:wrap}.row input{flex:1}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input[type=text],select,textarea{width:100%;padding:9px;border:1px solid #bcc7d0;border-radius:7px;background:#fff}textarea{min-height:72px;resize:vertical}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.b{background:var(--blue);color:#fff}.g{background:var(--green);color:#fff}.x{background:#f8e7e7;color:var(--red)}.s{background:#e7edf2;color:#263746}.muted{font-size:12px;color:var(--muted)}.notice{background:#edf6ee;border:1px solid #bdd8c3;padding:10px 12px;border-radius:8px;margin-bottom:14px}.notice.bad{background:#fff1f1;border-color:#e6bcbc;color:#8b2525}.results{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}.res{display:flex;gap:10px;padding:10px;border-bottom:1px solid #edf0f2;align-items:flex-start}.res input{margin-top:4px}.candidate-meta{font-size:11px;color:#74808b;margin-top:3px}.book h3{margin:0;font-size:15px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:#53616d}.checks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.checks label{border:1px solid #d5dde4;border-radius:7px;padding:8px;background:#fff}.pill{background:#eef4fa;color:#234a70;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.progress{margin-top:8px;padding:9px 11px;background:#f7f9fb;border-radius:7px;font-size:12px;color:#53616d}.source{font-size:11px;border:1px solid #cfd8df;padding:3px 7px;border-radius:999px;background:#fff}.mode label{margin-right:14px}.credit{font-size:11px;color:#74808b;margin:18px 2px 4px}@media(max-width:800px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column;align-items:stretch}.checks{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><b>書誌情報作成ツール v9</b><div class="muted" style="color:#d8e0e7">作品候補：Open Library ／ 日本語書誌の補完：国立国会図書館サーチ</div></header>
<main>
<div id="notice" class="notice">著者検索で作品を選び、「選択書籍のデータを一括取得」を押すと、国立国会図書館サーチの日本語書誌を優先して補完します。</div>
<section class="card mode"><b>① 出力形式</b>　<label><input type="radio" name="mode" value="book" checked> 書籍版</label><label><input type="radio" name="mode" value="comic"> コミック版</label></section>
<section class="card"><b>② 著者名から著書を検索</b><div class="row" style="margin-top:10px"><input id="author" type="text" placeholder="例：東野圭吾"><button id="find" class="b">著書一覧を表示</button></div><div id="results" class="results"><div class="muted" style="padding:24px;text-align:center">著者名を入力してください</div></div><div class="toolbar" style="margin-top:10px"><span id="resultInfo" class="muted"></span><button id="sel" class="s" disabled>チェックした著書を登録</button></div></section>
<section class="card"><div class="toolbar"><b>③ 選択した書籍 <span id="cnt" class="pill">0冊</span></b><div><button id="batch" class="b">選択書籍のデータを一括取得</button> <button id="clear" class="x">すべて削除</button></div></div><div id="batchProgress" class="progress" style="display:none"></div><div id="detail"></div></section>
<section class="card"><div class="toolbar"><b>④ Excel出力</b><button id="excel" class="g">選択中の形式でExcel作成</button></div><div class="muted">書籍版の「詳細」にはISBNを出力します。読みはNDL書誌を優先し、無い場合のみブラウザ内で自動生成します。</div></section>
<div class="credit">本ツールは国立国会図書館サーチAPIを利用しています。作品候補の検索にはOpen Libraryを利用しています。</div>
</main>
<script>
const $=id=>document.getElementById(id), JP=/[ぁ-んァ-ヶ一-龠々〆ヵヶ]/;
const C=['','ビジネス・経済','科学・テクノロジー','歴史・地理','哲学・思想','社会・文化','政治・法律','芸術・デザイン','スポーツ','趣味・実用','健康・医療','料理・食','暮らし・生活','教育','語学・辞書','旅行・紀行','エッセイ・随筆','ノンフィクション','小説','ミステリー','SF・ファンタジー','ホラー','恋愛','時代・歴史小説','ライトノベル','漫画・コミック','絵本・児童書','詩・短歌・俳句','戯曲','ユーモア・娯楽','その他'];
const P=['','岩波書店','筑摩書房','中央公論新社','新潮社','文藝春秋','講談社','集英社','小学館','角川書店','KADOKAWA','河出書房新社','平凡社','みすず書房','晶文社','作品社','白水社','早川書房','東京創元社','光文社','双葉社','徳間書店','宝島社','扶桑社','PHP研究所','東洋経済新報社','日経BP','日本経済新聞出版','ダイヤモンド社','サンマーク出版','幻冬舎','ポプラ社','福音館書店'];
const PA={'iwanami':'岩波書店','chikuma':'筑摩書房','chuokoron':'中央公論新社','shinchosha':'新潮社','bungeishunju':'文藝春秋','kodansha':'講談社','shueisha':'集英社','shogakukan':'小学館','kadokawa shoten':'角川書店','kadokawa':'KADOKAWA','kawade':'河出書房新社','heibonsha':'平凡社','misuzu':'みすず書房','shobunsha':'晶文社','sakuhinsha':'作品社','hakusuisha':'白水社','hayakawa':'早川書房','tokyo sogensha':'東京創元社','sogensha':'東京創元社','kobunsha':'光文社','futabasha':'双葉社','tokuma':'徳間書店','takarajimasha':'宝島社','fusosha':'扶桑社','php':'PHP研究所','toyokeizai':'東洋経済新報社','nikkei bp':'日経BP','nihon keizai':'日本経済新聞出版','diamond':'ダイヤモンド社','sunmark':'サンマーク出版','gentosha':'幻冬舎','poplar':'ポプラ社','fukuinkan':'福音館書店'};
let B=JSON.parse(localStorage.getItem('bibv9')||'[]'), mode=localStorage.getItem('bibv9mode')||'book', candidates=[], searchedAuthor='';
document.querySelector(`input[name=mode][value=${mode}]`).checked=true;
const tr=s=>(s||'').trim(), nm=s=>tr(s).toLowerCase().replace(/[\s・･:：\-―—_()（）\[\]【】『』「」]/g,''), esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('bibv9',JSON.stringify(B));localStorage.setItem('bibv9mode',mode)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function nextFrame(){return new Promise(r=>requestAnimationFrame(()=>r()))}
function cleanISBN(s){let x=String(s||'').replace(/[^0-9Xx]/g,'');return x}
function part(t){t=String(t||'');return{upper:/上巻|[（(]上[）)]/.test(t)?'○':'',middle:/中巻|[（(]中[）)]/.test(t)?'○':'',lower:/下巻|[（(]下[）)]/.test(t)?'○':''}}
function vol(t){let m=String(t||'').match(/(?:第\s*)?(\d+)\s*巻|vol\.?\s*(\d+)/i);return m?Number(m[1]||m[2]):''}
function kataToHira(s){return String(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function readingClean(s){return kataToHira(String(s||'')).replace(/[\s　,，]+/g,'').trim()}
function cleanJpAuthor(s){s=tr(s);if(!JP.test(s))return'';s=s.replace(/\b\d{4}\s*[-–—]\s*\d{0,4}\b/g,'').replace(/\b\d{4}\b/g,'').replace(/[著訳編監修]/g,'').replace(/[,，、\s　]+/g,'').replace(/[-–—]+$/,'');return s}
function chooseJpAuthor(names,fallback){if(JP.test(fallback||''))return cleanJpAuthor(fallback);for(const n of names||[]){if(JP.test(n||''))return cleanJpAuthor(n)}return tr(fallback)}
function categoryFromText(values,ndc=''){const s=(values||[]).join(' ').toLowerCase();if(/comic|manga|漫画|コミック/.test(s))return'漫画・コミック';if(/mystery|detective|crime|ミステ/.test(s))return'ミステリー';if(/science fiction|fantasy|sf|ファンタジ/.test(s))return'SF・ファンタジー';if(/horror|ホラー/.test(s))return'ホラー';if(/romance|恋愛/.test(s))return'恋愛';if(/historical fiction|時代小説/.test(s))return'時代・歴史小説';if(/philosophy|思想|哲学/.test(s))return'哲学・思想';if(/politic|law|政治|法律/.test(s))return'政治・法律';if(/business|econom|経済|ビジネス/.test(s))return'ビジネス・経済';if(/art|design|芸術|美術/.test(s))return'芸術・デザイン';if(/health|medical|medicine|健康|医療/.test(s))return'健康・医療';if(/cook|food|料理|食/.test(s))return'料理・食';if(/education|教育/.test(s))return'教育';if(/language|dictionary|語学|辞書/.test(s))return'語学・辞書';if(/travel|旅行/.test(s))return'旅行・紀行';if(/essay|随筆|エッセイ/.test(s))return'エッセイ・随筆';if(/nonfiction|biography|ノンフィクション/.test(s))return'ノンフィクション';if(/poetry|詩|俳句|短歌/.test(s))return'詩・短歌・俳句';if(/drama|play|戯曲/.test(s))return'戯曲';if(/children|juvenile|児童|絵本/.test(s))return'絵本・児童書';if(/fiction|literature|novel|小説|文学/.test(s))return'小説';const n=String(ndc||'').match(/([0-9])(?:\.|$)/)?.[1];return({'1':'哲学・思想','2':'歴史・地理','3':'社会・文化','4':'科学・テクノロジー','5':'科学・テクノロジー','6':'ビジネス・経済','7':'芸術・デザイン','8':'語学・辞書','9':'小説'}[n]||'その他')}
function publisherInfo(values){let arr=(Array.isArray(values)?values:[values]).flat().map(tr).filter(Boolean);for(const r of arr){let exact=P.find(x=>x&&nm(x)===nm(r));if(exact)return[exact,'']}for(const r of arr){if(JP.test(r)){let exact=P.find(x=>x&&nm(x)===nm(r));return exact?[exact,'']:['',r]}}for(const r of arr){let l=r.toLowerCase();for(const[a,j]of Object.entries(PA))if(l.includes(a))return[j,'']}return['',arr[0]||'']}
async function fetchJSON(url){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),15000);try{const r=await fetch(url,{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('検索サービス応答 '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function fetchXML(url){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),18000);try{const r=await fetch(url,{cache:'no-store',mode:'cors',signal:ac.signal});if(!r.ok)throw Error('NDL応答 '+r.status);const text=await r.text();const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw Error('NDL XML解析エラー');return doc}finally{clearTimeout(timer)}}
function editionBest(d,fallbackAuthor=''){const ed=d.editions?.docs||[],jeds=ed.filter(z=>(z.language||[]).includes('jpn')),x=jeds.find(z=>JP.test(z.title||''))||jeds[0]||{};const title=JP.test(x.title||'')?x.title:(JP.test(d.title||'')?d.title:x.title||d.title||'');const variants=[...new Set(jeds.map(z=>tr(z.title)).filter(Boolean))].filter(v=>nm(v)!==nm(title)).slice(0,3);const pubs=[...(x.publisher||[]),...(d.publisher||[])];return{workKey:d.key||'',title,variants,author:chooseJpAuthor(d.author_name||[],fallbackAuthor),publishers:pubs,isbn:(x.isbn||d.isbn||[])[0]||'',subject:d.subject||[]}}
async function searchAuthorOL(a){const q=`author:"${a.replaceAll('"','')}" AND language:jpn`,f='key,title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return fetchJSON('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(f)+'&limit=60')}
async function searchTitleOL(t,a){const q=`title:"${t.replaceAll('"','')}" AND language:jpn`+(a?` AND author:"${a.replaceAll('"','')}"`:''),f='key,title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return fetchJSON('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&lang=ja&fields='+encodeURIComponent(f)+'&limit=8')}
function allByLocal(root,name){return [...root.getElementsByTagName('*')].filter(x=>x.localName===name)}
function directByLocal(root,name){return [...root.children].filter(x=>x.localName===name)}
function valueOf(el){if(!el)return'';const v=allByLocal(el,'value')[0];return tr(v?v.textContent:el.textContent)}
function transcriptionOf(el){if(!el)return'';const x=allByLocal(el,'transcription')[0];return tr(x?.textContent||'')}
function parseNdlRecord(bib){const titles=directByLocal(bib,'title');let title='',titleReading='';for(const el of titles){let v=valueOf(el);if(v&&JP.test(v)){title=v;titleReading=transcriptionOf(el);break}if(!title&&v){title=v;titleReading=transcriptionOf(el)}}if(!titleReading){titleReading=tr(directByLocal(bib,'titleTranscription')[0]?.textContent||'')}
 const creators=directByLocal(bib,'creator');let author='',authorReading='';for(const el of creators){let name=tr(allByLocal(el,'name')[0]?.textContent||valueOf(el));if(JP.test(name)){author=cleanJpAuthor(name);authorReading=transcriptionOf(el);break}if(!author&&name){author=name;authorReading=transcriptionOf(el)}}if(!authorReading){authorReading=tr(directByLocal(bib,'creatorTranscription')[0]?.textContent||'')}
 const pubs=directByLocal(bib,'publisher').map(el=>tr(allByLocal(el,'name')[0]?.textContent||valueOf(el))).filter(Boolean);
 const identifiers=allByLocal(bib,'identifier').map(x=>tr(x.textContent));let isbn='';for(const s of identifiers){let m=s.replace(/[^0-9Xx]/g,'').match(/(?:97[89]\d{10}|\d{9}[0-9Xx])/);if(m){isbn=m[0];break}}
 const subjects=[...directByLocal(bib,'subject'),...directByLocal(bib,'genre')].map(valueOf).filter(Boolean);
 let ndc='';for(const el of allByLocal(bib,'subject')){for(const a of [...el.attributes||[]]){let m=String(a.value||'').match(/ndc(?:9|10)?\/([0-9](?:\.[0-9]+)?)/i);if(m){ndc=m[1];break}}if(ndc)break}
 return{title,author,titleReading:readingClean(titleReading),authorReading:readingClean(authorReading),publishers:pubs,isbn,subjects,ndc}}
function scoreNdl(x,b){let s=0;if(nm(x.title)===nm(b.title))s+=100;else if(nm(x.title).includes(nm(b.title))||nm(b.title).includes(nm(x.title)))s+=45;if(x.author&&b.author&&(nm(x.author).includes(nm(b.author))||nm(b.author).includes(nm(x.author))))s+=35;if(x.isbn&&cleanISBN(x.isbn)===cleanISBN(b.isbn))s+=80;if(x.titleReading)s+=8;if(x.authorReading)s+=8;return s}
async function ndlLookup(b){let query;if([10,13].includes(cleanISBN(b.isbn).length))query=`isbn="${cleanISBN(b.isbn)}"`;else{let t=String(b.title||'').replaceAll('"','');let a=String(b.author||'').replaceAll('"','');query=`title="${t}"`+(a?` AND creator="${a}"`:'')}
 const u='https://ndlsearch.ndl.go.jp/api/sru?operation=searchRetrieve&version=1.2&recordSchema=dcndl_v3&recordPacking=xml&onlyBib=true&maximumRecords=5&query='+encodeURIComponent(query);const doc=await fetchXML(u);const bibs=allByLocal(doc,'BibResource');if(!bibs.length)return null;const recs=bibs.map(parseNdlRecord).filter(x=>x.title||x.author);recs.sort((a,z)=>scoreNdl(z,b)-scoreNdl(a,b));return recs[0]||null}
async function olFallback(b){const d=await searchTitleOL(b.title,b.author);if(!d.docs?.length)return null;return editionBest(d.docs[0],b.author)}
function makeBook(x){const pp=publisherInfo(x.publishers),pt=part(x.title);return{id:crypto.randomUUID(),workKey:x.workKey||'',title:x.title,author:JP.test(searchedAuthor)?cleanJpAuthor(searchedAuthor):x.author,titleReading:'',authorReading:'',category:categoryFromText(x.subject),publisher:pp[0],publisherFree:pp[1],isbn:x.isbn||'',upper:pt.upper,middle:pt.middle,lower:pt.lower,masterpiece:'',read:'',owned:'○',memo:'',remarks:'',volume:vol(x.title),status:'登録済み',source:'Open Library'}}
function applyNdl(b,x){if(x.title&&JP.test(x.title))b.title=x.title;if(x.author&&JP.test(x.author))b.author=cleanJpAuthor(x.author);if(x.titleReading)b.titleReading=x.titleReading;if(x.authorReading)b.authorReading=x.authorReading;const pp=publisherInfo(x.publishers);if(pp[0]||pp[1]){b.publisher=pp[0];b.publisherFree=pp[1]}if(x.isbn)b.isbn=x.isbn;const c=categoryFromText(x.subjects,x.ndc);if(c)b.category=c;Object.assign(b,part(b.title));b.volume=vol(b.title);b.status='NDL取得済み';b.source='NDLサーチ'}
function applyOl(b,x){if(!x)return;const pp=publisherInfo(x.publishers);if(!b.publisher&&!b.publisherFree){b.publisher=pp[0];b.publisherFree=pp[1]}if(!b.isbn)b.isbn=x.isbn||'';if(!b.category||b.category==='その他')b.category=categoryFromText(x.subject);if(!JP.test(b.author)&&JP.test(x.author))b.author=cleanJpAuthor(x.author);b.status='予備データ取得';b.source='Open Library'}
let worker=null;try{worker=new Worker('./reading-worker.js');worker.onmessage=e=>{const d=e.data||{},b=B.find(x=>x.id===d.id);if(!b)return;if(!d.error){if(!b.titleReading&&d.titleReading)b.titleReading=d.titleReading;if(!b.authorReading&&d.authorReading)b.authorReading=d.authorReading;save();const card=document.querySelector(`.book[data-id="${CSS.escape(b.id)}"]`);if(card){const t=card.querySelector('[data-f="titleReading"]'),a=card.querySelector('[data-f="authorReading"]');if(t)t.value=b.titleReading||'';if(a)a.value=b.authorReading||''}}}}catch(e){}
function requestReadings(b){if(!worker||(!b.title&&!b.author))return;if(b.titleReading&&b.authorReading)return;worker.postMessage({id:b.id,title:b.title,author:b.author})}
function opt(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function inp(label,b,key,full=''){return`<div class="field ${full}"><label>${label}</label><input type="text" data-f="${key}" value="${esc(b[key]||'')}"></div>`}
function ta(label,b,key){return`<div class="field full"><label>${label}</label><textarea data-f="${key}">${esc(b[key]||'')}</textarea></div>`}
function ck(label,b,key){return`<label><input type="checkbox" data-c="${key}" ${b[key]==='○'?'checked':''}> ${label}</label>`}
function render(){ $('cnt').textContent=B.length+'冊';$('detail').innerHTML=B.length?'':'<div class="muted" style="padding:18px 0">著者検索から本を選んでください。</div>';B.forEach((b,i)=>{let html;if(mode==='book'){html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作家',b,'author','full')}${inp('タイトルよみ（自動）',b,'titleReading')}${inp('作家よみ（自動）',b,'authorReading')}<div class="field"><label>カテゴリ</label><select data-f="category">${opt(C,b.category)}</select></div><div class="field"><label>出版社</label><select data-f="publisher">${opt(P,b.publisher)}</select></div>${inp('出版社自由記載',b,'publisherFree','full')}<div class="field full"><label>上・中・下／管理項目</label><div class="checks">${ck('上巻',b,'upper')}${ck('中巻',b,'middle')}${ck('下巻',b,'lower')}${ck('名作',b,'masterpiece')}${ck('読破',b,'read')}${ck('所有',b,'owned')}</div></div>${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}<div class="field full"><label>詳細（ISBN）</label><input type="text" value="${esc(b.isbn?'ISBN：'+b.isbn:'')}" readonly></div></div>`}else{html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作者',b,'author','full')}${inp('出版社',b,'publisher')}${inp('巻数',b,'volume')}${inp('ISBN',b,'isbn')}${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}</div>`}$('detail').insertAdjacentHTML('beforeend',`<div class="book" data-id="${esc(b.id)}"><div class="bookhead"><h3>${i+1}. ${esc(b.title)}</h3><div><span class="source">${esc(b.source||'')}</span> <button class="s" data-fill="${esc(b.id)}">この本だけ補完</button> <button class="x" data-del="${esc(b.id)}">削除</button></div></div>${html}</div>`)});$('detail').querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{let b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.f]=el.value;save();if(el.dataset.f==='title'||el.dataset.f==='author')requestReadings(b)});$('detail').querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{let b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.c]=el.checked?'○':'';save()});$('detail').querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{B=B.filter(x=>x.id!==el.dataset.del);save();render()});$('detail').querySelectorAll('[data-fill]').forEach(el=>el.onclick=()=>enrichOne(el.dataset.fill,el))}
async function enrichBook(b){let ndlErr='';try{const x=await ndlLookup(b);if(x){applyNdl(b,x);if(!b.titleReading||!b.authorReading)requestReadings(b);return true}}catch(e){ndlErr=e.message||String(e)}try{const x=await olFallback(b);applyOl(b,x)}catch(e){}if(!b.titleReading||!b.authorReading)requestReadings(b);if(ndlErr)b.status='NDL接続不可・予備データ';return false}
async function enrichOne(id,btn){const b=B.find(x=>x.id===id);if(!b)return;btn.disabled=true;btn.textContent='補完中…';try{await enrichBook(b);save();render()}catch(e){alert('補完できませんでした：'+(e.message||e))}finally{if(document.body.contains(btn)){btn.disabled=false;btn.textContent='この本だけ補完'}}}
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{mode=r.value;save();render()});
$('find').onclick=async()=>{const a=tr($('author').value);if(!a)return;searchedAuthor=a;$('find').disabled=true;$('results').innerHTML='<div class="muted" style="padding:24px">検索中…</div>';$('sel').disabled=true;$('notice').className='notice';$('notice').textContent='日本語版の作品候補を検索中…';try{const d=await searchAuthorOL(a),map=new Map;for(const raw of d.docs||[]){const x=editionBest(raw,a);if(!x.title||!JP.test(x.title))continue;const key=x.workKey||nm(x.title);if(!map.has(key))map.set(key,x)}candidates=[...map.values()].sort((a,b)=>a.title.localeCompare(b.title,'ja'));$('results').innerHTML=candidates.length?candidates.map((x,i)=>`<label class="res"><input type="checkbox" class="cand" data-i="${i}"><span><b>${esc(x.title)}</b>${x.variants.length?`<div class="candidate-meta">別表記：${esc(x.variants.join(' ／ '))}</div>`:''}<div class="candidate-meta">${esc(publisherInfo(x.publishers)[0]||publisherInfo(x.publishers)[1]||'出版社不明')}${x.isbn?' ／ ISBN '+esc(x.isbn):''}</div></span></label>`).join(''):'<div class="muted" style="padding:24px">日本語タイトルが見つかりませんでした。</div>';$('results').querySelectorAll('.cand').forEach(c=>c.onchange=()=>$('sel').disabled=![...$('results').querySelectorAll('.cand')].some(x=>x.checked));$('resultInfo').textContent=candidates.length+'作品';$('notice').textContent='作品候補を取得しました。必要な本をチェックしてください。'}catch(e){$('notice').className='notice bad';$('notice').textContent='検索エラー：'+(e.message||e);$('results').innerHTML='<div class="muted" style="padding:24px">'+esc(e.message||e)+'</div>'}finally{$('find').disabled=false}};
$('sel').onclick=()=>{const selected=[...$('results').querySelectorAll('.cand:checked')].map(c=>candidates[+c.dataset.i]);let added=[];for(const x of selected){if(B.some(b=>(b.workKey&&x.workKey&&b.workKey===x.workKey)||nm(b.title)===nm(x.title)))continue;const b=makeBook(x);B.push(b);added.push(b)}save();render();for(const b of added)requestReadings(b);$('sel').disabled=true;$('notice').textContent=added.length+'冊を登録しました。登録処理では追加検索を行っていません。'};
$('batch').onclick=async()=>{if(!B.length)return;$('batch').disabled=true;$('clear').disabled=true;const p=$('batchProgress');p.style.display='block';let ndlCount=0;try{for(let i=0;i<B.length;i++){p.textContent=`${i+1}/${B.length}冊目を取得中：${B[i].title}`;await nextFrame();const ok=await enrichBook(B[i]);if(ok)ndlCount++;save();await sleep(120)}render();p.textContent=`完了：${B.length}冊処理／NDL書誌 ${ndlCount}冊。読みがない項目は裏側で自動生成します。`;$('notice').className='notice';$('notice').textContent='一括取得が完了しました。NDLの日本語書誌を優先して反映しています。'}catch(e){p.textContent='一括取得中にエラー：'+(e.message||e);$('notice').className='notice bad';$('notice').textContent='一括取得でエラーが発生しました。処理済みの本は保存されています。'}finally{$('batch').disabled=false;$('clear').disabled=false}};
$('clear').onclick=()=>{if(B.length&&confirm('選択した書籍をすべて削除しますか？')){B=[];save();render()}};
function out(rows,sheet,name){if(typeof XLSX==='undefined')return alert('Excelライブラリを読み込めません');const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}
$('excel').onclick=()=>{if(mode==='book')out([['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...B.map(b=>[b.title,b.author,b.titleReading,b.authorReading,b.category,b.publisher,b.publisherFree,b.upper,b.middle,b.lower,b.masterpiece,b.read,b.owned,b.memo,b.isbn?'ISBN：'+b.isbn:''])],'書籍読込用','書籍読込用');else out([['タイトル','作者','出版社','巻数','ISBN'],...B.map(b=>[b.title,b.author,b.publisher||b.publisherFree,b.volume,b.isbn?'ISBN '+b.isbn:''])],'コミック読込用','コミック読込用')};
render();for(const b of B)requestReadings(b);
</script>
</body>
</html>
