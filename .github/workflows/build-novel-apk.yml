name: Build Novel Android APK

on:
  push:
    branches: [main]
    paths:
      - "novel-android/**"
      - "novel/**"
      - ".github/workflows/build-novel-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare offline files and icon
        run: |
          mkdir -p novel-android/app/src/main/assets/www
          mkdir -p novel-android/app/src/main/res/drawable-nodpi
          cp novel/index.html novel/xlsx.full.min.js novel-android/app/src/main/assets/www/
          cp novel/icon-512.png novel-android/app/src/main/res/drawable-nodpi/app_icon.png

      - name: Build APK
        run: gradle -p novel-android :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maachan-novel-apk
          path: novel-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish downloadable APK
        run: |
          cp novel-android/app/build/outputs/apk/debug/app-debug.apk maachan-novel.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maachan-novel.apk
          git commit -m "Update novel Android APK" || exit 0
          git push
