let B=JSON.parse(localStorage.getItem('bibv13')||localStorage.getItem('bibv12')||'[]'),mode=localStorage.getItem('bibv13mode')||localStorage.getItem('bibv12mode')||'book',candidates=[],searchedAuthor='',searchedTitle='',aliasTitles=[];

function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/(?:第\s*)?\d+\s*巻/g,'').replace(/vol\.?\s*\d+/ig,'').replace(/[\s　・･:：\-―—_()（）\[\]【】『』「」<>《》!！?？。、,，.]/g,'')}

function categoryFromNdc(ndc){const n=String(ndc||'').trim()[0];return({'1':'哲学・思想','2':'歴史・地理','3':'社会・文化','4':'科学・テクノロジー','5':'科学・テクノロジー','6':'ビジネス・経済','7':'芸術・デザイン','8':'語学・辞書','9':'小説'}[n]||'')}

async function fetchJSON(url,ms=15000){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('通信エラー '+r.status);return await r.json()}finally{clearTimeout(timer)}}

async function wikiResolve(t){if(!t)return[];const urls=[`https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&titles=${encodeURIComponent(t)}`,`https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srlimit=4&srnamespace=0&srsearch=${encodeURIComponent(t)}`];const rs=await Promise.allSettled(urls.map(u=>fetchJSON(u,9000))),out=[t];if(rs[0].status==='fulfilled'){const q=rs[0].value.query||{};for(const r of q.redirects||[])if(r.to)out.push(r.to);for(const p of Object.values(q.pages||{}))if(p.title)out.push(p.title)}if(rs[1].status==='fulfilled')for(const x of rs[1].value.query?.search||[])if(x.title)out.push(x.title);return [...new Set(out.map(tr).filter(Boolean))].slice(0,5)}

function googleCandidates(d){return (d.items||[]).map((it,i)=>{const v=it.volumeInfo||{},ids=v.industryIdentifiers||[],isbn=(ids.find(x=>x.type==='ISBN_13')||ids.find(x=>x.type==='ISBN_10')||{}).identifier||'';return{key:'g:'+it.id,title:tr(v.title||''),author:(v.authors||[]).find(x=>JP.test(x))||v.authors?.[0]||'',publisher:tr(v.publisher||''),isbn:cleanISBN(isbn),subject:v.categories||[],source:'Google Books',sourceRank:i}}).filter(x=>x.title)}
const OL_FIELDS='key,title,author_name,publisher,isbn,subject,edition_count,editions,editions.title,editions.language,editions.publisher,editions.isbn';
async function olExact(a,t,limit=80){let q=[];if(a)q.push(`author:\"${a.replaceAll('"','')}\"`);if(t)q.push(`title:\"${t.replaceAll('"','')}\"`);q.push('language:jpn');return fetchJSON('https://openlibrary.org/search.json?q='+encodeURIComponent(q.join(' AND '))+'&lang=ja&fields='+encodeURIComponent(OL_FIELDS)+'&limit='+limit)}

function localEls(root,name){return [...root.getElementsByTagName('*')].filter(x=>x.localName===name)}
function parseNdl(doc){const out=[];for(const item of [...doc.getElementsByTagName('item')]){const raw=tr(item.getElementsByTagName('title')[0]?.textContent||''),desc=tr(item.getElementsByTagName('description')[0]?.textContent||'');let title=raw,author='';const slash=raw.lastIndexOf(' / ');if(slash>0){title=tr(raw.slice(0,slash));author=tr(raw.slice(slash+3).replace(/ほか$/,''))}const creators=localEls(item,'creator').map(x=>tr(x.textContent)).filter(Boolean);if(creators.find(x=>JP.test(x)))author=creators.find(x=>JP.test(x));const pubs=localEls(item,'publisher').map(x=>tr(x.textContent)).filter(Boolean);const ids=localEls(item,'identifier').map(x=>tr(x.textContent)).concat([desc]);let isbn='';for(const s of ids){const m=String(s).replace(/[^0-9Xx]/g,'').match(/(?:97[89]\d{10}|\d{9}[0-9Xx])/);if(m){isbn=m[0];break}}const categories=[...item.getElementsByTagName('category')].map(x=>tr(x.textContent));if(!title||!JP.test(title))continue;out.push({key:'ndl:'+norm(title)+'|'+norm(author)+'|'+isbn,title,author,publisher:pubs[0]||'',isbn,subject:categories,source:'NDLサーチ',sourceRank:out.length})}return out}
async function ndlSearch(a,t,cnt=60){const terms=[looseWords(t),looseWords(a)].filter(Boolean).join(' ');if(!terms)return[];return parseNdl(await fetchXML('https://ndlsearch.ndl.go.jp/api/opensearch?cnt='+cnt+'&any='+encodeURIComponent(terms),12000))}
function comicScore(x){let s=0,xt=norm(x.title),xs=seriesNorm(x.title),qa=norm(searchedAuthor),xa=norm(x.author),queries=(aliasTitles.length?aliasTitles:[searchedTitle]).map(norm).filter(Boolean),seriesQueries=(aliasTitles.length?aliasTitles:[searchedTitle]).map(seriesNorm).filter(Boolean);if(queries.length){let best=0;for(const q of queries){if(xt===q)best=Math.max(best,520);else if(xt.startsWith(q)||q.startsWith(xt))best=Math.max(best,330);else if(xt.includes(q)||q.includes(xt))best=Math.max(best,220)}for(const q of seriesQueries){if(xs===q)best=Math.max(best,470);else if(xs.startsWith(q)||q.startsWith(xs))best=Math.max(best,300)}s+=best}if(qa){if(xa===qa)s+=220;else if(xa.includes(qa)||qa.includes(xa))s+=120}if(x.source==='Google Books')s+=130-Math.min(100,(x.sourceRank||0)*3);else if(x.source==='NDLサーチ')s+=85-Math.min(50,(x.sourceRank||0));else s+=Math.min(60,Math.log2((x.editionCount||0)+1)*12);if(x.isbn)s+=45;if(JP.test(x.title))s+=35;const sub=(x.subject||[]).join(' ').toLowerCase();if(/comic|manga|漫画|コミック|graphic novel/.test(sub))s+=110;const qraw=searchedTitle||'';const derivative=/公式ガイド|ガイドブック|ファンブック|アンソロジ|ノベライズ|小説版|小説|画集|設定資料|キャラクターブック|読本|考察|研究|謎解き/;const edition=/完全版|新装版|文庫版|愛蔵版|廉価版|総集編/;if(derivative.test(x.title)&&!derivative.test(qraw))s-=240;if(edition.test(x.title)&&!edition.test(qraw))s-=100;if(/\d+\s*$/.test(String(x.title).normalize('NFKC'))||/[（(]\s*\d+\s*[）)]\s*$/.test(x.title))s-=25;return s}
function bookScore(x){let s=0,qt=norm(searchedTitle),qa=norm(searchedAuthor),xt=norm(x.title),xa=norm(x.author);if(qt){if(xt===qt)s+=140;else if(xt.includes(qt)||qt.includes(xt))s+=80;else s+=looseWords(searchedTitle).split(' ').map(norm).filter(Boolean).filter(c=>xt.includes(c)).length*18}if(qa){if(xa===qa)s+=80;else if(xa.includes(qa)||qa.includes(xa))s+=45}if(x.source==='Google Books')s+=35-Math.min(25,(x.sourceRank||0));if(x.source==='NDLサーチ')s+=18;if(x.isbn)s+=8;s+=Math.min(20,Math.log2((x.editionCount||0)+1)*4);return s}
function mergeBook(list){const map=new Map;for(const x of list){if(!x||!x.title||!JP.test(x.title))continue;const isbn=cleanISBN(x.isbn),k=isbn?'isbn:'+isbn:'t:'+norm(x.title)+'|a:'+norm(x.author);if(!map.has(k))map.set(k,x);else{const y=map.get(k);if((x.source==='NDLサーチ'&&y.source==='Open Library')||(x.source==='Google Books'&&y.source==='Open Library'))map.set(k,{...y,...x,subject:y.subject?.length?y.subject:x.subject})}}return [...map.values()].map(x=>({...x,score:bookScore(x)})).sort((a,b)=>b.score-a.score).slice(0,180)}
function mergeComic(list){const isbnMap=new Map;for(const x of list){if(!x||!x.title||!JP.test(x.title))continue;const k=cleanISBN(x.isbn)?'isbn:'+cleanISBN(x.isbn):'raw:'+norm(x.title)+'|'+norm(x.author);if(!isbnMap.has(k)||comicScore(x)>comicScore(isbnMap.get(k)))isbnMap.set(k,x)}const sorted=[...isbnMap.values()].map(x=>({...x,score:comicScore(x)})).sort((a,b)=>b.score-a.score);const series=new Map;for(const x of sorted){const k='s:'+seriesNorm(x.title)+'|'+seriesNorm(x.author);if(!series.has(k))series.set(k,x)}return [...series.values()].sort((a,b)=>b.score-a.score).slice(0,30)}
async function searchBook(){const jobs=[googleSearch(searchedAuthor,searchedTitle,0,false),googleSearch(searchedAuthor,searchedTitle,0,true),olExact(searchedAuthor,searchedTitle,100),olLoose(searchedAuthor,searchedTitle,100),ndlSearch(searchedAuthor,searchedTitle,80)];if(searchedAuthor&&!searchedTitle)jobs.push(googleSearch(searchedAuthor,'',40,false));const rs=await Promise.allSettled(jobs),all=[];for(let i=0;i<rs.length;i++){if(rs[i].status!=='fulfilled')continue;const v=rs[i].value;if(v?.items)all.push(...googleCandidates(v));else if(v?.docs)all.push(...v.docs.map(bestOl));else if(Array.isArray(v))all.push(...v)}return mergeBook(all)}
async function searchComic(){aliasTitles=searchedTitle?await wikiResolve(searchedTitle):[];const primary=aliasTitles[1]||aliasTitles[0]||searchedTitle,jobs=[];if(primary)jobs.push(googleSearch(searchedAuthor,primary,0,false));if(searchedTitle&&norm(searchedTitle)!==norm(primary))jobs.push(googleSearch(searchedAuthor,searchedTitle,0,false));if(primary)jobs.push(ndlSearch(searchedAuthor,primary,50));if(searchedTitle&&norm(searchedTitle)!==norm(primary))jobs.push(ndlSearch(searchedAuthor,searchedTitle,40));jobs.push(olExact(searchedAuthor,primary||searchedTitle,60));const rs=await Promise.allSettled(jobs),all=[];for(const r of rs){if(r.status!=='fulfilled')continue;const v=r.value;if(v?.items)all.push(...googleCandidates(v));else if(v?.docs)all.push(...v.docs.map(bestOl));else if(Array.isArray(v))all.push(...v)}return mergeComic(all)}
function makeBook(x){const pp=publisherInfo(x.publisher),pt=part(x.title);return{id:crypto.randomUUID(),workKey:x.key||'',title:x.title,author:JP.test(x.author)?x.author:(JP.test(searchedAuthor)?searchedAuthor:x.author),titleReading:'',authorReading:'',category:categoryFromSubject(x.subject),publisher:pp[0],publisherFree:pp[1],isbn:cleanISBN(x.isbn),upper:pt.upper,middle:pt.middle,lower:pt.lower,masterpiece:'',read:'',owned:'',memo:'',remarks:'',volume:vol(x.title),status:'登録済み',source:x.source||'候補'}}
function arr(x){return Array.isArray(x)?x:(x?[x]:[])}function textVal(x){if(x==null)return'';if(typeof x==='string')return x;if(typeof x==='object')return x.content||x.Content||'';return String(x)}
function openbdTitle(rec){const te=rec?.onix?.DescriptiveDetail?.TitleDetail?.TitleElement,first=Array.isArray(te)?te[0]:te,tt=first?.TitleText;return{title:tr(textVal(tt)||rec?.summary?.title||''),reading:kataToHira(tt?.collationkey||'')}}
function openbdAuthors(rec){const cs=arr(rec?.onix?.DescriptiveDetail?.Contributor),authors=[];for(const c of cs){const pn=c?.PersonName,name=tr(textVal(pn));if(!name||!JP.test(name))continue;const roles=arr(c?.ContributorRole),isAuthor=roles.includes('A01');authors.push({name:name.replace(/[\s　]+/g,''),reading:kataToHira(pn?.collationkey||''),isAuthor})}const chosen=authors.filter(x=>x.isAuthor).length?authors.filter(x=>x.isAuthor):authors.slice(0,1);return{name:chosen.map(x=>x.name).join('、'),reading:chosen.map(x=>x.reading).filter(Boolean).join('、')}}
function openbdPublisher(rec){return tr(rec?.onix?.PublishingDetail?.Imprint?.ImprintName||rec?.onix?.PublishingDetail?.Publisher?.PublisherName||rec?.summary?.publisher||rec?.hanmoto?.hanmotoinfo?.name||'')}
function applyOpenBD(b,rec){const t=openbdTitle(rec),a=openbdAuthors(rec),pub=openbdPublisher(rec),pp=publisherInfo(pub),ndc=rec?.hanmoto?.ndccode||'';if(t.title)b.title=t.title;if(t.reading)b.titleReading=t.reading;if(a.name)b.author=a.name;if(a.reading)b.authorReading=a.reading;if(pub){b.publisher=pp[0];b.publisherFree=pp[1]}b.isbn=cleanISBN(rec?.summary?.isbn||rec?.onix?.RecordReference||b.isbn);const c=categoryFromNdc(ndc);if(c)b.category=c;if(mode==='comic')b.category='漫画・コミック';if(rec?.summary?.volume)b.volume=rec.summary.volume;Object.assign(b,part(b.title));b.status='openBD取得済み';b.source='openBD'}
let worker=null;try{worker=new Worker('./reading-worker.js');worker.onmessage=e=>{const d=e.data||{},b=B.find(x=>x.id===d.id);if(!b||d.error)return;if(!b.titleReading)b.titleReading=d.titleReading||'';if(!b.authorReading)b.authorReading=d.authorReading||'';save();const card=document.querySelector(`.book[data-id="${CSS.escape(b.id)}"]`);if(card){const t=card.querySelector('[data-f="titleReading"]'),a=card.querySelector('[data-f="authorReading"]');if(t)t.value=b.titleReading;if(a)a.value=b.authorReading}}}catch(e){}function requestReading(b){if(worker&&(!b.titleReading||!b.authorReading))worker.postMessage({id:b.id,title:b.title,author:b.author})}
function opt(a,v){return a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function inp(l,b,k,full=''){return`<div class="field ${full}"><label>${l}</label><input type="text" data-f="${k}" value="${esc(b[k]||'')}"></div>`}function ta(l,b,k){return`<div class="field full"><label>${l}</label><textarea data-f="${k}">${esc(b[k]||'')}</textarea></div>`}function ck(l,b,k){return`<label><input type="checkbox" data-c="${k}" ${b[k]==='○'?'checked':''}> ${l}</label>`}
function render(){ $('cnt').textContent=B.length+'冊';$('detail').innerHTML=B.length?'':'<div class="muted" style="padding:18px 0">検索結果から本を選んでください。</div>';B.forEach((b,i)=>{let html;if(mode==='book'){html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作家',b,'author','full')}${inp('タイトルよみ（自動）',b,'titleReading')}${inp('作家よみ（自動）',b,'authorReading')}<div class="field"><label>カテゴリ</label><select data-f="category">${opt(C,b.category)}</select></div><div class="field"><label>出版社</label><select data-f="publisher">${opt(P,b.publisher)}</select></div>${inp('出版社自由記載',b,'publisherFree','full')}<div class="field full"><label>上・中・下／管理項目</label><div class="checks">${ck('上巻',b,'upper')}${ck('中巻',b,'middle')}${ck('下巻',b,'lower')}${ck('名作',b,'masterpiece')}${ck('読破',b,'read')}${ck('所有',b,'owned')}</div></div>${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}<div class="field full"><label>詳細（ISBN）</label><input type="text" value="${esc(b.isbn?'ISBN：'+b.isbn:'')}" readonly></div></div>`}else{html=`<div class="fields">${inp('タイトル',b,'title','full')}${inp('作者',b,'author','full')}${inp('出版社',b,'publisher')}${inp('巻数',b,'volume')}${inp('ISBN',b,'isbn')}${ta('メモ',b,'memo')}${ta('備考',b,'remarks')}</div>`}$('detail').insertAdjacentHTML('beforeend',`<div class="book" data-id="${b.id}"><div class="bookhead"><div><b>${i+1}. ${esc(b.title)}</b> <span class="source">${esc(b.source||'')}</span></div><button class="x" data-del="${b.id}">削除</button></div>${html}</div>`)});$('detail').querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{const b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.f]=el.value;save()});$('detail').querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{const b=B.find(x=>x.id===el.closest('.book').dataset.id);b[el.dataset.c]=el.checked?'○':'';save()});$('detail').querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{B=B.filter(x=>x.id!==el.dataset.del);save();render()})}
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{mode=r.value;aliasTitles=[];save();updateHint();render()});
$('find').onclick=async()=>{searchedAuthor=tr($('author').value);searchedTitle=tr($('workTitle').value);if(!searchedAuthor&&!searchedTitle){$('notice').className='notice bad';$('notice').textContent='著者名または著作名を入力してください。';return}$('results').innerHTML='<div class="muted" style="padding:24px">'+(mode==='comic'?'通称解決と精度優先検索':'複数サイトから広く検索')+'中…</div>';$('sel').disabled=true;$('find').disabled=true;try{candidates=mode==='comic'?await searchComic():await searchBook();$('results').innerHTML=candidates.length?candidates.map((x,i)=>`<label class="res"><input type="checkbox" class="cand" data-i="${i}"><span><b>${esc(x.title)}</b><span class="rank">${mode==='comic'?'精度 '+Math.round(x.score||0):'候補'}</span><div class="meta">${esc(x.author||'著者不明')}${x.publisher?' ／ '+esc(x.publisher):''}${x.isbn?' ／ ISBN '+esc(x.isbn):''} ／ ${esc(x.source)}</div></span></label>`).join(''):'<div class="muted" style="padding:24px">候補が見つかりませんでした。</div>';$('results').querySelectorAll('.cand').forEach(c=>c.onchange=()=>$('sel').disabled=![...$('results').querySelectorAll('.cand')].some(x=>x.checked));$('resultInfo').textContent=candidates.length+'件'+(mode==='comic'&&aliasTitles.length>1?' ／ 通称候補：'+aliasTitles.slice(0,3).join(' → '):'');$('notice').className='notice';$('notice').textContent=mode==='comic'?'本編・正式タイトルに近い候補を優先して並べました。':'件数を優先して候補を広く集めました。';}catch(e){$('notice').className='notice bad';$('notice').textContent='検索エラー：'+e.message}finally{$('find').disabled=false}};
$('searchClear').onclick=()=>{$('author').value='';$('workTitle').value='';searchedAuthor='';searchedTitle='';aliasTitles=[];candidates=[];$('results').innerHTML='<div class="muted" style="padding:24px;text-align:center">著者名または著作名を入力してください</div>';$('resultInfo').textContent='';$('sel').disabled=true;$('notice').className='notice';$('notice').textContent='検索条件をクリアしました。'};
$('sel').onclick=()=>{const selected=[...$('results').querySelectorAll('.cand:checked')].map(c=>candidates[+c.dataset.i]);let n=0;for(const x of selected){if(B.some(b=>(cleanISBN(b.isbn)&&cleanISBN(b.isbn)===cleanISBN(x.isbn))||norm(b.title)===norm(x.title)&&norm(b.author)===norm(x.author)))continue;const b=makeBook(x);B.push(b);requestReading(b);n++}save();render();$('sel').disabled=true;$('notice').className='notice';$('notice').textContent=n+'冊を登録しました。'};
$('batch').onclick=async()=>{if(!B.length)return;const btn=$('batch'),p=$('batchProgress');btn.disabled=true;p.style.display='block';const targets=B.filter(b=>[10,13].includes(cleanISBN(b.isbn).length));if(!targets.length){p.textContent='ISBNがある本がありません。Google BooksまたはNDL由来のISBN付き候補を選んでください。';btn.disabled=false;return}try{p.textContent='openBDへ問い合わせ中…';const isbns=[...new Set(targets.map(b=>cleanISBN(b.isbn)))],data=await fetchJSON('https://api.openbd.jp/v1/get?isbn='+encodeURIComponent(isbns.join(','))),map=new Map;for(const rec of data||[]){if(!rec)continue;const id=cleanISBN(rec?.summary?.isbn||rec?.onix?.RecordReference||'');if(id)map.set(id,rec)}let ok=0;for(let i=0;i<targets.length;i++){const b=targets[i];p.textContent=`${i+1}/${targets.length}冊目を反映中：${b.title}`;const rec=map.get(cleanISBN(b.isbn));if(rec){applyOpenBD(b,rec);ok++}requestReading(b);save();render();await new Promise(r=>setTimeout(r,20))}p.textContent=`完了：${ok}/${targets.length}冊をopenBDから取得しました。`}catch(e){p.textContent='openBD取得エラー：'+e.message}finally{btn.disabled=false}};
$('clear').onclick=()=>{if(B.length&&confirm('選択した書籍をすべて削除しますか？')){B=[];save();render()}};
function out(rows,sheet,name){if(typeof XLSX==='undefined')return alert('Excelライブラリを読み込めません');const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}
$('excel').onclick=()=>{if(mode==='book')out([['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...B.map(b=>[b.title,b.author,b.titleReading,b.authorReading,b.category,b.publisher,b.publisherFree,b.upper,b.middle,b.lower,b.masterpiece,b.read,b.owned,b.memo,b.isbn?'ISBN：'+b.isbn:''])],'書籍読込用','書籍読込用');else out([['タイトル','作者','出版社','巻数','ISBN'],...B.map(b=>[b.title,b.author,b.publisher||b.publisherFree,b.volume,b.isbn?'ISBN '+b.isbn:''])],'コミック読込用','コミック読込用')};
updateHint();render();for(const b of B)requestReading(b);
</script></body></html>
