<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書誌情報作成ツール v3</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>:root{--bg:#f4f6f8;--nav:#263746;--line:#d7dee5;--blue:#2f5f8f;--green:#2f6b45;--text:#1f2933;--muted:#687582}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,"Yu Gothic UI",Meiryo,sans-serif;color:var(--text)}header{background:var(--nav);color:#fff;padding:18px}main{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}h2{font-size:17px;margin:0 0 10px}.muted{font-size:12px;color:var(--muted)}input,select,textarea,button{font:inherit}input[type=text],select,textarea{width:100%;padding:8px;border:1px solid #bbc6d0;border-radius:7px;background:#fff}textarea{min-height:58px;resize:vertical}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e7edf2}.danger{background:#f8e7e7;color:#922}.green{background:var(--green);color:#fff}.mode{display:flex;gap:8px}.mode label{flex:1;border:1px solid #b9c5cf;border-radius:8px;padding:12px;text-align:center;cursor:pointer;font-weight:700}.mode input{margin-right:6px}.notice{padding:10px 12px;border-radius:8px;background:#edf6ee;border:1px solid #bdd8c3;font-size:13px;margin-bottom:14px}.notice.bad{background:#fff1f1;border-color:#e6bcbc;color:#8b2525}.row{display:flex;gap:8px;align-items:end}.row>div{flex:1}.results{margin-top:10px;border:1px solid var(--line);border-radius:8px;max-height:360px;overflow:auto}.result{display:flex;gap:9px;padding:9px;border-bottom:1px solid #edf0f2}.result b{font-size:14px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px;border-bottom:1px solid #e8edf0;text-align:left;vertical-align:top}th{background:#f1f4f6;white-space:nowrap}.edit input,.edit select,.edit textarea{min-width:110px;padding:5px;font-size:12px}.edit .wide{min-width:190px}.edit .memo{min-width:170px}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.pill{background:#eef4fa;color:#234a70;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.mode{flex-direction:column}}</style></head><body><header><b>書誌情報作成ツール v3</b><div style="font-size:12px;color:#d8e0e7">日本語版のみ検索・書籍版／コミック版を切替</div></header><main><div id="notice" class="notice">検索元：Open Library。日本語版（language:jpn）のみを対象にします。</div><section class="card"><h2>① 出力形式を選択</h2><div class="mode"><label><input type="radio" name="mode" value="book" checked>書籍版</label><label><input type="radio" name="mode" value="comic">コミック版</label></div><div class="muted" style="margin-top:8px">書籍版は15列、コミック版は5列の既存取込形式に合わせます。メモ・備考は画面上で自由入力できます。書籍版では備考を「詳細」列へ出力します。</div></section><div class="grid"><section class="card"><h2>② 著書名から追加</h2><input id="title" type="text" placeholder="著書名"><div style="height:7px"></div><input id="author2" type="text" placeholder="著者名（任意）"><div style="height:9px"></div><button id="add" class="primary">検索リストへ追加</button></section><section class="card"><h2>③ 著者名から著書を選ぶ</h2><div class="row"><div><input id="author" type="text" placeholder="例：夏目漱石"></div><button id="find" class="primary">著書を検索</button></div><div id="results" class="results"><div class="muted" style="padding:20px;text-align:center">著者名を入力してください</div></div><div style="margin-top:9px"><button id="sel" class="secondary" disabled>選択した著書を追加</button></div></section></div><section class="card"><div class="toolbar"><h2>④ 検索リスト <span id="cnt" class="pill">0冊</span></h2><div><button id="clear" class="danger">すべて削除</button> <button id="lookup" class="primary">ネットで一括書誌検索</button></div></div><div class="tablewrap"><table><thead><tr><th>著書名</th><th>著者</th><th>状態</th><th></th></tr></thead><tbody id="list"></tbody></table></div><div id="prog" class="muted" style="margin-top:8px"></div></section><section class="card"><div class="toolbar"><h2>⑤ 書誌情報の確認・修正</h2><span id="modeName" class="pill">書籍版</span></div><div id="detailWrap" class="tablewrap"></div><div class="actions"><button id="excel" class="green">選択中の形式でExcel作成</button></div></section></main><script>const $=id=>document.getElementById(id);const jp=/[ぁ-んァ-ヶ一-龠々〆ヵヶ]/;let books=JSON.parse(localStorage.getItem('bibtool_v3')||'[]');let mode=localStorage.getItem('bibtool_mode')||'book';document.querySelector(`input[name=mode][value=${mode}]`).checked=true;const trim=s=>(s||'').trim(),norm=s=>trim(s).toLowerCase().replace(/[\s・･:：\-―—_()（）\[\]【】]/g,''),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('bibtool_v3',JSON.stringify(books));localStorage.setItem('bibtool_mode',mode)}function volume(t){let m=String(t||'').match(/(?:第\s*)?(\d+)\s*巻|(?:vol\.?\s*)(\d+)/i);return m?Number(m[1]||m[2]):''}function category(s){s=(s||[]).join(' ');if(/comic|manga|漫画|コミック/i.test(s))return'コミック';if(/mystery|detective|ミステ/i.test(s))return'ミステリー';if(/history|歴史/i.test(s))return'歴史';if(/literature|fiction|文学|小説/i.test(s))return'文学';return''}async function api(url){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),15000);try{const r=await fetch(url,{mode:'cors',cache:'no-store',headers:{Accept:'application/json'},signal:ac.signal});if(!r.ok)throw Error('検索サービス応答 '+r.status);return await r.json()}catch(e){if(e.name==='AbortError')throw Error('検索がタイムアウトしました');throw e}finally{clearTimeout(timer)}}function best(d){const eds=d.editions?.docs||[];const e=eds.find(x=>(x.language||[]).includes('jpn')&&jp.test(x.title||''))||eds.find(x=>(x.language||[]).includes('jpn'))||{};return{title:jp.test(e.title||'')?e.title:(jp.test(d.title||'')?d.title:(e.title||d.title||'')),author:(d.author_name||[]).join('、'),publisher:(e.publisher||d.publisher||[])[0]||'',isbn:(e.isbn||d.isbn||[])[0]||'',subject:d.subject||[]}}async function byAuthor(a){const query=`author:"${a.replaceAll('"','')}" AND language:jpn`;const fields='title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&lang=ja&fields='+encodeURIComponent(fields)+'&limit=50')}async function byTitle(t,a){let query=`title:"${t.replaceAll('"','')}" AND language:jpn`;if(a)query+=` AND author:"${a.replaceAll('"','')}"`;const fields='title,author_name,publisher,isbn,subject,editions,editions.title,editions.language,editions.publisher,editions.isbn';return api('https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&lang=ja&fields='+encodeURIComponent(fields)+'&limit=10')}function newBook(t,a){return{id:crypto.randomUUID(),title:trim(t),author:trim(a),publisher:'',publisherFree:'',isbn:'',volume:volume(t),titleReading:'',authorReading:'',category:'',upper:'',middle:'',lower:'',masterpiece:'',read:'',owned:'○',memo:'',remarks:'',status:'検索待ち'}}function addBook(t,a){if(!trim(t))return false;if(books.some(b=>norm(b.title)===norm(t)&&norm(b.author)===norm(a))){alert('同じ本があります');return false}books.push(newBook(t,a));save();render();return true}function render(){const l=$('list');l.innerHTML=books.length?'':'<tr><td colspan="4" class="muted">まだありません</td></tr>';books.forEach(b=>l.insertAdjacentHTML('beforeend',`<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${b.status}</td><td><button class="danger" data-del="${b.id}">削除</button></td></tr>`));l.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{books=books.filter(b=>b.id!==x.dataset.del);save();render()});$('cnt').textContent=books.length+'冊';$('modeName').textContent=mode==='book'?'書籍版':'コミック版';renderDetail()}function input(b,f,cls=''){return`<input class="${cls}" data-f="${f}" value="${esc(b[f]||'')}">`}function yn(b,f){return`<select data-f="${f}"><option value=""></option><option value="○" ${b[f]==='○'?'selected':''}>○</option></select>`}function renderDetail(){let html;if(mode==='book'){html='<table class="edit"><thead><tr><th>タイトル</th><th>作家</th><th>タイトルよみ</th><th>作家よみ</th><th>カテゴリ</th><th>出版社</th><th>出版社自由記載</th><th>上巻</th><th>中巻</th><th>下巻</th><th>名作</th><th>読破</th><th>所有</th><th>メモ</th><th>備考</th></tr></thead><tbody>'+books.map(b=>`<tr data-id="${b.id}"><td>${input(b,'title','wide')}</td><td>${input(b,'author','wide')}</td><td>${input(b,'titleReading')}</td><td>${input(b,'authorReading')}</td><td>${input(b,'category')}</td><td>${input(b,'publisher')}</td><td>${input(b,'publisherFree')}</td><td>${yn(b,'upper')}</td><td>${yn(b,'middle')}</td><td>${yn(b,'lower')}</td><td>${yn(b,'masterpiece')}</td><td>${yn(b,'read')}</td><td>${yn(b,'owned')}</td><td><textarea class="memo" data-f="memo">${esc(b.memo)}</textarea></td><td><textarea class="memo" data-f="remarks">${esc(b.remarks)}</textarea></td></tr>`).join('')+'</tbody></table>'}else{html='<table class="edit"><thead><tr><th>タイトル</th><th>作者</th><th>出版社</th><th>巻数</th><th>ISBN</th><th>メモ</th><th>備考</th></tr></thead><tbody>'+books.map(b=>`<tr data-id="${b.id}"><td>${input(b,'title','wide')}</td><td>${input(b,'author','wide')}</td><td>${input(b,'publisher')}</td><td>${input(b,'volume')}</td><td>${input(b,'isbn')}</td><td><textarea class="memo" data-f="memo">${esc(b.memo)}</textarea></td><td><textarea class="memo" data-f="remarks">${esc(b.remarks)}</textarea></td></tr>`).join('')+'</tbody></table>'}$('detailWrap').innerHTML=html;$('detailWrap').querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{const b=books.find(x=>x.id===el.closest('tr').dataset.id);b[el.dataset.f]=el.value;save()})}document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{mode=r.value;save();render()});$('add').onclick=()=>{if(addBook($('title').value,$('author2').value)){$('title').value='';$('author2').value=''}};$('find').onclick=async()=>{const a=trim($('author').value);if(!a)return;$('results').innerHTML='<div class="muted" style="padding:20px">検索中...</div>';$('sel').disabled=true;$('notice').className='notice';$('notice').textContent='日本語版を検索中…';try{const data=await byAuthor(a),map=new Map;for(const d of data.docs||[]){const x=best(d);if(!x.title||!jp.test(x.title)||map.has(norm(x.title)))continue;map.set(norm(x.title),x)}const w=[...map.values()];$('results')._works=w;$('results').innerHTML=w.length?w.map((x,i)=>`<label class="result"><input type="checkbox" class="ck" data-i="${i}"><span><b>${esc(x.title)}</b><div class="muted">${esc(x.author)}${x.publisher?' ／ '+esc(x.publisher):''}${x.isbn?' ／ ISBN '+esc(x.isbn):''}</div></span></label>`).join(''):'<div class="muted" style="padding:20px">日本語版の候補が見つかりませんでした。</div>';$('results').querySelectorAll('.ck').forEach(c=>c.onchange=()=>$('sel').disabled=![...$('results').querySelectorAll('.ck')].some(x=>x.checked));$('notice').textContent='検索成功：日本語版 '+w.length+'件を取得しました。'}catch(e){$('notice').className='notice bad';$('notice').textContent='検索エラー：'+(e.message||e);$('results').innerHTML='<div class="muted" style="padding:20px">'+esc(e.message||e)+'</div>'}};$('sel').onclick=()=>{for(const c of $('results').querySelectorAll('.ck:checked')){const x=$('results')._works[+c.dataset.i];if(addBook(x.title,x.author)){const b=books.at(-1);b.publisher=x.publisher;b.isbn=x.isbn;b.category=category(x.subject);b.status='取得済み'}}save();render();$('sel').disabled=true};$('clear').onclick=()=>{if(confirm('すべて削除しますか？')){books=[];save();render()}};$('lookup').onclick=async()=>{for(let i=0;i<books.length;i++){const b=books[i];$('prog').textContent=`${i+1}/${books.length} ${b.title} を検索中`;try{const data=await byTitle(b.title,b.author),d=(data.docs||[])[0];if(d){const x=best(d);b.title=x.title||b.title;b.author=x.author||b.author;b.publisher=x.publisher||b.publisher;b.isbn=x.isbn||b.isbn;b.volume=volume(b.title)||b.volume;b.category=category(x.subject)||b.category;b.status='取得済み'}else b.status='要確認'}catch{b.status='要確認'}save();render()}$('prog').textContent='完了しました'};function exportXlsx(){if(typeof XLSX==='undefined')return alert('Excel出力ライブラリを読み込めません');let rows,name,sheet;if(mode==='book'){rows=[['タイトル','作家','タイトルよみ','作家よみ','カテゴリ','出版社','出版社自由記載','上巻','中巻','下巻','名作','読破','所有','メモ','詳細'],...books.map(b=>[b.title,b.author,b.titleReading,b.authorReading,b.category,b.publisher,b.publisherFree,b.upper,b.middle,b.lower,b.masterpiece,b.read,b.owned,b.memo,b.remarks])];name='書籍読込用';sheet='書籍読込用'}else{rows=[['タイトル','作者','出版社','巻数','ISBN'],...books.map(b=>[b.title,b.author,b.publisher,b.volume,b.isbn?('ISBN '+String(b.isbn).replace(/[^0-9Xx]/g,'')):''])];name='コミック読込用';sheet='コミック読込用'}const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')} $('excel').onclick=exportXlsx;render();</script></body></html>
